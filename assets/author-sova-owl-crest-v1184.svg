<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="500" height="620" role="img" aria-labelledby="title desc">
<title id="title">Герб SOVA58: белая сова в золотом щите</title>
<desc id="desc">Изящная белоснежная сова с сапфировыми глазами, золотой короной, хрустальным сердцем и распахнутыми крыльями на тёмно-синем щите</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1">
  <stop offset="0" stop-color="#81552a"/><stop offset=".13" stop-color="#fae4ac"/>
  <stop offset=".31" stop-color="#c18c3b"/><stop offset=".53" stop-color="#fff4c9"/>
  <stop offset=".72" stop-color="#b37c33"/><stop offset=".88" stop-color="#f9da92"/>
  <stop offset="1" stop-color="#87531b"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1=".2" x2="1" y2="1">
  <stop offset="0" stop-color="#fff5cf"/><stop offset=".34" stop-color="#cda35d"/>
  <stop offset=".62" stop-color="#785327"/><stop offset="1" stop-color="#fce0a0"/>
 </linearGradient>
 <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#263b70"/><stop offset=".32" stop-color="#102b54"/>
  <stop offset=".72" stop-color="#081b3b"/><stop offset="1" stop-color="#060f29"/>
 </linearGradient>
 <radialGradient id="nebula">
  <stop stop-color="#76bfff" stop-opacity=".28"/><stop offset=".53" stop-color="#706cc6" stop-opacity=".13"/>
  <stop offset="1" stop-color="#15223e" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="white" x1=".12" y1="0" x2=".86" y2="1">
  <stop stop-color="#fffdf1"/><stop offset=".32" stop-color="#f5faff"/>
  <stop offset=".66" stop-color="#bfd9ee"/><stop offset="1" stop-color="#7eaacb"/>
 </linearGradient>
 <linearGradient id="face" x1=".15" y1="0" x2=".79" y2="1">
  <stop stop-color="#fffdf5"/><stop offset=".5" stop-color="#ecf7ff"/><stop offset="1" stop-color="#bdd7eb"/>
 </linearGradient>
 <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#f6faff"/><stop offset=".48" stop-color="#b9d4eb"/><stop offset="1" stop-color="#5788bc"/>
 </linearGradient>
 <linearGradient id="wingBlue" x1="0" y1="0" x2=".85" y2="1">
  <stop stop-color="#c9f6ff"/><stop offset=".33" stop-color="#72cced"/>
  <stop offset=".62" stop-color="#365c9c"/><stop offset="1" stop-color="#18254b"/>
 </linearGradient>
 <linearGradient id="gem" x1=".1" y1="0" x2=".95" y2="1">
  <stop stop-color="#f7ffff"/><stop offset=".19" stop-color="#b9f4ff"/><stop offset=".39" stop-color="#3eaaf7"/>
  <stop offset=".65" stop-color="#2459be"/><stop offset=".87" stop-color="#122f76"/><stop offset="1" stop-color="#7c7fce"/>
 </linearGradient>
 <radialGradient id="iris">
  <stop stop-color="#071a3e"/><stop offset=".27" stop-color="#092e71"/>
  <stop offset=".57" stop-color="#079bdc"/><stop offset=".82" stop-color="#93f1ff"/><stop offset="1" stop-color="#0b407d"/>
 </radialGradient>
 <linearGradient id="beak" x1="0" y1="0" x2="1" y2=".9">
  <stop stop-color="#fff2b6"/><stop offset=".4" stop-color="#d7ad62"/><stop offset="1" stop-color="#7a4621"/>
 </linearGradient>
 <radialGradient id="glow"><stop stop-color="#a6ddff" stop-opacity=".48"/><stop offset="1" stop-color="#5c71d2" stop-opacity="0"/></radialGradient>
 <filter id="shine" x="-60%" y="-60%" width="220%" height="220%">

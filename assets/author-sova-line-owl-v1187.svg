   <path d="M250 297C232 269 201 265 183 281C166 295 170 324 188 341C205 357 233 355 250 329" stroke-width="2.4"/>
   <path d="M246 300C225 277 201 275 185 291" stroke-width="1.5" opacity=".88"/>
   <path d="M184 312Q188 339 217 345" stroke-width="1.25" opacity=".88"/>
   <path d="M186 289Q211 271 239 293" stroke-width="2.4"/>
   <path d="M187 291Q210 276 236 295Q211 313 187 291Z" stroke-width="1.8"/>
   <path d="M197 347Q213 365 235 370" stroke-width="1.25" opacity=".8"/>
 </g>
</defs>
<!-- A restrained gold frame from the original shield, softer and less imposing. -->
<ellipse cx="250" cy="323" rx="220" ry="261" fill="url(#halo)"/>
<path d="M250 565Q141 516 101 414Q91 385 91 340V224L250 132L409 224V340Q409 385 399 414Q359 516 250 565Z" fill="url(#navy)" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round"/>
<path d="M250 545Q158 501 120 408Q112 378 112 338V237L250 155L388 237V338Q388 378 380 408Q342 501 250 545Z" fill="none" stroke="url(#lightgold)" stroke-width="1.6" stroke-opacity=".82"/>
<path d="M250 555Q150 506 111 411V230L250 143L389 230V411Q350 506 250 555Z" fill="none" stroke="#f8d7a2" stroke-width="1" stroke-opacity=".4"/>
<ellipse cx="250" cy="325" rx="136" ry="192" fill="url(#halo)"/>

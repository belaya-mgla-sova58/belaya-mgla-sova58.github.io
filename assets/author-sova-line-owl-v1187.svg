<g fill="#dcf9ff" opacity=".8"><circle cx="141" cy="253" r="1.4"/><circle cx="359" cy="253" r="1.4"/><circle cx="175" cy="437" r="1.2"/><circle cx="325" cy="437" r="1.2"/></g>
<g stroke="#e7d19f" stroke-width="1.3" stroke-linecap="round" opacity=".85"><path d="M144 242v12m-6-6h12M356 242v12m-6-6h12M250 571v15m-7.5-7.5h15"/></g>
<circle cx="250" cy="599" r="3" fill="#e9d198"/>

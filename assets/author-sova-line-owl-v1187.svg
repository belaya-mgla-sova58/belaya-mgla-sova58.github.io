<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="500" height="620" role="img" aria-labelledby="title desc">
<title id="title">SOVA58 — нежная сова из золотых линий</title>
<desc id="desc">Изящная добрая сова, нарисованная плавными тонкими золотыми линиями, с круглыми сапфировыми глазами, короной и небольшим сияющим кристаллом</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#af7b38"/><stop offset=".18" stop-color="#fbe5ab"/><stop offset=".44" stop-color="#ca9653"/><stop offset=".66" stop-color="#fff3cb"/><stop offset=".85" stop-color="#c18a40"/><stop offset="1" stop-color="#f8d48c"/></linearGradient>
 <linearGradient id="lightgold" x1=".05" y1="0" x2=".89" y2=".91"><stop stop-color="#fff8dc"/><stop offset=".42" stop-color="#f6dba0"/><stop offset="1" stop-color="#b98541"/></linearGradient>
 <linearGradient id="navy" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#284a79"/><stop offset=".43" stop-color="#122c50"/><stop offset=".85" stop-color="#091832"/><stop offset="1" stop-color="#071127"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#68bbff" stop-opacity=".26"/><stop offset=".67" stop-color="#637fc4" stop-opacity=".1"/><stop offset="1" stop-color="#12284c" stop-opacity="0"/></radialGradient>
 <radialGradient id="iris"><stop stop-color="#216aad"/><stop offset=".6" stop-color="#48cefa"/><stop offset=".9" stop-color="#b5f6ff"/><stop offset="1" stop-color="#2f76a2"/></radialGradient>
 <linearGradient id="gem" x1=".1" y1="0" x2=".95" y2=".98"><stop stop-color="#f3ffff"/><stop offset=".22" stop-color="#9feaff"/><stop offset=".45" stop-color="#38a8e6"/><stop offset=".77" stop-color="#284ca2"/><stop offset="1" stop-color="#7663b0"/></linearGradient>
 <filter id="soft" x="-75%" y="-75%" width="250%" height="250%"><feGaussianBlur stdDeviation="8"/></filter>
 <g id="wing">
   <path d="M217 375C164 366 119 331 80 283C88 325 112 358 151 380C121 373 90 356 64 337C81 388 112 414 160 423C132 429 108 443 92 461C144 465 179 443 216 407" stroke-width="3.2"/>
   <path d="M191 379C148 365 115 336 96 306M167 396C127 386 104 366 85 352M160 421C129 419 111 409 94 395" stroke-width="1.65" opacity=".85"/>
   <path d="M183 381Q156 368 139 352M175 407Q147 400 133 389M179 427Q148 447 122 449" stroke-width="1.3" opacity=".78"/>
 </g>
 <g id="facehalf">
   <path d="M250 241C219 221 190 224 169 247C152 267 147 300 159 326C170 353 189 370 219 379C231 382 241 385 250 393" stroke-width="3"/>

<g stroke="url(#gold)" fill="none" stroke-linejoin="round" stroke-linecap="round">
 <path d="M155 169L135 93L184 121L210 51L250 101L290 51L316 121L365 93L345 169" stroke-width="4.3"/>
 <path d="M161 165Q250 151 339 165" stroke-width="2.5"/>

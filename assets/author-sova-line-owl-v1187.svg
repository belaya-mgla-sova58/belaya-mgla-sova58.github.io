 <use href="#wing"/>
 <use href="#wing" transform="translate(500 0) scale(-1 1)"/>
</g>
<g fill="none" stroke="url(#lightgold)" stroke-linecap="round" stroke-linejoin="round">
 <use href="#facehalf"/>
 <use href="#facehalf" transform="translate(500 0) scale(-1 1)"/>
 <!-- A soft heart-shaped contour under the round face. -->
 <path d="M200 365Q222 388 250 387Q278 388 300 365" stroke-width="1.8"/>
 <path d="M214 374Q206 418 225 470Q234 494 250 518Q266 494 275 470Q294 418 286 374" stroke-width="2.8"/>
 <path d="M227 388Q223 443 250 493Q277 443 273 388" stroke-width="1.5"/>
 <path d="M202 408Q209 458 239 503M298 408Q291 458 261 503" stroke-width="1.2" opacity=".76"/>
 <path d="M221 487Q232 509 250 531Q268 509 279 487" stroke-width="1.4"/>
 <path d="M250 523V542" stroke-width="1.2"/>
</g>
<!-- Large, friendly round eyes with tiny highlights. -->
<g>
 <circle cx="210" cy="294" r="11" fill="url(#iris)" stroke="url(#lightgold)" stroke-width="1.8"/>
 <circle cx="290" cy="294" r="11" fill="url(#iris)" stroke="url(#lightgold)" stroke-width="1.8"/>
 <circle cx="210" cy="296" r="4.2" fill="#15366c"/>
 <circle cx="290" cy="296" r="4.2" fill="#15366c"/>
 <circle cx="207" cy="290" r="3.2" fill="#f2ffff"/>
 <circle cx="287" cy="290" r="3.2" fill="#f2ffff"/>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620" role="img" aria-labelledby="title desc">
<title id="title">Золотая сова SOVA58</title>
<desc id="desc">Линейная сова из тонкой золотой вязи прежнего герба с сапфировым кристаллом, короной и симметричными крыльями</desc>

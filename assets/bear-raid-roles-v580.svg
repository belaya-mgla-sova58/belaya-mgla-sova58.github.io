<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Создатель рейда не равен участнику рейда</title>
<desc id="desc">Схема для Охоты на медведя: у создателя рейда работают все три героя, а у участника в бонус рейда идёт первый экспедиционный навык крайнего левого героя. В общий бонус рейда попадает максимум четыре первых навыка участников.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182f"/><stop offset=".48" stop-color="#092844"/><stop offset="1" stop-color="#041221"/></linearGradient>
  <radialGradient id="aurora" cx="72%" cy="6%" r="58%"><stop stop-color="#1bd4d5" stop-opacity=".22"/><stop offset=".45" stop-color="#2788dc" stop-opacity=".1"/><stop offset="1" stop-color="#07192e" stop-opacity="0"/></radialGradient>
  <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eefaff"/><stop offset="1" stop-color="#9ed9ff"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffbb42"/><stop offset="1" stop-color="#ff7a18"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72eaff"/><stop offset="1" stop-color="#188bff"/></linearGradient>
  <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2231" stop-opacity=".98"/><stop offset="1" stop-color="#251b17" stop-opacity=".96"/></linearGradient>
  <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2740" stop-opacity=".98"/><stop offset="1" stop-color="#071a2d" stop-opacity=".98"/></linearGradient>
  <filter id="glowO" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowB" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#aurora)"/>
<!-- distant winter mountains -->
<path d="M0 390L170 225l92 113 132-177 132 181 116-118 115 142 123-210 127 196 105-118 128 149 128-183 152 190v177H0z" fill="#0d3153" opacity=".5"/>
<path d="M0 455l138-116 82 67 111-105 103 116 97-85 111 112 118-119 121 123 94-82 101 90 119-114 105 91 100-111 100 125v168H0z" fill="#09243e" opacity=".82"/>
<path d="M0 770c210-50 350-24 520 6 208 37 390 1 598-18 181-17 331 4 482 48v94H0z" fill="#d5edff" opacity=".12"/>
<!-- snow -->
<g fill="#dff6ff" opacity=".72">
<circle cx="82" cy="135" r="3"/><circle cx="214" cy="72" r="2"/><circle cx="336" cy="188" r="3"/><circle cx="511" cy="87" r="2"/><circle cx="658" cy="142" r="2.5"/><circle cx="790" cy="58" r="2"/><circle cx="942" cy="118" r="3"/><circle cx="1091" cy="66" r="2.5"/><circle cx="1248" cy="139" r="2"/><circle cx="1394" cy="85" r="3"/><circle cx="1517" cy="191" r="2"/>
<circle cx="120" cy="628" r="2"/><circle cx="248" cy="708" r="3"/><circle cx="472" cy="663" r="2"/><circle cx="689" cy="734" r="3"/><circle cx="894" cy="682" r="2"/><circle cx="1110" cy="720" r="3"/><circle cx="1328" cy="655" r="2"/><circle cx="1490" cy="741" r="3"/>
</g>
<!-- heading -->
<g font-family="Arial,Segoe UI,sans-serif">
<text x="110" y="92" fill="#8fdcff" font-size="21" font-weight="700" letter-spacing="5">❄  НЕ ПУТАЙТЕ ДВЕ РОЛИ</text>
<text x="110" y="173" fill="url(#ice)" font-size="64" font-weight="900">Создатель рейда</text>
<text x="110" y="244" fill="#ff9a26" font-size="72" font-weight="900">≠</text>
<text x="205" y="244" fill="url(#ice)" font-size="64" font-weight="900">участник</text>
<rect x="1008" y="124" width="475" height="118" rx="22" fill="#06192c" fill-opacity=".72" stroke="#56c9ff" stroke-opacity=".24"/>
<text x="1050" y="171" fill="#d9efff" font-size="25" font-weight="600">У них игра учитывает разные</text>
<text x="1050" y="207" fill="#d9efff" font-size="25" font-weight="600">навыки и характеристики.</text>
<!-- left panel -->
<rect x="90" y="324" width="704" height="392" rx="28" fill="url(#leftPanel)" stroke="#ff9d2e" stroke-width="3" filter="url(#shadow)"/>
<path d="M90 374h704" stroke="#ff9d2e" stroke-opacity=".28"/>
<circle cx="135" cy="371" r="25" fill="#ff8a1d" fill-opacity=".18" stroke="#ff9d2e"/>
<path d="M124 362l22 18M146 362l-22 18" stroke="#ffad3f" stroke-width="7" stroke-linecap="round"/>
<text x="180" y="383" fill="#ffae3a" font-size="33" font-weight="900">СОЗДАТЕЛЬ РЕЙДА</text>
<!-- left cards -->
<g>
<rect x="125" y="426" width="188" height="205" rx="22" fill="#2b231c" stroke="#ff9d2e" stroke-width="3"/>
<rect x="348" y="426" width="188" height="205" rx="22" fill="#2b231c" stroke="#ff9d2e" stroke-width="3"/>
<rect x="571" y="426" width="188" height="205" rx="22" fill="#2b231c" stroke="#ff9d2e" stroke-width="3"/>
<text x="219" y="516" text-anchor="middle" fill="url(#orange)" font-size="72" font-weight="900" filter="url(#glowO)">1</text>
<text x="442" y="516" text-anchor="middle" fill="url(#orange)" font-size="72" font-weight="900" filter="url(#glowO)">2</text>
<text x="665" y="516" text-anchor="middle" fill="url(#orange)" font-size="72" font-weight="900" filter="url(#glowO)">3</text>
<text x="219" y="579" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">РАБОТАЕТ</text>
<text x="442" y="579" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">РАБОТАЕТ</text>
<text x="665" y="579" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">РАБОТАЕТ</text>
</g>
<rect x="124" y="651" width="636" height="43" rx="12" fill="#0b1828" fill-opacity=".8"/>
<text x="442" y="680" text-anchor="middle" fill="#cde8ff" font-size="22">Характеристики · навыки · экипировка</text>
<!-- right panel -->
<rect x="825" y="324" width="685" height="392" rx="28" fill="url(#rightPanel)" stroke="#3ebcff" stroke-width="3" filter="url(#shadow)"/>
<path d="M825 374h685" stroke="#4cc8ff" stroke-opacity=".28"/>
<circle cx="870" cy="371" r="25" fill="#168fe8" fill-opacity=".22" stroke="#48caff"/>
<circle cx="861" cy="367" r="7" fill="#72dcff"/><circle cx="879" cy="367" r="7" fill="#72dcff"/><path d="M849 385c4-11 14-15 21-15s17 4 21 15" fill="none" stroke="#72dcff" stroke-width="7" stroke-linecap="round"/>
<text x="915" y="383" fill="#67d8ff" font-size="33" font-weight="900">УЧАСТНИК РЕЙДА</text>
<!-- right cards -->
<rect x="858" y="426" width="188" height="205" rx="22" fill="#092b45" stroke="#45ceff" stroke-width="4" filter="url(#glowB)"/>
<rect x="1070" y="426" width="188" height="205" rx="22" fill="#101f31" stroke="#44586d" stroke-width="2"/>
<rect x="1282" y="426" width="188" height="205" rx="22" fill="#101f31" stroke="#44586d" stroke-width="2"/>
<text x="952" y="510" text-anchor="middle" fill="url(#blue)" font-size="72" font-weight="900">1</text>
<text x="1164" y="510" text-anchor="middle" fill="#758ca2" font-size="64" font-weight="900">2</text>
<text x="1376" y="510" text-anchor="middle" fill="#758ca2" font-size="64" font-weight="900">3</text>
<text x="952" y="558" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">1-Й ЭКСП.</text>
<text x="952" y="588" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">НАВЫК</text>
<text x="1164" y="579" text-anchor="middle" fill="#7890a7" font-size="19" font-weight="700">ВМЕСТИМОСТЬ</text>
<text x="1376" y="579" text-anchor="middle" fill="#7890a7" font-size="19" font-weight="700">ВМЕСТИМОСТЬ</text>
<rect x="859" y="651" width="610" height="43" rx="12" fill="#061827" fill-opacity=".92"/>
<text x="1164" y="680" text-anchor="middle" fill="#cde8ff" font-size="22">Бонус даёт крайний левый герой</text>
<!-- bottom rule -->
<rect x="265" y="759" width="1070" height="74" rx="18" fill="#0a1c30" fill-opacity=".94" stroke="#ffad3c" stroke-opacity=".65" stroke-width="2"/>
<polygon points="315,776 329,803 359,807 337,827 342,856 315,842 288,856 293,827 271,807 301,803" fill="#ffc24d" opacity=".95" transform="scale(.6) translate(210 510)"/>
<text x="800" y="806" text-anchor="middle" fill="#e8f5ff" font-size="27" font-weight="600">В общий бонус рейда попадает <tspan fill="#ffc052" font-weight="900">максимум 4 первых навыка участников</tspan></text>
</g>
</svg>
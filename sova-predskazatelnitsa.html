<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b24">
<title>Сова-предсказательница</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:#080b21}body{min-height:100svh;overflow-x:hidden;background:
radial-gradient(circle at 50% 28%,rgba(99,57,180,.32),transparent 30%),
radial-gradient(circle at 18% 78%,rgba(31,111,190,.18),transparent 28%),
linear-gradient(180deg,#080b21 0%,#11112e 56%,#080b20 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.58;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.35px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 82%)}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;align-items:center;justify-items:center;padding:18px 16px calc(24px + env(safe-area-inset-bottom));position:relative;isolation:isolate}
.top{text-align:center;z-index:2}.title{margin:4px 0 2px;font-size:clamp(25px,6vw,42px);font-weight:900;letter-spacing:.01em;text-shadow:0 2px 18px rgba(200,147,255,.35)}.sub{margin:0;color:#d9cffa;font-size:14px;font-weight:700}
.stage{width:min(96vw,760px);display:grid;grid-template-columns:minmax(120px,230px) minmax(240px,470px);align-items:end;justify-content:center;gap:clamp(0px,2vw,18px);position:relative;margin-top:6px}
.owl-wrap{align-self:end;justify-self:end;z-index:3;filter:drop-shadow(0 18px 24px rgba(70,36,130,.42));animation:owlFloat 3.4s ease-in-out infinite}.owl{display:block;width:min(31vw,220px);height:auto;user-select:none;-webkit-user-drag:none}.owl.sleep{display:none}.owl-wrap.exhausted .owl.active{display:none}.owl-wrap.exhausted .owl.sleep{display:block}
.ball-button{position:relative;width:min(64vw,450px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center;z-index:2;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 24px 42px rgba(93,42,198,.42))}.ball-button:focus-visible{outline:2px solid #efe3ff;outline-offset:8px;border-radius:50%}
.ball-halo{position:absolute;inset:10%;border-radius:50%;background:conic-gradient(from 0deg,rgba(148,79,255,.05),rgba(120,218,255,.46),rgba(255,109,221,.40),rgba(148,79,255,.05));filter:blur(14px);animation:spin 8s linear infinite,haloPulse 2.8s ease-in-out infinite;opacity:.9}.ball-ring{position:absolute;inset:14%;border-radius:50%;border:2px solid rgba(232,217,255,.22);box-shadow:0 0 22px rgba(157,92,255,.75),0 0 52px rgba(83,157,255,.55),inset 0 0 25px rgba(215,194,255,.22);animation:spinReverse 13s linear infinite}.ball-ring:before,.ball-ring:after{content:"";position:absolute;inset:-8%;border-radius:50%;border:1px dashed rgba(255,255,255,.18)}.ball-ring:after{inset:7%;border-style:solid;border-color:rgba(255,122,223,.16)}
.ball{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;animation:ballTurn 20s linear infinite,ballBreathe 3.2s ease-in-out infinite}.ball-button:hover .ball-halo{filter:blur(12px);opacity:1}.ball-button:active{transform:scale(.985)}
.tap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:5;white-space:nowrap;border:1px solid rgba(255,255,255,.22);background:rgba(14,10,42,.66);backdrop-filter:blur(8px);padding:8px 13px;border-radius:999px;font-weight:850;font-size:13px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.24)}
.reading{width:min(92vw,600px);min-height:102px;margin:8px auto 0;padding:16px 18px;border-radius:24px;border:1px solid rgba(226,203,255,.20);background:linear-gradient(180deg,rgba(24,20,61,.72),rgba(12,14,38,.82));backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.24);text-align:center;display:grid;place-items:center;position:relative;z-index:4}.label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#cdb2ff;margin-bottom:7px}.fortune{font-size:clamp(17px,4.4vw,23px);line-height:1.36;font-weight:800;margin:0;max-width:540px}.fortune.waiting{color:#ded7f4;font-weight:700}.reading.rare{border-color:rgba(255,218,114,.42);box-shadow:0 0 34px rgba(255,199,76,.12),0 18px 50px rgba(0,0,0,.24)}.reading.rare .label{color:#ffd979}
.footer{margin-top:12px;text-align:center;color:#bcb4d8;font-size:13px;font-weight:700;z-index:2}.count{color:#efe8ff}.cooldown{display:block;margin-top:4px;color:#d6c8ff}.hidden{display:none!important}
.flash{position:absolute;inset:15%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.86) 0%,rgba(203,161,255,.34) 36%,transparent 70%);opacity:0;z-index:4}.ball-button.flash-on .flash{animation:flash .72s ease-out}
@keyframes owlFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}@keyframes ballTurn{to{transform:rotate(360deg)}}@keyframes ballBreathe{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.12) saturate(1.12)}}@keyframes haloPulse{0%,100%{transform:scale(.94) rotate(0deg);opacity:.66}50%{transform:scale(1.06) rotate(180deg);opacity:1}}@keyframes flash{0%{opacity:0;transform:scale(.72)}25%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@media(max-width:640px){.page{padding-top:12px}.stage{width:100%;grid-template-columns:116px minmax(230px,1fr);gap:-4px}.owl{width:132px}.owl-wrap{margin-right:-18px;margin-bottom:18px}.ball-button{width:min(74vw,360px)}.reading{margin-top:2px;min-height:112px}.title{font-size:29px}.sub{font-size:13px}}
@media(max-width:390px){.stage{grid-template-columns:96px minmax(220px,1fr)}.owl{width:112px}.owl-wrap{margin-right:-16px}.ball-button{width:min(76vw,330px)}}
@media(prefers-reduced-motion:reduce){.owl-wrap,.ball,.ball-halo,.ball-ring{animation:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="title">Сова-предсказательница 🔮</h1>
    <p class="sub">Три предсказания в день. Новые появятся после полуночи.</p>
  </header>

  <section>
    <div class="stage" aria-label="Сова и магический шар">
      <div class="owl-wrap" id="owlWrap">
        <img class="owl active" src="assets/owl-fortune-active-v930.webp" alt="Сова-предсказательница">
        <img class="owl sleep" src="assets/owl-fortune-sleep-v930.webp" alt="Спящая сова">
      </div>
      <button class="ball-button" id="ballButton" type="button" aria-label="Получить предсказание">
        <span class="ball-halo" aria-hidden="true"></span>
        <span class="ball-ring" aria-hidden="true"></span>
        <img class="ball" src="assets/owl-fortune-ball-v930.webp" alt="Светящийся магический шар">
        <span class="flash" aria-hidden="true"></span>
        <span class="tap" id="tapHint">Нажми на шар</span>
      </button>
    </div>

    <div class="reading" id="reading" aria-live="polite">
      <div>
        <div class="label" id="label">Предсказание совы</div>
        <p class="fortune waiting" id="fortune">Шар уже проснулся. Осталось его спросить ✨</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span class="count" id="count"></span>
    <span class="cooldown hidden" id="cooldown"></span>
  </footer>
</main>
<script>
(()=>{
'use strict';
const MAX=3, RARE_CHANCE=.02, KEY='sova58-fortune-standalone-v1';
const NORMAL=[
'Сегодня тебя ждёт приятный сюрприз.','Не спеши: нужный момент уже приближается.','К вечеру появится повод улыбнуться.','Кто-то неожиданно окажется на твоей стороне.','Сегодня лучше довериться интуиции.','Хорошая новость придёт оттуда, откуда ты её не ждёшь.','День окажется спокойнее, чем кажется утром.','Небольшой риск может принести приятный результат.','Сегодня одна случайность сыграет тебе на руку.','Не игнорируй странную идею. В ней что-то есть.',
'В ближайшее время пригодится твоё чувство юмора.','Кто-то вспомнит о тебе с теплом.','Сегодня лучше закончить старое, чем начинать десять новых дел.','Один разговор многое расставит по местам.','Терпение сегодня сильнее скорости.','В твою пользу сработает то, что раньше казалось мелочью.','Сегодня можно позволить себе немного наглости. Совсем немного.','Удача рядом. Главное, не пройти мимо неё с закрытыми глазами.','Скоро появится повод сказать: «А я так и знала».','Сегодня судьба явно что-то задумала.',
'Неожиданный союз окажется полезнее долгих расчётов.','Маленькая победа сегодня важнее большого плана на завтра.','Не спорь с удачным совпадением. Просто бери.','Сегодня тебе может повезти там, где обычно всё идёт наперекосяк.','Один человек приятно удивит тебя.','День подходит для решения вопроса, который давно откладывался.','Неожиданная идея окажется практичнее, чем кажется.','Сегодня кто-то оценит то, что ты обычно считаешь мелочью.','Есть шанс получить больше, чем ты рассчитываешь.','Сова советует не отвечать слишком быстро.',
'То, что сегодня кажется задержкой, позже окажется полезным.','К вечеру станет понятно, зачем всё так странно начиналось.','Сегодня лучше идти своим темпом.','Нужная подсказка попадётся случайно.','Кто-то скажет фразу, которую стоит запомнить.','Сегодня твоя настойчивость будет вознаграждена.','Неожиданное «да» вполне возможно.','То, что казалось закрытым, может снова открыться.','День хорош для маленьких хитрых решений.','Сегодня лучше слушать не самого громкого человека.',
'Один выбор окажется проще, чем ты думаешь.','Скоро появится новый повод что-то отпраздновать.','Сегодня не всё нужно контролировать.','Кто-то поможет тебе без долгих уговоров.','Нужный ответ уже ближе, чем кажется.','Сегодня может сработать план, который ты считала запасным.','Будет повод немного собой гордиться.','Неожиданное сообщение изменит настроение дня.','Сегодня лучше оставить немного места для импровизации.','Одна ошибка окажется не такой уж ошибкой.',
'Кто-то заметит твои усилия.','День подойдёт для смелого, но не безумного шага.','Сегодня удача любит тех, кто не суетится.','Небольшая пауза поможет увидеть очевидное.','Что-то важное решится без твоего вмешательства.','Сегодня ты окажешься в нужном месте в нужный момент.','Один старый вопрос наконец начнёт двигаться.','Сова видит приятное совпадение.','Сегодня возможен неожиданный комплимент.','Не всё, что выглядит серьёзно, действительно серьёзно.',
'День благоприятен для переговоров и договорённостей.','Сегодня кому-то понадобится именно твой совет.','Один маленький жест даст большой эффект.','Скоро ты узнаешь то, что давно хотелось понять.','Сегодня лучше не отменять планы слишком рано.','Случайная встреча или разговор может оказаться полезным.','День принесёт маленькую, но очень своевременную помощь.','Сегодня можно немного довериться случаю.','То, чего ты опасалась, окажется проще.','К вечеру станет легче.',
'Сегодня есть шанс выиграть там, где ты не рассчитывала.','Неожиданная поддержка придёт вовремя.','Сова советует не недооценивать запасной вариант.','Сегодня хороший день, чтобы попросить о том, что тебе нужно.','Один человек окажется добрее, чем кажется.','Сегодня стоит внимательнее смотреть на детали.','Небольшое изменение принесёт заметный результат.','Скоро появится причина поменять мнение.','Сегодня твой юмор спасёт ситуацию.','В ближайшее время кто-то сам сделает первый шаг.',
'Сегодня не бойся выбрать более простой путь.','Удача может спрятаться в обычном деле.','Один разговор даст больше, чем десять догадок.','Сегодня подходящий момент для второго шанса.','Скоро ты получишь подтверждение, что двигалась правильно.','Сегодня возможна приятная неожиданность.','Неожиданный поворот окажется в твою пользу.','День лучше начнётся после первой чашки чего-нибудь вкусного.','Сегодня кто-то вспомнит твою доброту.','Сова видит маленький триумф.',
'Сегодня стоит чуть меньше сомневаться.','Скоро появится повод сказать: «Ну наконец-то».','Сегодня одно решение сэкономит тебе много времени.','Нужный человек объявится сам.','Сегодня не стоит бояться поменять план.','Вечером настроение будет лучше утреннего.','Сова видит шанс получить приятный бонус.','Сегодня тебе пригодится спокойствие.','Скоро станет ясно, что одна задержка была к лучшему.','Сегодня удача любит тех, кто умеет вовремя остановиться.'
];
const RARE=['Золотой знак ✨ Сегодня удача решила играть за тебя.','Редкое предсказание ✨ Одно желание получит неожиданно хороший шанс.','Сова видит золотую нить ✨ Скоро произойдёт событие, которое ты ещё долго будешь вспоминать.','Редкий знак ✨ Ты окажешься там, где случайность внезапно станет подарком.','Золотое перо ✨ В ближайшее время тебе выпадет шанс, который бывает нечасто.'];
const $=s=>document.querySelector(s), owl=$('#owlWrap'), ball=$('#ballButton'), tap=$('#tapHint'), reading=$('#reading'), label=$('#label'), fortune=$('#fortune'), count=$('#count'), cooldown=$('#cooldown');
const day=()=>{const d=new Date;return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const load=()=>{try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x.day===day()?{day:x.day,count:+x.count||0,used:Array.isArray(x.used)?x.used:[]}:{day:day(),count:0,used:[]}}catch(e){return{day:day(),count:0,used:[]}}};
const save=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const midnight=()=>{const d=new Date;d.setHours(24,0,0,0);return d.getTime()};
const fmt=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};
let state=load(), busy=false;
function sync(){
  if(state.day!==day()){state={day:day(),count:0,used:[]};save(state);fortune.textContent='Шар снова готов. Спроси его ✨';fortune.className='fortune waiting';reading.classList.remove('rare')}
  const left=Math.max(0,MAX-state.count), exhausted=left===0;
  owl.classList.toggle('exhausted',exhausted);ball.disabled=exhausted;tap.textContent=exhausted?'Сова отдыхает':'Нажми на шар';
  count.textContent=exhausted?'На сегодня всё 🔮':`Осталось предсказаний: ${left} из ${MAX}`;
  cooldown.classList.toggle('hidden',!exhausted);
  if(exhausted) cooldown.textContent=`До новых предсказаний: ${fmt(midnight()-Date.now())}`;
}
function pick(){
  const rare=Math.random()<RARE_CHANCE;
  if(rare)return{rare:true,text:RARE[Math.floor(Math.random()*RARE.length)]};
  let pool=NORMAL.filter(x=>!state.used.includes(x));if(!pool.length){state.used=[];pool=NORMAL.slice()}
  const text=pool[Math.floor(Math.random()*pool.length)];state.used.push(text);return{rare:false,text};
}
ball.addEventListener('click',()=>{
  if(busy||state.count>=MAX)return;busy=true;ball.classList.remove('flash-on');void ball.offsetWidth;ball.classList.add('flash-on');tap.textContent='Сова смотрит...';
  setTimeout(()=>{
    const p=pick();state.count++;save(state);reading.classList.toggle('rare',p.rare);label.textContent=p.rare?'Редкое предсказание ✨':'Предсказание совы';fortune.className='fortune';fortune.textContent=p.text;busy=false;sync();
    if(state.count>=MAX){setTimeout(()=>{fortune.className='fortune waiting';fortune.textContent='Сова устала 😴🔮 Новые предсказания появятся после 00:00.'},4200)}
  },720);
});
setInterval(sync,1000);sync();
})();
</script>
</body>
</html>

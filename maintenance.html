<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#03112d">
  <title>Белая Мгла • Глобальное обновление</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root{
      color-scheme:dark;
      --bg:#03112d;
      --bg2:#061a3d;
      --panel:rgba(7,29,72,.88);
      --line:rgba(75,166,255,.35);
      --text:#f7fbff;
      --muted:#afc1dc;
      --blue:#33b8ff;
      --gold:#f2bf45;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow:hidden;
      color:var(--text);
      background:
        radial-gradient(circle at 50% -12%,rgba(55,93,190,.34),transparent 38%),
        radial-gradient(circle at 12% 80%,rgba(20,91,182,.18),transparent 34%),
        radial-gradient(circle at 88% 72%,rgba(99,65,190,.14),transparent 32%),
        linear-gradient(180deg,#03112d 0%,#041735 52%,#021027 100%);
    }
    body:before,
    body:after{
      content:"";
      position:fixed;
      inset:-20%;
      pointer-events:none;
      opacity:.28;
      background-image:
        radial-gradient(circle,rgba(255,255,255,.78) 0 1px,transparent 1.4px),
        radial-gradient(circle,rgba(131,204,255,.65) 0 1px,transparent 1.5px);
      background-size:72px 72px,108px 108px;
      background-position:0 0,28px 34px;
      animation:snow 22s linear infinite;
    }
    body:after{
      opacity:.13;
      transform:scale(1.25);
      animation-duration:34s;
      animation-direction:reverse;
    }
    @keyframes snow{
      to{background-position:0 720px,28px 1114px}
    }
    .wrap{
      position:relative;
      z-index:2;
      width:min(720px,calc(100% - 28px));
      padding:22px;
    }
    .card{
      position:relative;
      overflow:hidden;
      padding:clamp(28px,6vw,54px);
      border:1px solid var(--line);
      border-radius:28px;
      text-align:center;
      background:
        radial-gradient(circle at 50% 0%,rgba(47,111,224,.20),transparent 42%),
        linear-gradient(145deg,rgba(8,34,82,.95),rgba(4,20,51,.97));
      box-shadow:
        0 28px 70px rgba(0,6,22,.48),
        inset 0 1px 0 rgba(255,255,255,.07);
      backdrop-filter:blur(16px);
    }
    .card:before{
      content:"";
      position:absolute;
      left:10%;right:10%;top:0;
      height:1px;
      background:linear-gradient(90deg,transparent,#68cfff,transparent);
      box-shadow:0 0 18px rgba(73,190,255,.55);
    }
    .logo{
      display:block;
      width:min(270px,72%);
      max-height:112px;
      object-fit:contain;
      margin:0 auto 24px;
      filter:drop-shadow(0 8px 16px rgba(0,8,28,.28));
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:16px;
      padding:8px 13px;
      border:1px solid rgba(89,179,255,.28);
      border-radius:999px;
      background:rgba(12,55,111,.45);
      color:#bfe7ff;
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .badge:before{content:"❄";color:#71d2ff}
    h1{
      margin:0;
      font-size:clamp(34px,7vw,62px);
      line-height:.98;
      letter-spacing:-.035em;
      color:#fff;
      text-shadow:0 0 26px rgba(72,157,255,.18);
    }
    .accent{
      display:block;
      margin-top:7px;
      color:#8edcff;
    }
    p{
      max-width:540px;
      margin:20px auto 0;
      color:var(--muted);
      font-size:clamp(15px,2.4vw,19px);
      line-height:1.55;
    }
    .status{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:28px auto 0;
      color:#dcecff;
      font-size:13px;
      font-weight:800;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background:#55c9ff;
      box-shadow:0 0 12px #38baff;
      animation:pulse 1.7s ease-in-out infinite;
    }
    @keyframes pulse{
      50%{opacity:.35;transform:scale(.72)}
    }
    .footer{
      margin-top:28px;
      color:#708bad;
      font-size:11px;
    }
    @media(max-width:520px){
      .wrap{padding:12px}
      .card{padding:30px 18px;border-radius:22px}
      .logo{width:min(230px,78%);margin-bottom:20px}
      .badge{font-size:10px;padding:7px 11px}
      p{font-size:14px;line-height:1.5}
      .status{margin-top:23px}
    }
    @media(prefers-reduced-motion:reduce){
      body:before,body:after,.dot{animation:none}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="maintenance-title">
      <img class="logo" src="assets/img_6dc1ef08d6ab264b.webp" alt="Белая мгла">
      <div class="badge">Технические работы</div>
      <h1 id="maintenance-title">Глобальное<span class="accent">обновление сайта</span></h1>
      <p>
        «Белая Мгла» временно закрыта. Мы полностью обновляем оформление,
        навигацию и материалы сайта, чтобы пользоваться им стало удобнее.
      </p>
      <div class="status"><span class="dot"></span> Скоро вернёмся</div>
      <div class="footer">Белая Мгла • Государство 58 • Sova</div>
    </section>
  </main>
</body>
</html>

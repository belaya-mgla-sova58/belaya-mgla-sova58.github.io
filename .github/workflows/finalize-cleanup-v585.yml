name: Finalize site cleanup v585

on:
  push:
    paths:
      - '.github/workflows/finalize-cleanup-v585.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('id="homeTodayProgressV581">0 / 5<','id="homeTodayProgressV581">0 / 3<')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f tools/site_cleanup_v585.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/run-site-cleanup-v585.yml
          rm -f .github/workflows/finalize-cleanup-v585.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize site cleanup v585"
          git push

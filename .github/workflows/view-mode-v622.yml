name: Apply mobile desktop view switch v622

on:
  push:
    paths:
      - 'view-mode-v622.csspart'
      - 'view-mode-v622.jspart'
      - '.github/workflows/view-mode-v622.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply view switch
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'v622: mobile/desktop view switch' site-v269.css; then
            cat view-mode-v622.csspart >> site-v269.css
          fi
          if ! grep -q 'v622: mobile/desktop view switch' site-v269.js; then
            cat view-mode-v622.jspart >> site-v269.js
          fi
          python3 - <<'PY'
          import pathlib,re
          early="""<script id=\"view-mode-early-v622\">(function(){try{var k='sova58-view-mode-v622',m=localStorage.getItem(k);if(m==='desktop'&&(matchMedia('(hover:none)').matches||matchMedia('(pointer:coarse)').matches||Math.min(screen.width||9999,screen.height||9999)<900)){var v=document.querySelector('meta[name=\\\"viewport\\\"]');if(v)v.setAttribute('content','width=1280, initial-scale=0.3, minimum-scale=0.1, maximum-scale=5, user-scalable=yes');document.documentElement.classList.add('force-desktop-root')}}catch(e){}})();</script>"""
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'view-mode-early-v622' not in s:
                  s=re.sub(r'(<meta[^>]+name=[\"\']viewport[\"\'][^>]*>)',r'\1'+early,s,count=1,flags=re.I)
              s=re.sub(r'site-v269\.css\?v=\d+','site-v269.css?v=622',s)
              s=re.sub(r'site-v269\.js\?v=\d+','site-v269.js?v=622',s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v269.css site-v269.js '*.html'
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add mobile and desktop view switch'
            git push
          fi

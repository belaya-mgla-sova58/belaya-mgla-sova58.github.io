name: Run site cleanup v585

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-site-cleanup-v585.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cleanup utility
        run: python3 tools/site_cleanup_v585.py
      - name: Validate JavaScript
        run: node --check site-v269-core-v585.min.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize and simplify site v585"
          git push

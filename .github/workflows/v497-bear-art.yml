name: Publish Bear art v497

on:
  push:
    paths:
      - '.github/workflows/v497-bear-art.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild approved Bear image and wire pages
        shell: bash
        run: |
          cat .tmp/bear497-q40-0.b64 .tmp/bear497-q40-1.b64 .tmp/bear497-q40-2.b64 .tmp/bear497-q40-3.b64 | base64 -d > assets/bear-header-v497.webp
          file assets/bear-header-v497.webp
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('events.html')
          s = p.read_text(encoding='utf-8')
          old = '<a class="guide-nav-card" href="bear.html">Охота на медведя</a>'
          new = '<a aria-label="Охота на медведя" class="guide-nav-card" href="bear.html" title="Охота на медведя" style="position:relative;min-height:0;aspect-ratio:2/1;padding:0;overflow:hidden;border-radius:14px;font-size:0;color:transparent;border:0;box-shadow:none;background:#07142c"><img alt="Охота на медведя" src="assets/bear-header-v497.webp?v=497" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border:0;outline:0;box-shadow:none"/></a>'
          if old not in s:
              raise SystemExit('Bear card marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('bear.html')
          s = p.read_text(encoding='utf-8')
          pat = r'<section class="page-heading-v424 frost-header-v431"><h1>Охота на медведя</h1>.*?</section>'
          newh = '<section class="page-heading-v424 frost-header-v431" style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px;border:0;box-shadow:none"><img alt="Охота на медведя" src="assets/bear-header-v497.webp?v=497" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border:0;outline:0;box-shadow:none"/><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Охота на медведя</h1></section>'
          s, n = re.subn(pat, newh, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Bear heading replacement count={n}')
          s = s.replace('href="assets/img_22767d469133f308.webp" rel="preload"', 'href="assets/bear-header-v497.webp?v=497" rel="preload"', 1)
          s = s.replace('https://belaya-mgla-sova58.github.io/assets/img_22767d469133f308.webp', 'https://belaya-mgla-sova58.github.io/assets/bear-header-v497.webp?v=497')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .tmp/bear497-q40-0.b64 .tmp/bear497-q40-1.b64 .tmp/bear497-q40-2.b64 .tmp/bear497-q40-3.b64
      - name: Commit published Bear art
        shell: bash
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v497: publish approved Bear artwork"
          git push

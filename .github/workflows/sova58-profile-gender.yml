name: SOVA58 profile gender update

on:
  push:
    paths:
      - '.github/workflows/sova58-profile-gender.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clarify SOVA58 profile gender
        shell: python
        run: |
          import pathlib,re
          p=pathlib.Path('sova58.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Независимый сайт с гайдами по Белой мгле от SOVA58. Автор и редактор игровых материалов для сообщества и 58 государства.':'SOVA58 — девушка, игрок 58 государства, автор и редактор гайдов и игровых материалов по Белой мгле.',
            'Независимый сайт с гайдами по Белой мгле от SOVA58. Авторская страница SOVA58, события и материалы для сообщества и 58 государства.':'SOVA58 — девушка, игрок 58 государства и автор гайдов по Белой мгле. Авторская страница, события и материалы для сообщества.',
            '"description":"Автор и редактор гайдов и игровых материалов по Белой мгле для сообщества и 58 государства.","knowsAbout"':'"description":"SOVA58 — девушка, игрок 58 государства, автор и редактор гайдов и игровых материалов по Белой мгле.","gender":"Female","knowsAbout"',
            '<h1>SOVA58</h1><p class="lead">Игрок 58 государства. Собираю полезную информацию по «Белой мгле», проверяю игровые механики и превращаю всё это в понятные гайды, события, подсказки и полезные материалы для игроков.</p>':'<h1>SOVA58</h1><p class="lead"><strong>SOVA58 — девушка и игрок 58 государства.</strong> Собираю полезную информацию по «Белой мгле», проверяю игровые механики и превращаю всё это в понятные гайды, события, подсказки и полезные материалы для игроков.</p>',
            '<section class="author-section-v616"><h2>Обо мне</h2><p>Я делаю этот сайт, чтобы нужную информацию по «Белой мгле» было легко найти, быстро понять и удобно использовать.':'<section class="author-section-v616"><h2>Обо мне</h2><p>Я девушка, играю в 58 государстве и делаю этот сайт, чтобы нужную информацию по «Белой мгле» было легко найти, быстро понять и удобно использовать.'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected text: {old[:80]}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Add the same Person gender signal to guide Article author objects.
          changed=0
          for f in pathlib.Path('.').glob('*.html'):
            if f.name=='sova58.html':
              continue
            t=f.read_text(encoding='utf-8',errors='ignore')
            old=t
            t=t.replace('"author":{"@type":"Person","name":"SOVA58","url":"https://belaya-mgla-sova58.github.io/sova58.html"}',
                        '"author":{"@type":"Person","name":"SOVA58","url":"https://belaya-mgla-sova58.github.io/sova58.html","gender":"Female"}')
            if t!=old:
              f.write_text(t,encoding='utf-8')
              changed+=1
          print('GUIDE_PAGES_UPDATED',changed)

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Clarify that SOVA58 is female'
          git push

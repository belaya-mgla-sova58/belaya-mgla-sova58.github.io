ferrer">Открыть источник ↗</a></div></section><a class="epic-back" href="hero-generations.html">← К поколениям и эпическим героям</a><div class="epic-foot">Белая мгла · SOVA58</div></div></div></main></body></html>'''
              Path(f'hero-{h["slug"]}.html').write_text(html, encoding='utf-8')

          hub = Path('hero-generations.html')
          s = hub.read_text(encoding='utf-8')
          for h in heroes:
              pat = rf'<a class="hero-mini" data-epic="{re.escape(h["slug"])}" href="[^"]+" target="_blank" rel="noopener noreferrer">'
              repl = f'<a class="hero-mini" data-epic="{h["slug"]}" href="hero-{h["slug"]}.html">'
              s, n = re.subn(pat, repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not patch epic link: {h["slug"]}')
          s = s.replace('hero-generations-v716.css?v=718','hero-generations-v716.css?v=719')
          hub.write_text(s, encoding='utf-8')

          css = Path('hero-generations-v716.css')
          c = css.read_text(encoding='utf-8')
          for h in heroes:
              c = re.sub(
                rf'(\.hero-mini\[data-epic="{re.escape(h["slug"])}"\]\{{--portrait:url\(")[^"]+("\)\}})',
                rf'\1assets/heroes/epic/{h["slug"]}/portrait.webp\2',
                c,
                count=1
              )
          css.write_text(c, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          additions = []
          for h in heroes:
              loc = f'https://belaya-mgla-sova58.github.io/hero-{h["slug"]}.html'
              if loc not in sm:
                  additions.append(f'  <url><loc>{loc}</loc></url>')
          if additions:
              sm = sm.replace('</urlset>', '\n' + '\n'.join(additions) + '\n</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
          PY

      - name: Commit epic hero guides

name: Patch Justus from video

on:
  push:
    paths:
      - '.github/workflows/patch-justus-from-video.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Justus section
        run: python3 scripts/patch-justus-from-video.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-update-2026-10-19.html
          git diff --cached --quiet && exit 0
          git commit -m "Update exact Justus skills from new video"
          git push

# run-v2 exact skills from new video

name: Clean generation stylesheet links
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-generation-v716.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate links
        run: perl -0pi -e 's#<link href="hero-generations-v714\.css\?v=715"/><link href="hero-generations-v716\.css\?v=716" rel="stylesheet"/><link href="hero-generations-v716\.css\?v=716" rel="stylesheet"/>#<link href="hero-generations-v714.css?v=715" rel="stylesheet"/><link href="hero-generations-v716.css?v=716" rel="stylesheet"/>#g' hero-generations.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-generations.html
          git commit -m 'Clean generation stylesheet links'
          git push

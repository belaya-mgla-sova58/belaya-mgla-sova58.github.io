name: Cleanup experts editorial text
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-experts-editorial.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove editorial blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('experts.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<a href="#section-9">Как будем обновлять страницу</a>','')
          s=re.sub(r'<details class="guide-section guide-fold-v414" data-guide-fold="9">.*?</details>\s*','',s,count=1,flags=re.S)
          s=re.sub(r'<div class="guide-callout tip"><button aria-label="Скопировать текст блока" class="copy-block-v409" type="button">Скопировать</button><b> Главное:</b>.*?</div>\s*','',s,count=1,flags=re.S)
          s=s.replace('Точные даты появления и порядок следующих экспертов добавляем только после подтверждения для 58 государства.','Точные даты появления следующих экспертов для 58 государства пока не подтверждены.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experts.html
          git diff --cached --quiet || git commit -m 'Remove technical editorial blocks from experts page'
          git push

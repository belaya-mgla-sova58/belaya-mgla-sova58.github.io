name: SOVA58 complete website QA

on:
  workflow_dispatch:
    inputs:
      full_page_screenshots:
        description: 'Full-height screenshots for every page (large archive)'
        required: false
        type: boolean
        default: false
      audit_scope:
        description: 'All 194 pages or quick test of the two repaired pages'
        required: false
        type: choice
        options:
          - all
          - repairs
        default: all
      accessibility:
        description: 'Axe accessibility coverage'
        required: false
        type: choice
        options:
          - desktop
          - all
          - core
          - 'off'
        default: desktop

permissions:
  contents: read

concurrency:
  group: sova58-site-audit
  cancel-in-progress: false

jobs:
  static:
    name: Static paths, HTML, image and PWA references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all files, links and metadata
        run: node tests/static-site-audit.cjs
      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sova58-static
          path: visual-audit-results/
          retention-days: 7
          if-no-files-found: warn

  browser:
    name: 'Browser QA: ${{ matrix.profile }}'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile, tablet, small-mobile, wide-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and accessibility checks
        run: npm install --no-save --no-audit --no-fund playwright axe-core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit page layout and images
        env:
          AUDIT_DEVICE: ${{ matrix.profile }}
          AUDIT_SCOPE: ${{ inputs.audit_scope || 'all' }}
          AUDIT_FULL_PAGE: ${{ inputs.full_page_screenshots && 'all' || 'core' }}
          AUDIT_AXE: ${{ inputs.accessibility || 'desktop' }}
        run: node tests/visual-audit.cjs
      - name: Upload this screen's screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sova58-browser-${{ matrix.profile }}
          path: visual-audit-results/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  pwa:
    name: PWA and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test PWA and offline assets
        run: node tests/pwa-audit.cjs
      - name: Upload PWA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sova58-pwa
          path: visual-audit-results/
          retention-days: 7
          if-no-files-found: warn

  lighthouse:
    if: ${{ inputs.audit_scope != 'repairs' }}
    name: Lighthouse performance and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse and Chromium
        run: npm install --no-save --no-audit --no-fund playwright lighthouse
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scan core pages
        run: node tests/lighthouse-audit.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sova58-lighthouse
          path: visual-audit-results/
          retention-days: 7
          if-no-files-found: warn

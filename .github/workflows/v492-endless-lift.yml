name: Lift Endless Trial header v492

on:
  push:
    paths:
      - '.github/workflows/v492-endless-lift.yml'

permissions:
  contents: write

jobs:
  lift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lift Endless Trial header slightly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('endless-trial.html')
          s = p.read_text(encoding='utf-8')
          old = 'style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px;border:0;box-shadow:none"'
          new = 'style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px;border:0;box-shadow:none;margin-top:-6px"'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('site-v269.js?v=465', 'site-v269.js?v=491')
          p.write_text(s, encoding='utf-8')
          tmp = Path('.tmp/endless-v492-01.txt')
          if tmp.exists():
              tmp.unlink()
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git add endless-trial.html .tmp || true
          git diff --cached --quiet || git commit -m "v492: lift Endless Trial header slightly"
          git push

name: v477 bear cache fix

on:
  push:
    paths:
      - '.github/workflows/v477-bear-cachefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust bear cache and point metadata to approved art
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('events.html','bear.html'):
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('site-v269.js?v=465', 'site-v269.js?v=477')
              if name == 'bear.html':
                  s = s.replace('assets/img_22767d469133f308.webp', 'assets/bear-approved-v476.svg?v=477')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html bear.html
          git diff --cached --quiet || git commit -m "v477: force approved bear artwork"
          git push

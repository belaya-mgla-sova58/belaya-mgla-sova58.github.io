name: Verify Canyon table responsive fix v988
on:
  push:
    paths: ['.github/workflows/ui-audit-v988.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Confirm production table widths and unaffected guides
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const base='https://belaya-mgla-sova58.github.io/';
          (async()=>{
            const browser=await chromium.launch(),errors=[];
            for(const [mode,viewport] of [['mobile',{width:390,height:844}],['desktop',{width:1440,height:900}]]){
              const ctx=await browser.newContext({viewport,isMobile:mode==='mobile',hasTouch:mode==='mobile',serviceWorkers:'block'});
              for(const file of ['canyon-clash.html','gear.html','bear.html','essence-mithril-calculator.html']){
                const p=await ctx.newPage();
                try{
                  const response=await p.goto(base+file+'?v988-table',{waitUntil:'domcontentloaded',timeout:28000});
                  await p.waitForTimeout(250);
                  if(!response?.ok())throw Error('HTTP '+response?.status());
                  if(file==='canyon-clash.html'){
                    const result=await p.evaluate(()=>{
                      const t=document.querySelector('table.canyon-scores-table-v988'),r=t?.getBoundingClientRect();
                      const sec=t?.closest('.guide-section'),sr=sec?.getBoundingClientRect();
                      return {exists:!!t,bodyOverflow:document.documentElement.scrollWidth-innerWidth,
                        tableWidth:r?.width,tableRight:r?.right,sectionRight:sr?.right,
                        layout:t?getComputedStyle(t).tableLayout:'none',firstColumn:t?.rows[0]?.cells[0]?.getBoundingClientRect().width,
                        lastColumn:t?.rows[0]?.cells[1]?.getBoundingClientRect().width,
                        names:Array.from(t?.rows||[]).map(x=>x.cells[0]?.textContent.trim())};
                    });
                    console.log('CANYON TABLE',mode,JSON.stringify(result));
                    if(!result.exists||result.bodyOverflow>4)throw Error('Canyon table missing or page overflow');
                    if(mode==='mobile'&&(result.tableRight>viewport.width+2||result.tableWidth>viewport.width-30||result.layout!=='fixed'))throw Error('Canyon table too wide on phone');
                  }else{
                    const result=await p.evaluate(()=>{
                      const t=document.querySelector('table'),r=t?.getBoundingClientRect();
                      let a=t?.parentElement,scroll=false;
                      for(let i=0;i<6&&a;i++,a=a.parentElement){
                        const s=getComputedStyle(a);
                        if(['auto','scroll'].includes(s.overflowX) && a.scrollWidth>a.clientWidth+6){scroll=true;break;}
                      }
                      return {hasTable:!!t,horizontallyScrollable:scroll,overflow:document.documentElement.scrollWidth-innerWidth}
                    });
                    console.log('REFERENCE TABLE',mode,file,JSON.stringify(result));
                    if(result.overflow>4)throw Error('Unexpected page overflow');
                  }
                }catch(e){errors.push(mode+' '+file+': '+String(e).slice(0,180))}
                await p.close();
              }
              await ctx.close();
            }
            await browser.close();
            console.log('TABLE REGRESSION FINAL',JSON.stringify({pagesChecked:8,errors}));
            if(errors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

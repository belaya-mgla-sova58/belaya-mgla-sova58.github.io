name: Temporary Magnus sitemap trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-magnus-sitemap.yml'
permissions:
  contents: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Magnus to sitemap and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          loc='https://belaya-mgla-sova58.github.io/hero-magnus.html'
          if loc not in s:
              row=f'  <url><loc>{loc}</loc><lastmod>2026-10-23</lastmod></url>\n'
              s=s.replace('</urlset>',row+'</urlset>')
              p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/tmp-magnus-sitemap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Add Magnus to sitemap and clean temporary workflow'
          git pull --rebase origin main
          git push

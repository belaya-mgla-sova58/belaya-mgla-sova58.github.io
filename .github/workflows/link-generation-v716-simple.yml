name: Apply generation header visual update
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/link-generation-v716-simple.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link override stylesheet
        run: sed -i 's#hero-generations-v714.css?v=715#hero-generations-v714.css?v=715"/><link href="hero-generations-v716.css?v=716#' hero-generations.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-generations.html
          git commit -m 'Enable dark generation headers and count badges'
          git push

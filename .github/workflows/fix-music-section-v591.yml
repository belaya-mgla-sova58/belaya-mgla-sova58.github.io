name: Fix Music 58 section v591
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-music-v591.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative-corner.html
          git commit -m "Fix Music 58 section structure" || true
          git push
      - run: |
          git rm .github/workflows/fix-music-section-v591.yml patch-music-v591.py
          git commit -m "Remove Music 58 fix files"
          git push

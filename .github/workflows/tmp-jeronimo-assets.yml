name: Temporary Jeronimo page patch

on:
  push:
    paths:
      - '.github/workflows/tmp-jeronimo-assets.yml'

permissions:
  contents: write

jobs:
  patch-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Jeronimo corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('hero-jeronimo.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Щит мечей': 'Щит из мечей',
              'Прозорливость': 'Чутьё',
              '🐻 Свирепый медведь': '🐻 Свирепый медведь',
              '⚔️ Атакующий рейд': '⚔️ PvP и атакующие рейды',
              'Белая мгла · гайды SOVA58 · независимый игровой сайт': 'Белая мгла · гайды SOVA58 · независимый неофициальный игровой сайт',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf assets/heroes/jeronimo
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hero-jeronimo.html assets/heroes/jeronimo
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Refine Jeronimo guide labels and cleanup assets'
            git push
          fi

name: Fix event schedule v611
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-event-schedule-v611.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert schedule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('events.html')
          s=p.read_text(encoding='utf-8')
          if '<section class="event-schedule-v608"' not in s:
              target='<div class="route-page active" data-route="events">'
              if target not in s:
                  raise SystemExit('route marker not found')
              data=''
              html=base64.b64decode(data).decode('utf-8')
              s=s.replace(target,target+html,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit schedule
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git diff --cached --quiet || git commit -m 'Insert weekly event schedule v611'
          git push

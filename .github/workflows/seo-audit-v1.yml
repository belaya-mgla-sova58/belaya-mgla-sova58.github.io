name: SEO audit v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-audit-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit HTML SEO and internal links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html
          from collections import defaultdict
          root=Path('.')
          files=sorted(p for p in root.rglob('*.html') if '.git' not in p.parts and '.github' not in p.parts)
          titles=defaultdict(list); descs=defaultdict(list)
          missing_title=[]; missing_desc=[]; missing_h1=[]; multi_h1=[]; missing_canonical=[]; no_lang=[]; broken=[]; empty_links=[]
          def strip_tags(s):
              s=re.sub(r'<script\b[^>]*>.*?</script>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<style\b[^>]*>.*?</style>',' ',s,flags=re.I|re.S)
              s=re.sub(r'<!--.*?-->',' ',s,flags=re.S)
              s=re.sub(r'<[^>]+>',' ',s)
              return re.sub(r'\s+',' ',html.unescape(s)).strip()
          for p in files:
              s=p.read_text(encoding='utf-8',errors='ignore')
              mt=re.search(r'<title[^>]*>(.*?)</title>',s,re.I|re.S)
              title=strip_tags(mt.group(1)) if mt else ''
              if title: titles[title].append(str(p))
              else: missing_title.append(str(p))
              md=re.search(r'<meta\s+[^>]*name=["\']description["\'][^>]*>',s,re.I)
              desc=''
              if md:
                  mc=re.search(r'content=["\'](.*?)["\']',md.group(0),re.I|re.S)
                  desc=html.unescape(mc.group(1)).strip() if mc else ''
              if desc: descs[desc].append(str(p))
              else: missing_desc.append(str(p))
              h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',s,re.I|re.S)
              h1s=[strip_tags(x) for x in h1s if strip_tags(x)]
              if not h1s: missing_h1.append(str(p))
              if len(h1s)>1: multi_h1.append((str(p),h1s))
              if not re.search(r'<link\s+[^>]*rel=["\']canonical["\']',s,re.I): missing_canonical.append(str(p))
              if not re.search(r'<html\b[^>]*\blang=["\']ru(?:-[A-Za-z]+)?["\']',s,re.I): no_lang.append(str(p))
              for href in re.findall(r'<a\b[^>]*href=["\'](.*?)["\']',s,re.I|re.S):
                  href=html.unescape(href.strip())
                  if not href or href=='#':
                      empty_links.append((str(p),href)); continue
                  if href.startswith(('#','http://','https://','mailto:','tel:','javascript:','data:')): continue
                  target=href.split('#',1)[0].split('?',1)[0]
                  if not target: continue
                  if target.startswith('/'):
                      target=target[1:]
                  q=(p.parent/target).resolve() if not href.startswith('/') else (root/target).resolve()
                  try: q.relative_to(root.resolve())
                  except: continue
                  if target.endswith('/'):
                      q=q/'index.html'
                  if not q.exists(): broken.append((str(p),href))
          print(f'SEOA SUMMARY html_files={len(files)}')
          print(f'SEOA missing_title={len(missing_title)} missing_desc={len(missing_desc)} missing_h1={len(missing_h1)} multi_h1={len(multi_h1)} missing_canonical={len(missing_canonical)} no_ru_lang={len(no_lang)} broken_links={len(broken)}')
          print('SEOA MISSING_TITLE', missing_title)
          print('SEOA MISSING_DESC', missing_desc)
          print('SEOA MISSING_H1', missing_h1)
          print('SEOA MULTI_H1', multi_h1)
          print('SEOA MISSING_CANONICAL', missing_canonical)
          print('SEOA NO_RU_LANG', no_lang)
          dups_t={k:v for k,v in titles.items() if len(v)>1}
          dups_d={k:v for k,v in descs.items() if len(v)>1}
          print('SEOA DUP_TITLES', dups_t)
          print('SEOA DUP_DESCS', dups_d)
          print('SEOA BROKEN_LINKS', broken)
          for special in ['robots.txt','sitemap.xml']:
              p=Path(special)
              print(f'SEOA {special} exists={p.exists()} size={p.stat().st_size if p.exists() else 0}')
          PY

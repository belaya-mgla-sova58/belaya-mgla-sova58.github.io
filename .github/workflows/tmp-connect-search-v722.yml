name: Connect expanded search v722
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-connect-search-v722.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load expanded search after core scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site-v629.min.js')
          s=p.read_text(encoding='utf-8')
          marker='search-expanded-v722.js?v=722'
          if marker not in s:
              needle='var author=document.createElement("script");author.src="site-author-v625.min.js?v=625",author.async=!1,document.head.appendChild(author)'
              repl=needle+';var search=document.createElement("script");search.src="search-expanded-v722.js?v=722",search.async=!1,document.head.appendChild(search)'
              if needle not in s:
                  raise SystemExit('site-v629 loader needle not found')
              s=s.replace(needle,repl,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v629.min.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Load expanded search v722 site-wide'
            git push
          fi

name: Hide duplicate hero mini avatars v720
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-hide-hero-mini-thumb-v715.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide duplicate mini avatars and bust hero CSS cache
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'v720: hide duplicate mini avatar on hero pages' hero-epic-v719.css; then
            printf '\n/* v720: hide duplicate mini avatar on hero pages */\n.epic-hero > .hero-avatar > .hero-portrait > img{display:none!important}\n' >> hero-epic-v719.css
          fi
          find . -maxdepth 1 -type f -name 'hero-*.html' -print0 | xargs -0 -r sed -i 's/hero-epic-v719.css?v=719/hero-epic-v719.css?v=720/g'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-epic-v719.css hero-*.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Hide duplicate mini avatars on hero pages'
            git push
          fi

name: Apply polished hero priority ranks v721
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-hide-hero-mini-thumb-v715.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rank stylesheet to all hero guides using priority ranks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          link = '<link href="hero-rank-v721.css?v=721" rel="stylesheet"/>'
          changed = []
          for p in Path('.').glob('hero-*.html'):
              text = p.read_text(encoding='utf-8')
              if '.jero-rank' not in text or 'hero-rank-v721.css' in text:
                  continue
              if '</head>' not in text:
                  continue
              text = text.replace('</head>', link + '\n</head>', 1)
              p.write_text(text, encoding='utf-8')
              changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-*.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Polish hero priority rank badges'
            git push
          fi

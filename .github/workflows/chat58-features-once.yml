name: Chat58 features once
on:
  push:
    paths:
      - '.github/workflows/chat58-features-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat
        run: python .github/chat58_patch_once.py
      - name: Commit changes
        run: |
          rm -f .github/chat58_patch_once.py
          rm -f .github/workflows/chat58-features-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add replies reactions and unread state to Chat 58"
          git push

name: Chat58 features once
on:
  push:
    paths:
      - '.github/workflows/chat58-features-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chat 58
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('chat.html')
          s=p.read_text(encoding='utf-8')

          css='''
.chat58-shell{position:relative}
.chat58-new{position:absolute;z-index:8;left:50%;bottom:84px;transform:translateX(-50%);padding:8px 13px;border:1px solid rgba(173,229,255,.48);border-radius:999px;background:#175f91;color:#fff;font:inherit;font-size:11px;font-weight:900;box-shadow:0 7px 20px rgba(0,0,0,.28);cursor:pointer}.chat58-new[hidden]{display:none}
.chat58-replybar{display:flex;align-items:center;gap:9px;margin:0 0 8px;padding:7px 9px;border-left:3px solid #79cfff;border-radius:9px;background:rgba(83,169,224,.10)}.chat58-replybar[hidden]{display:none}.chat58-replycopy{min-width:0;flex:1}.chat58-replycopy small{display:block;color:rgba(215,238,252,.55);font-size:8.5px}.chat58-replycopy b{display:block;color:#c8edff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat58-replycopy span{display:block;color:rgba(235,246,253,.70);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat58-replycancel{flex:0 0 auto;width:25px;height:25px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#dff4ff;font:inherit;cursor:pointer}
.chat58-quote{margin:0 0 6px;padding:6px 8px;border-left:2px solid rgba(137,211,255,.72);border-radius:7px;background:rgba(150,215,255,.07);cursor:pointer}.chat58-quote b{display:block;color:#aee1ff;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat58-quote span{display:block;margin-top:2px;color:rgba(229,242,250,.62);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat58-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}.chat58-action,.chat58-react{border:1px solid rgba(159,213,246,.15);border-radius:999px;background:rgba(255,255,255,.045);color:rgba(222,240,251,.72);padding:3px 7px;font:inherit;font-size:9px;line-height:1.2;cursor:pointer}.chat58-react.is-on{border-color:rgba(136,214,255,.44);background:rgba(80,167,222,.15);color:#ecfaff}.chat58-action:hover,.chat58-react:hover{background:rgba(255,255,255,.08)}.chat58-delete.chat58-action{display:inline-block;margin:0;color:rgba(255,190,190,.72)}
@media(max-width:720px){.chat58-new{bottom:76px;font-size:10px}.chat58-actions{gap:4px}.chat58-action,.chat58-react{padding:3px 6px;font-size:8.5px}}
'''
          anchor='</style></head>'
          if 'chat58-replybar' not in s:
              s=s.replace(anchor,css+anchor,1)

          old='<div class="chat58-messages" id="chat58Messages" aria-live="polite"><div class="chat58-empty">Загружаю сообщения…</div></div><div class="chat58-composer"><form class="chat58-form" id="chat58Form">'
          new='<div class="chat58-messages" id="chat58Messages" aria-live="polite"><div class="chat58-empty">Загружаю сообщения…</div></div><button class="chat58-new" id="chat58New" type="button" hidden>Новые сообщения ↓</button><div class="chat58-composer"><div class="chat58-replybar" id="chat58ReplyBar" hidden><div class="chat58-replycopy"><small>Ответ для</small><b id="chat58ReplyNick"></b><span id="chat58ReplyText"></span></div><button class="chat58-replycancel" id="chat58ReplyCancel" type="button" aria-label="Отменить ответ">×</button></div><form class="chat58-form" id="chat58Form">'
          if old not in s:
              raise SystemExit('HTML composer anchor not found')
          s=s.replace(old,new,1)

          s=s.replace("const PREFIX='__chat58__', MARK='__chat58m__', DEL='__chat58d__';","const PREFIX='__chat58__', MARK='__chat58m__', DEL='__chat58d__', REPLY='__chat58r__', REACT='__chat58x__';",1)

          old_el="const myNick=document.getElementById('chat58MyNick'),messagesEl=document.getElementById('chat58Messages'),form=document.getElementById('chat58Form'),input=document.getElementById('chat58Input'),send=document.getElementById('chat58Send'),status=document.getElementById('chat58Status'),count=document.getElementById('chat58Count'),refresh=document.getElementById('chat58Refresh'),conn=document.getElementById('chat58Conn'),connText=document.getElementById('chat58ConnText');"
          new_el="const myNick=document.getElementById('chat58MyNick'),messagesEl=document.getElementById('chat58Messages'),form=document.getElementById('chat58Form'),input=document.getElementById('chat58Input'),send=document.getElementById('chat58Send'),status=document.getElementById('chat58Status'),count=document.getElementById('chat58Count'),refresh=document.getElementById('chat58Refresh'),conn=document.getElementById('chat58Conn'),connText=document.getElementById('chat58ConnText'),newBtn=document.getElementById('chat58New'),replyBar=document.getElementById('chat58ReplyBar'),replyNick=document.getElementById('chat58ReplyNick'),replyText=document.getElementById('chat58ReplyText'),replyCancel=document.getElementById('chat58ReplyCancel');"
          if old_el not in s:
              raise SystemExit('element anchor not found')
          s=s.replace(old_el,new_el,1)
          s=s.replace("let timer=0,firstLoad=true,lastSignature='',loading=false;","let timer=0,firstLoad=true,lastSignature='',loading=false,replyTarget=null,unreadCount=0,knownIds=new Set();\nconst REACTIONS=[['up','👍'],['laugh','😂'],['heart','❤️']];",1)

          parse_new=r'''function parseRoot(root){
 const chunks={},markers={},deleted={},replies={},reactions={};
 const chunkRe=/^__chat58__([a-z0-9-]+)__([0-9]+)__([0-9]+)__(.+)__([a-z0-9-]+)__(.+)$/i;
 const markRe=/^__chat58m__([a-z0-9-]+)__([0-9]+)$/i;
 const delRe=/^__chat58d__([a-z0-9-]+)$/i;
 const replyRe=/^__chat58r__([a-z0-9-]+)__(.+)$/i;
 const reactRe=/^__chat58x__([a-z0-9-]+)__(up|laugh|heart)$/i;
 Object.entries(root||{}).forEach(([k,v])=>{let m=k.match(chunkRe);if(m){const id=m[1],idx=Number(m[2]),total=Number(m[3]);if(!chunks[id])chunks[id]={total,parts:{},nick:b64uDecode(m[4]),owner:m[5]};chunks[id].parts[idx]=b64uDecode(m[6]);return}m=k.match(markRe);if(m){markers[m[1]]=Number(m[2]);return}m=k.match(delRe);if(m&&Number(v)>0){deleted[m[1]]=true;return}m=k.match(replyRe);if(m){try{const r=JSON.parse(b64uDecode(m[2]));if(r&&r.id)replies[m[1]]={id:String(r.id),nick:String(r.nick||''),text:String(r.text||'')}}catch(e){}return}m=k.match(reactRe);if(m){if(!reactions[m[1]])reactions[m[1]]={up:0,laugh:0,heart:0};reactions[m[1]][m[2]]=Math.max(0,Number(v)||0)}});
 const out=[];Object.entries(markers).forEach(([id,total])=>{const c=chunks[id];if(!c||deleted[id]||c.total!==total)return;let text='';for(let i=0;i<total;i++){if(typeof c.parts[i]!=='string')return;text+=c.parts[i]}if(!text.trim()||!c.nick)return;out.push({id,ts:idTs(id),nick:c.nick,owner:c.owner,text:text.trim(),reply:replies[id]||null,reactions:reactions[id]||{up:0,laugh:0,heart:0}})});
 return out.sort((a,b)=>a.ts-b.ts).slice(-80)
}
function nearBottom'''
          s,n=re.subn(r'function parseRoot\(root\)\{.*?\n\}\nfunction nearBottom',parse_new,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('parseRoot replacement failed')

          funcs=r'''function updateUnread(){if(unreadCount>0){newBtn.hidden=false;newBtn.textContent='Новые сообщения ('+unreadCount+') ↓';document.title='('+unreadCount+') Белая Мгла • Чат государства 58'}else{newBtn.hidden=true;newBtn.textContent='Новые сообщения ↓';document.title='Белая Мгла • Чат государства 58'}}
function clearUnread(){unreadCount=0;updateUnread()}
function setReply(x){replyTarget={id:x.id,nick:x.nick,text:Array.from(x.text).slice(0,70).join('')};replyNick.textContent=x.nick;replyText.textContent=replyTarget.text;replyBar.hidden=false;input.focus()}
function clearReply(){replyTarget=null;replyBar.hidden=true;replyNick.textContent='';replyText.textContent=''}
function scrollToMessage(id){for(const row of messagesEl.querySelectorAll('.chat58-row')){if(row.dataset.msgId===id){row.scrollIntoView({block:'center'});return}}}
async function reactTo(id,code,btn){const key='belaya-mgla-chat58-react-v1:'+id+':'+code;if(safeStorageGet(key)==='1')return;btn.disabled=true;try{const n=await incrementStrict(REACT+id+'__'+code);safeStorageSet(key,'1');btn.classList.add('is-on');const emoji=(REACTIONS.find(r=>r[0]===code)||['',''])[1];btn.textContent=emoji+(Number(n)>0?' '+Number(n):'');lastSignature='';}catch(e){setStatus('Не удалось поставить реакцию.',true)}finally{btn.disabled=false}}
function render(items,stickToBottom){const oldTop=messagesEl.scrollTop;messagesEl.replaceChildren();if(!items.length){const e=document.createElement('div');e.className='chat58-empty';e.innerHTML='Пока тихо 👀<br>Можно написать первое сообщение.';messagesEl.appendChild(e);firstLoad=false;return}
 items.forEach(x=>{const row=document.createElement('div');row.className='chat58-row'+(x.owner===uid?' own':'');row.dataset.msgId=x.id;const msg=document.createElement('div');msg.className='chat58-msg';const meta=document.createElement('div');meta.className='chat58-meta';const nick=document.createElement('span');nick.className='chat58-nick';nick.textContent=x.nick;const time=document.createElement('span');time.className='chat58-time';time.textContent=formatTime(x.ts);meta.append(nick,time);msg.appendChild(meta);if(x.reply){const q=document.createElement('div');q.className='chat58-quote';const qb=document.createElement('b');qb.textContent=x.reply.nick||'Сообщение';const qs=document.createElement('span');qs.textContent=x.reply.text||'';q.append(qb,qs);q.addEventListener('click',()=>scrollToMessage(x.reply.id));msg.appendChild(q)}const text=document.createElement('div');text.className='chat58-text';text.textContent=x.text;msg.appendChild(text);const actions=document.createElement('div');actions.className='chat58-actions';const rep=document.createElement('button');rep.type='button';rep.className='chat58-action';rep.textContent='Ответить';rep.addEventListener('click',()=>setReply(x));actions.appendChild(rep);REACTIONS.forEach(([code,emoji])=>{const b=document.createElement('button');b.type='button';b.className='chat58-react';const n=Math.max(0,Number((x.reactions||{})[code])||0);b.textContent=emoji+(n?' '+n:'');if(safeStorageGet('belaya-mgla-chat58-react-v1:'+x.id+':'+code)==='1')b.classList.add('is-on');b.addEventListener('click',()=>reactTo(x.id,code,b));actions.appendChild(b)});if(x.owner===uid){const del=document.createElement('button');del.type='button';del.className='chat58-delete chat58-action';del.textContent='Удалить';del.addEventListener('click',()=>deleteMessage(x.id,del));actions.appendChild(del)}msg.appendChild(actions);row.appendChild(msg);messagesEl.appendChild(row)});
 if(firstLoad||stickToBottom)requestAnimationFrame(()=>{messagesEl.scrollTop=messagesEl.scrollHeight;clearUnread()});else messagesEl.scrollTop=oldTop;firstLoad=false
}
async function loadMessages(force){if(loading)return;loading=true;if(force)refresh.disabled=true;const wasNear=nearBottom();try{const root=await readRoot();const items=parseRoot(root);const incoming=knownIds.size?items.filter(x=>!knownIds.has(x.id)&&x.owner!==uid).length:0;knownIds=new Set(items.map(x=>x.id));if(incoming&&!wasNear){unreadCount+=incoming;updateUnread()}const sig=items.map(x=>x.id+':'+(x.reply?x.reply.id:'')+':'+Number(x.reactions.up||0)+':'+Number(x.reactions.laugh||0)+':'+Number(x.reactions.heart||0)).join('|');if(sig!==lastSignature||force){lastSignature=sig;render(items,wasNear)}if(wasNear)clearUnread();setConnection(true);if(status.textContent==='Не удалось обновить чат.')setStatus('',false)}catch(e){setConnection(false);if(force)setStatus('Не удалось обновить чат.',true)}finally{loading=false;refresh.disabled=false}}
async function sendMessage(text){const nick=safeStorageGet(NICK_KEY);if(!nick)throw new Error('nick');const id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);const chunks=splitText(text,70),total=chunks.length,nickEnc=b64uEncode(nick),rt=replyTarget?{id:replyTarget.id,nick:replyTarget.nick,text:replyTarget.text}:null;for(let i=0;i<chunks.length;i++){const k=PREFIX+id+'__'+i+'__'+total+'__'+nickEnc+'__'+uid+'__'+b64uEncode(chunks[i]);await incrementStrict(k)}if(rt)await incrementStrict(REPLY+id+'__'+b64uEncode(JSON.stringify(rt)));await incrementStrict(MARK+id+'__'+total);return id}
'''
          s,n=re.subn(r'function render\(items\)\{.*?\nasync function deleteMessage',funcs+'async function deleteMessage',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('render/load/send replacement failed')

          old_try="try{await sendMessage(text);safeStorageSet(LAST_KEY,String(Date.now()));input.value='';autosize();setStatus('',false);lastSignature='';await loadMessages(true)}"
          new_try="try{await sendMessage(text);clearReply();safeStorageSet(LAST_KEY,String(Date.now()));input.value='';autosize();setStatus('',false);lastSignature='';await loadMessages(true)}"
          if old_try not in s:
              raise SystemExit('submit anchor not found')
          s=s.replace(old_try,new_try,1)

          old_events="input.addEventListener('input',autosize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}});refresh.addEventListener('click',()=>loadMessages(true));window.addEventListener('online',()=>{setConnection(true);loadMessages(true)});window.addEventListener('offline',()=>setConnection(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMessages(false)});"
          new_events="input.addEventListener('input',autosize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit()}});replyCancel.addEventListener('click',clearReply);newBtn.addEventListener('click',()=>{messagesEl.scrollTop=messagesEl.scrollHeight;clearUnread()});messagesEl.addEventListener('scroll',()=>{if(nearBottom())clearUnread()},{passive:true});refresh.addEventListener('click',()=>loadMessages(true));window.addEventListener('online',()=>{setConnection(true);loadMessages(true)});window.addEventListener('offline',()=>setConnection(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadMessages(false)});"
          if old_events not in s:
              raise SystemExit('event anchor not found')
          s=s.replace(old_events,new_events,1)

          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/chat58-features-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.html .github/workflows/chat58-features-once.yml
          git commit -m "Add replies reactions and unread state to Chat 58"
          git push

name: Temporary Logan page builder
on:
  push:
    paths:
      - '.github/workflows/tmp-logan-page.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-logan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Logan page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp hero-greg.html hero-logan.html
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('hero-logan.html')
          s=p.read_text(encoding='utf-8')
          main=Path('tmp-logan-main.html').read_text(encoding='utf-8').strip()
          s=re.sub(r'<main id="appMain">.*?</main>', main, s, count=1, flags=re.S)
          s=re.sub(r'<title>.*?</title>', '<title>Логан: навыки, Стальные кулаки, плюсы и минусы | Белая мгла</title>', s, count=1, flags=re.S)
          s=re.sub(r'<meta name="description" content="[^"]*"/>', '<meta name="description" content="Подробный гайд по Логану: герой 3 поколения, навыки Освоения и Экспедиции, Стальные кулаки, гарнизон, прокачка, плюсы, минусы и применение."/>', s, count=1)
          s=re.sub(r'<link rel="canonical" href="[^"]*"/>', '<link rel="canonical" href="https://belaya-mgla-sova58.github.io/hero-logan.html"/>', s, count=1)
          s=re.sub(r'<meta property="og:title" content="[^"]*"/>', '<meta property="og:title" content="Логан: полный гайд"/>', s, count=1)
          s=re.sub(r'<meta property="og:description" content="[^"]*"/>', '<meta property="og:description" content="Навыки, Стальные кулаки, гарнизон, PvP, плюсы и минусы Логана."/>', s, count=1)
          s=re.sub(r'<meta property="og:url" content="[^"]*"/>', '<meta property="og:url" content="https://belaya-mgla-sova58.github.io/hero-logan.html"/>', s, count=1)
          s=re.sub(r'<meta property="og:image" content="[^"]*"/>', '<meta property="og:image" content="https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/logan/portrait.webp"/>', s, count=1)
          s=re.sub(r'<meta name="twitter:image" content="[^"]*"/>', '<meta name="twitter:image" content="https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/logan/portrait.webp"/>', s, count=1)
          article={"@context":"https://schema.org","@type":"Article","headline":"Логан: полный гайд","description":"Подробный гайд по Логану: герой 3 поколения, навыки Освоения и Экспедиции, Стальные кулаки, гарнизон, плюсы и минусы.","url":"https://belaya-mgla-sova58.github.io/hero-logan.html","mainEntityOfPage":{"@type":"WebPage","@id":"https://belaya-mgla-sova58.github.io/hero-logan.html"},"author":{"@type":"Person","name":"SOVA58","url":"https://belaya-mgla-sova58.github.io/sova58.html","gender":"Female"},"isPartOf":{"@type":"WebSite","name":"Белая мгла · SOVA58","url":"https://belaya-mgla-sova58.github.io/"},"inLanguage":"ru","dateModified":"2026-10-23","image":["https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/logan/portrait.webp"]}
          breadcrumb={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Главная","item":"https://belaya-mgla-sova58.github.io/"},{"@type":"ListItem","position":2,"name":"Герои","item":"https://belaya-mgla-sova58.github.io/heroes.html"},{"@type":"ListItem","position":3,"name":"Логан","item":"https://belaya-mgla-sova58.github.io/hero-logan.html"}]}
          blocks=re.findall(r'<script(?: id="guide-article-schema-v625")? type="application/ld\+json">.*?</script>',s,flags=re.S)
          if len(blocks)>=2:
            s=s.replace(blocks[0],'<script id="guide-article-schema-v625" type="application/ld+json">'+json.dumps(article,ensure_ascii=False,separators=(',',':'))+'</script>',1)
            s=s.replace(blocks[1],'<script type="application/ld+json">'+json.dumps(breadcrumb,ensure_ascii=False,separators=(',',':'))+'</script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          mkdir -p assets/heroes/gen-03/logan
          curl -L --fail --retry 3 -sS 'https://whiteout-survival.com/heroes/logan/' -o /tmp/logan.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html, urllib.request
          text=html.unescape(Path('/tmp/logan.html').read_text(encoding='utf-8',errors='ignore'))
          urls=re.findall(r'https?://[^"\'<>\s]+?\.(?:webp|png|jpe?g)',text,re.I)
          wanted={
            'portrait.webp':['Logan.webp','logan.webp'],
            'skill-fists-of-destruction.webp':['Fists-of-Destruction.webp','fists-of-destruction.webp'],
            'skill-power-suit.webp':['Power-Suit.webp','power-suit.webp'],
            'skill-blustery-strike.webp':['Blustery-Strike.webp','blustery-strike.webp'],
            'skill-lions-might.webp':['Lions-Might.webp','Lion-s-Might.webp','lions-might.webp'],
            'skill-lion-intimidation.webp':['Lion-Intimidation.webp','lion-intimidation.webp'],
            'skill-leader-inspiration.webp':['Leader-Inspiration.webp','leader-inspiration.webp'],
            'gear-fists-of-steel.webp':['Fists-of-Steel.webp','fists-of-steel.webp'],
            'gear-enhanced-fists.webp':['Enhanced-Fists-of-Steel.webp','enhanced-fists-of-steel.webp'],
            'gear-strong-protection.webp':['Strong-Protection.webp','strong-protection.webp'],
          }
          base=Path('assets/heroes/gen-03/logan')
          for dest,pats in wanted.items():
            match=None
            for pat in pats:
              for u in urls:
                if pat.lower() in u.lower():
                  match=u; break
              if match: break
            if match:
              urllib.request.urlretrieve(match,base/dest)
            else:
              ok=False
              for month in ['07','06','08','05']:
                for pat in pats:
                  candidate=f'https://whiteout-survival.com/wp-content/uploads/2025/{month}/'+pat
                  try:
                    urllib.request.urlretrieve(candidate,base/dest)
                    ok=True; break
                  except Exception:
                    pass
                if ok: break
            if not (base/dest).exists():
              raise SystemExit(f'Missing asset: {dest}; patterns={pats}; sample={urls[:30]}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          url='https://belaya-mgla-sova58.github.io/hero-logan.html'
          if url not in s:
            s=s.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
            p.write_text(s,encoding='utf-8')
          PY
          git add hero-logan.html assets/heroes/gen-03/logan sitemap.xml
          git commit -m "Add detailed Logan hero page" || true
          git pull --rebase origin main
          git push origin HEAD:main

name: Temporary Freya finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-freya-build.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix assets and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/gen-10/freya
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          curl -fsSL "$base/Freya.webp" -o assets/heroes/gen-10/freya/portrait.webp
          curl -fsSL "$base/Chain-Sunder.webp" -o assets/heroes/gen-10/freya/skill-chain-sunder.webp
          curl -fsSL "$base/Prickled-Bind.webp" -o assets/heroes/gen-10/freya/skill-prickled-bind.webp
          curl -fsSL "$base/Crystal-Fury.webp" -o assets/heroes/gen-10/freya/skill-crystal-fury.webp
          curl -fsSL "$base/Fog-of-War.webp" -o assets/heroes/gen-10/freya/skill-fog-of-war.webp
          curl -fsSL "$base/Blood-Moon-Scythe.webp" -o assets/heroes/gen-10/freya/skill-blood-moon-scythe.webp
          curl -fsSL "$base/Night-Raid.webp" -o assets/heroes/gen-10/freya/skill-night-raid.webp
          curl -fsSL "$base/Blood-Moon-Scythe-weapon.webp" -o assets/heroes/gen-10/freya/gear-blood-moon-scythe.webp
          cp assets/heroes/gen-10/freya/skill-night-raid.webp assets/heroes/gen-10/freya/gear-night-raid.webp
          curl -fsSL "$base/Defender-of-the-Watch.webp" -o assets/heroes/gen-10/freya/gear-watch-defender.webp

          python - <<'PY'
          from pathlib import Path
          p=Path('hero-freya.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('1 110,85%</strong><span>Защита копейщиков', '1 110,88%</strong><span>Защита копейщиков')
          s=s.replace('Зал героев, универсальные мифические осколки и последующие источники поколения', 'Зал героев, магазин Литейной и универсальные мифические осколки')
          p.write_text(s,encoding='utf-8')

          sm=Path('sitemap.xml')
          x=sm.read_text(encoding='utf-8')
          lines=[ln for ln in x.splitlines() if 'tmp-freya-' not in ln]
          x='\n'.join(lines)
          if not x.endswith('\n'): x+='\n'
          sm.write_text(x,encoding='utf-8')
          PY

          rm -f tmp-freya-*.txt
          git rm -f .github/workflows/tmp-freya-build.yml
          git add hero-freya.html assets/heroes/gen-10/freya sitemap.xml
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Freya generation 10 hero guide'
          git pull --rebase origin main
          git push

name: Optimize event card loading priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-event-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lower non-critical event card image priority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('events.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<img alt="Охота на медведя" decoding="async" fetchpriority="high" src="assets/bear-card-v499.webp"/>':
              '<img alt="Охота на медведя" decoding="async" loading="lazy" src="assets/bear-card-v499.webp"/>',
              '<img alt="Месть Джины" decoding="async" fetchpriority="high" src="assets/gina-revenge-final-v607.jpg?v=607"/>':
              '<img alt="Месть Джины" decoding="async" loading="lazy" src="assets/gina-revenge-final-v607.jpg?v=607"/>',
          }

          changed = 0
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 match, found {count}: {old}')
              text = text.replace(old, new, 1)
              changed += 1

          path.write_text(text, encoding='utf-8')
          print(f'Updated {changed} event card images')
          PY

      - name: Verify priority setup
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'fetchpriority="high" href="assets/img_5c51535e4e647ea6.webp"' events.html
          ! grep -F 'alt="Охота на медведя" decoding="async" fetchpriority="high"' events.html
          ! grep -F 'alt="Месть Джины" decoding="async" fetchpriority="high"' events.html
          grep -F 'alt="Охота на медведя" decoding="async" loading="lazy"' events.html
          grep -F 'alt="Месть Джины" decoding="async" loading="lazy"' events.html

      - name: Commit events optimization
        shell: bash
        run: |
          if git diff --quiet -- events.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html
          git commit -m "Optimize event overview image loading"
          git push

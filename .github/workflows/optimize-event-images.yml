name: Optimize event header images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-event-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Recompress heavy event headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "assets/alliance-showdown-header-v505.webp"
            "assets/alliance-mobilization-header-v517.webp"
            "assets/alliance-championship-header-v509.webp"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            tmp="${f%.webp}.optimized.webp"
            cwebp -quiet -q 86 -m 6 -metadata none "$f" -o "$tmp"
            old=$(stat -c%s "$f")
            new=$(stat -c%s "$tmp")
            echo "$f: $old -> $new bytes"
            if [ "$new" -lt "$old" ]; then
              mv "$tmp" "$f"
            else
              rm -f "$tmp"
            fi
          done

      - name: Commit optimized images
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No smaller images produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alliance-showdown-header-v505.webp assets/alliance-mobilization-header-v517.webp assets/alliance-championship-header-v509.webp
          git commit -m "Optimize heavy event header images"
          git push

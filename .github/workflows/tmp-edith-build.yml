name: Temporary Edith build
on:
  push:
    paths:
      - '.github/workflows/tmp-edith-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Edith hero page
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p assets/heroes/gen-07/edith
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_strategic_balance.webp -o assets/heroes/gen-07/edith/skill-strategic-balance.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_ironclad.webp -o assets/heroes/gen-07/edith/skill-ironclad.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_steel_sentinel.webp -o assets/heroes/gen-07/edith/skill-steel-sentinel.webp
          sed -i "/pick('skill-strategic-balance.webp'/d; /pick('skill-ironclad.webp'/d; /pick('skill-steel-sentinel.webp'/d" tmp-edith-build.py
          python tmp-edith-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-edith.html assets/heroes/gen-07/edith sitemap.xml
          git commit -m "Add Edith hero guide"
          git pull --rebase origin main
          git push origin main

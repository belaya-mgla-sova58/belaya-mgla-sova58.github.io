name: Temporary Edith build
on:
  push:
    paths:
      - '.github/workflows/tmp-edith-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Edith hero page
        run: |
          python -m pip install requests beautifulsoup4
          python tmp-edith-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-edith.html assets/heroes/gen-07/edith sitemap.xml
          git commit -m "Add Edith hero guide"
          git pull --rebase origin main
          git push origin main

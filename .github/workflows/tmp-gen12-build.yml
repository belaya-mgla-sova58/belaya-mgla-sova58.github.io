name: Temporary generation 12 build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-gen12-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build generation 12 hero pages
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pillow
          sed -i "s/'Bloodthirsty'/'Battlethirsty'/g" tmp-gen12-build.py
          python tmp-gen12-build.py
          git add hero-hervor.html hero-karol.html hero-ligeia.html sitemap.xml assets/heroes/gen-12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add generation 12 hero guides'
          git pull --rebase --autostash origin main
          git push

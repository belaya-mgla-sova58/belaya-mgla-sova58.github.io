name: Temporary notifications v630
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-notifications-v630.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add notification test script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='<script defer="" src="site-v629.min.js?v=629"></script>'
          extra=marker+'<script defer="" src="notifications-v630.js?v=630"></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'notifications-v630.js?v=630' in s:
                  continue
              if marker in s:
                  p.write_text(s.replace(marker,extra),encoding='utf-8')
                  changed.append(str(p))
          print('updated',len(changed),'html files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable notification test UI'
          git push

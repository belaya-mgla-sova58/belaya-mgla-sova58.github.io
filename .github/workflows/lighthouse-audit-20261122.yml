name: Lighthouse performance audit - 3 pages x 2 devices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '.github/workflows/lighthouse-audit-20261122.yml'
      - 'scripts/lighthouse-summary-20261122.mjs'
      - 'index.html'
      - 'calculators.html'
      - 'chief-gear-calculator.html'
      - 'chief-gear-core-v1222.js'
      - 'assets/sova-chief-*-v1223.*'
      - 'site-v629.min.js'
      - 'site-author-v625.min.js'
      - 'posthog-v734.js'
permissions:
  contents: read
concurrency:
  group: lighthouse-lab-audit
  cancel-in-progress: true
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock --ignore-scripts lighthouse@12
      - name: Locate Chromium / Google Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "No installed Chrome binary"; exit 1; fi
          "$CHROME" --version
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Measure 3 published pages on simulated mobile and desktop
        shell: bash
        run: |
          mkdir -p lighthouse-audit-output
          base="https://belaya-mgla-sova58.github.io"
          for item in "home:" "calculators:calculators.html" "chief-gear:chief-gear-calculator.html"; do
            name="${item%%:*}"
            file="${item#*:}"
            for device in mobile desktop; do
              opts=()
              if [ "$device" = desktop ]; then opts+=(--preset=desktop); fi
              echo "LIGHTHOUSE_CHECK $name $device"
              node ./node_modules/lighthouse/cli/index.js "$base/$file" \
                --output=json --output-path="lighthouse-audit-output/$name-$device.json" \
                --only-categories=performance,accessibility,seo --max-wait-for-load=45000 \
                --chrome-flags="--headless --no-sandbox --disable-gpu --disable-dev-shm-usage" \
                --quiet "${opts[@]}"
            done
          done
      - name: Summarize measured Web Vitals and scores
        if: always()
        run: node scripts/lighthouse-summary-20261122.mjs
      - name: Upload the six reports and the concise summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-performance-report
          path: lighthouse-audit-output/
          if-no-files-found: warn
          retention-days: 14

name: Temporary Freya SEO fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-freya-seo.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Freya metadata and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-freya.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Навыки, Охотник на волков, PvP, Арена, Свирепый медведь, плюсы и минусы Фреи.', 'Навыки, Коса Кровавой Луны, PvP, Арена, Свирепый медведь, плюсы и минусы Фреи.')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/tmp-freya-seo.yml
          git add hero-freya.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Freya SEO metadata'
          git pull --rebase origin main
          git push

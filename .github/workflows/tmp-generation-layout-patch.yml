name: Temporary hero generations layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generation-layout-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hero generations page
        run: |
          set -euo pipefail
          python tmp-generation-layout-patch.py
          git add hero-generations.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine hero generations layout'
          git pull --rebase --autostash origin main
          git push

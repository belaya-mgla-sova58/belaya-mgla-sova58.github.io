name: Chat58 v6 once
on:
  push:
    paths:
      - '.github/workflows/chat58-v6-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Chat58 v6
        run: python .tmp/chat58-v6-patch.py
      - name: Syntax check
        run: node --check chat-v4.js
      - name: Commit and clean installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chat58-v6-once.yml .tmp/chat58-v6-patch.py
          git add chat-v4.js chat-v4.css chat.html
          git commit -m "Add multi-device SOVA recovery to Chat 58"
          git push

name: Extract shared hero generation CSS

on:
  push:
    paths:
      - '.github/workflows/extract-shared-hero-generation-css.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace exact duplicate generation styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          TARGET='636b5ff47c1e9fd0e6fe8a2b7423f82a11b298ef4ace56d555063cd205cd759c'
          OUT=Path('hero-generation-shared-v688.css')
          LINK='<link href="hero-generation-shared-v688.css?v=688" rel="stylesheet"/>'
          pattern=re.compile(r'<style(?:\s[^>]*)?>([\s\S]*?)</style>',re.I)

          changed=[]
          shared_css=None
          total_saved=0
          for p in sorted(Path('.').glob('hero-generation-*.html')):
              text=p.read_text(encoding='utf-8',errors='strict')
              hits=[]
              for m in pattern.finditer(text):
                  css=m.group(1)
                  if hashlib.sha256(css.encode('utf-8')).hexdigest()==TARGET:
                      hits.append(m)
                      if shared_css is None: shared_css=css
              if not hits:
                  continue
              if len(hits)!=1:
                  raise SystemExit(f'{p}: expected exactly one target block, got {len(hits)}')
              m=hits[0]
              out=text[:m.start()]+LINK+text[m.end():]
              p.write_text(out,encoding='utf-8')
              changed.append(p.name)
              total_saved += len(text.encode('utf-8'))-len(out.encode('utf-8'))

          if len(changed)!=12:
              raise SystemExit(f'Expected 12 matching generation pages, got {len(changed)}')
          if shared_css is None:
              raise SystemExit('Target CSS not found')
          if hashlib.sha256(shared_css.encode()).hexdigest()!=TARGET:
              raise SystemExit('Shared CSS hash changed')
          OUT.write_text(shared_css.strip()+'\n',encoding='utf-8')
          print(f'Updated {len(changed)} generation pages; aggregate HTML saved={total_saved} bytes')
          print('\n'.join(changed))
          PY
      - name: Verify extraction
        run: |
          test "$(grep -l 'hero-generation-shared-v688.css?v=688' hero-generation-*.html | wc -l)" -eq 12
          test -s hero-generation-shared-v688.css
          test "$(wc -c < hero-generation-shared-v688.css)" -gt 3300
      - name: Commit shared generation CSS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-generation-*.html hero-generation-shared-v688.css
          git diff --cached --quiet && exit 0
          git commit -m 'Share cached CSS across hero generation pages'
          git push

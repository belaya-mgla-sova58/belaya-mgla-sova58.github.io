name: Temporary Blanchette inspect
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-blanchette-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Blanchette source images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://whiteout-survival.com/ru/heroes/blanchette/'
          html=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'}).text
          soup=BeautifulSoup(html,'html.parser')
          out=[]
          for i,img in enumerate(soup.find_all('img')):
              src=img.get('src') or img.get('data-src') or img.get('data-lazy-src') or ''
              alt=img.get('alt','')
              if src:
                  out.append(f'{i}\t{alt}\t{src}')
          open('tmp-blanchette-images.txt','w',encoding='utf-8').write('\n'.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-blanchette-images.txt
          git commit -m 'Inspect Blanchette source images'
          git pull --rebase origin main
          git push

name: Temporary Blanchette inspect
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-blanchette-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect Blanchette source images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, html as htmllib, urllib.request
          u='https://whiteout-survival.com/ru/heroes/blanchette/'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          out=[]
          for i,m in enumerate(re.finditer(r'<img\b[^>]*>',raw,re.I)):
              tag=m.group(0)
              def attr(name):
                  mm=re.search(r'\b'+re.escape(name)+r'=["\']([^"\']*)["\']',tag,re.I)
                  return htmllib.unescape(mm.group(1)) if mm else ''
              src=attr('src') or attr('data-src') or attr('data-lazy-src')
              alt=attr('alt')
              if src:
                  out.append(f'{i}\t{alt}\t{src}')
          open('tmp-blanchette-images.txt','w',encoding='utf-8').write('\n'.join(out))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-blanchette-images.txt
          git commit -m 'Inspect Blanchette source images'
          git pull --rebase origin main
          git push

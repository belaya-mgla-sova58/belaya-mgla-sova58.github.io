name: Add Epic Hero Row v718

on:
  push:
    paths:
      - '.github/workflows/tmp-add-epic-line-v718.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero generations page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('hero-generations.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('hero-generations-v716.css?v=716', 'hero-generations-v716.css?v=718')
          s = s.replace(
              'Нажми на длинную плитку поколения, чтобы раскрыть героев. Одновременно открывается только одно поколение. Нажатие на карточку героя открывает его подробный гайд.',
              'Нажми на длинную плитку поколения или эпических героев, чтобы раскрыть карточки. Одновременно открывается только одна линейка. Нажатие на карточку героя открывает его подробный гайд.'
          )

          epic = '''<details class="gen-acc epic-line" name="hero-generation"><summary><div class="gen-title"><strong>Эпические герои</strong><span>9 героев</span></div><span class="gen-chevron">⌄</span></summary><div class="gen-panel"><div class="gen-grid epic-grid"><a class="hero-mini" data-epic="bahiti" href="https://whiteout-survival.com/ru/heroes/bahiti/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Бахити</strong><span>Стрелки · Бой</span></div></a><a class="hero-mini" data-epic="jasser" href="https://whiteout-survival.com/ru/heroes/jasser/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Джассер</strong><span>Стрелки · Развитие</span></div></a><a class="hero-mini" data-epic="jessie" href="https://whiteout-survival.com/ru/heroes/jessie/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Джесси</strong><span>Копейщики · Бой</span></div></a><a class="hero-mini" data-epic="gina" href="https://whiteout-survival.com/ru/heroes/gina/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Джина</strong><span>Стрелки · Бой</span></div></a><a class="hero-mini" data-epic="patrick" href="https://whiteout-survival.com/ru/heroes/patrick/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Патрик</strong><span>Копейщики · Бой</span></div></a><a class="hero-mini" data-epic="sergey" href="https://whiteout-survival.com/ru/heroes/sergey/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Сергей</strong><span>Пехота · Бой</span></div></a><a class="hero-mini" data-epic="seo-yoon" href="https://whiteout-survival.com/ru/heroes/seo-yoon/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Со-Юн</strong><span>Стрелки · Развитие</span></div></a><a class="hero-mini" data-epic="lumak-bokan" href="https://whiteout-survival.com/ru/heroes/lumak-bokan/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Лумак Бокан</strong><span>Копейщики · Бой</span></div></a><a class="hero-mini" data-epic="ling-xue" href="https://whiteout-survival.com/heroes/ling-xue/" target="_blank" rel="noopener noreferrer"><div class="hero-mini-caption"><strong>Лин Сюэ</strong><span>Копейщики · Развитие</span></div></a></div></div></details>'''

          marker = '<div class="gen-stack"><details class="gen-acc" name="hero-generation">'
          if 'class="gen-acc epic-line"' not in s:
              if marker not in s:
                  raise SystemExit('generation stack marker not found')
              s = s.replace(marker, '<div class="gen-stack">' + epic + '<details class="gen-acc" name="hero-generation">', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-generations.html
          git commit -m "Add Epic Heroes accordion row"
          git push

name: IndexNow submit once
on:
  push:
    paths:
      - '.github/workflows/indexnow-submit-once.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published verification key
        shell: bash
        run: |
          set -e
          KEY='2a74536dc516b5f2330d8c577538689c'
          URL="https://belaya-mgla-sova58.github.io/${KEY}.txt"
          for i in $(seq 1 24); do
            body=$(curl -fsS --max-time 10 "$URL" 2>/dev/null || true)
            if [ "$body" = "$KEY" ] || [ "$body" = "$KEY"$'\n' ]; then
              echo "IndexNow key is live"
              exit 0
            fi
            sleep 5
          done
          echo "Verification key did not become reachable" >&2
          exit 1
      - name: Build and submit IndexNow payload
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, re
          from pathlib import Path
          key='2a74536dc516b5f2330d8c577538689c'
          xml=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>(.*?)</loc>', xml)
          payload={
            'host':'belaya-mgla-sova58.github.io',
            'key':key,
            'keyLocation':f'https://belaya-mgla-sova58.github.io/{key}.txt',
            'urlList':urls,
          }
          Path('/tmp/indexnow.json').write_text(json.dumps(payload, ensure_ascii=False),encoding='utf-8')
          print(f'Prepared {len(urls)} URLs')
          PY
          code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/IndexNow)
          echo "IndexNow HTTP $code"
          cat /tmp/indexnow-response.txt || true
          case "$code" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac

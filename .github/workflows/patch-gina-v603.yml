name: Patch Gina cover v603
on:
  push:
    branches: [main]
    paths:
      - 'assets/gina-revenge-card-v603.webp'
      - '.github/workflows/patch-gina-v603.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gina image references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['events.html','ginas-revenge.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              for old in ['assets/gina-revenge-card-v601.png','assets/gina-revenge-card-v602.webp']:
                  s=s.replace(old,'assets/gina-revenge-card-v603.webp')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit page updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html ginas-revenge.html
          git diff --cached --quiet || git commit -m 'Use binary Gina cover v603'
          git push

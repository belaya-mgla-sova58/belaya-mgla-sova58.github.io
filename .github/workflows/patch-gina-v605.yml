name: Patch Gina cover v605
on:
  push:
    branches: [main]
    paths:
      - 'assets/gina-revenge-final-v605.webp'
      - '.github/workflows/patch-gina-v605.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Gina references to final WEBP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['events.html','ginas-revenge.html']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('assets/gina-revenge-card-v604.svg?v=604','assets/gina-revenge-final-v605.webp?v=605')
              s = s.replace('assets/gina-revenge-card-v604.svg','assets/gina-revenge-final-v605.webp?v=605')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html ginas-revenge.html
          git diff --cached --quiet || git commit -m 'Use final Gina Revenge cover v605'
          git push

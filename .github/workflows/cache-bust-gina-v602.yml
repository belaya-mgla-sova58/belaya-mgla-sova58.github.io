name: Cache bust Gina cover v602
on:
  push:
    paths:
      - '.github/workflows/cache-bust-gina-v602.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force fresh Gina cover URL
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['events.html','ginas-revenge.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('assets/gina-revenge-card-v601.png?v=602','assets/gina-revenge-card-v601.png?v=603')
              s=s.replace('assets/gina-revenge-card-v601.png','assets/gina-revenge-card-v601.png?v=603')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html ginas-revenge.html
          git commit -m 'Force fresh Gina cover asset' || true
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/cache-bust-gina-v602.yml
          git commit -m 'Remove one-time Gina cache bust workflow'
          git push

name: Temporary view mode v627
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-view-mode-v627.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch pages to view mode v627
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old='site-v626.min.js?v=626'
          new='site-v627.min.js?v=627'
          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed.append(str(p))
          print('updated',len(changed),'html files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use view mode controller v627'
          git push

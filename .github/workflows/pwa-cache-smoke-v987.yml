name: Diagnose PWA worker startup and static caching
on:
  push:
    paths: ['.github/workflows/pwa-cache-smoke-v987.yml']
permissions: {contents: read}
jobs:
  worker-start:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Inspect live worker after short navigation
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            const ctx=await browser.newContext({viewport:{width:1280,height:800}});
            const page=await ctx.newPage();
            page.on('pageerror',e=>console.log('WORKER PAGE ERROR',e.message));
            page.on('console',m=>{if(m.type()==='error')console.log('WORKER CONSOLE',m.text().slice(0,220))});
            try{const r=await page.goto('https://belaya-mgla-sova58.github.io/index.html?swDiag=987',{waitUntil:'domcontentloaded',timeout:17000});console.log('WORKER PAGE HTTP',r?.status());}catch(e){console.log('WORKER NAV ERROR',String(e).slice(0,350))}
            await page.waitForTimeout(5200);
            try{const result=await page.evaluate(async ()=>{
              const registrations=await Promise.race([navigator.serviceWorker?.getRegistrations()||Promise.resolve([]),new Promise(resolve=>setTimeout(()=>resolve([]),3000))]);
              const keys=await caches.keys();
              return {readyState:document.readyState,controller:navigator.serviceWorker?.controller?.scriptURL||null,
                registrations:registrations.map(r=>({scope:r.scope,active:r.active?.scriptURL||null,installing:r.installing?.scriptURL||null,waiting:r.waiting?.scriptURL||null})),
                cacheNames:keys,location:location.href}
            });console.log('WORKER LIVE STATE',JSON.stringify(result))}
            catch(e){console.log('WORKER LIVE ERROR',String(e).slice(0,330))}
            const rr=await page.request.get('https://belaya-mgla-sova58.github.io/service-worker.js?v=987',{timeout:12000});
            console.log('WORKER HTTP SCRIPT',rr.status(),(await rr.text()).slice(0,160));
            await browser.close();
          })().catch(e=>{console.error('WORKER TEST ERROR',e);process.exitCode=1});
          JS

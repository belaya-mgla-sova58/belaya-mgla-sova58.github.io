name: Temporary Greg page builder
on:
  push:
    paths:
      - '.github/workflows/tmp-greg-page.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-greg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Greg page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp hero-philly.html hero-greg.html
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('hero-greg.html')
          s=p.read_text(encoding='utf-8')
          main=Path('tmp-greg-main.html').read_text(encoding='utf-8').strip()
          s=re.sub(r'<main id="appMain">.*?</main>', main, s, count=1, flags=re.S)
          s=re.sub(r'<title>.*?</title>', '<title>Грег: навыки, Указ государства, плюсы и минусы | Белая мгла</title>', s, count=1, flags=re.S)
          s=re.sub(r'<meta name="description" content="[^"]*"/>', '<meta name="description" content="Подробный гайд по Грегу: герой 3 поколения, навыки Освоения и Экспедиции, Указ государства, получение, прокачка, плюсы, минусы и применение."/>', s, count=1)
          s=re.sub(r'<link rel="canonical" href="[^"]*"/>', '<link rel="canonical" href="https://belaya-mgla-sova58.github.io/hero-greg.html"/>', s, count=1)
          s=re.sub(r'<meta property="og:title" content="[^"]*"/>', '<meta property="og:title" content="Грег: полный гайд"/>', s, count=1)
          s=re.sub(r'<meta property="og:description" content="[^"]*"/>', '<meta property="og:description" content="Навыки, Указ государства, Арена, PvP, плюсы и минусы Грега."/>', s, count=1)
          s=re.sub(r'<meta property="og:url" content="[^"]*"/>', '<meta property="og:url" content="https://belaya-mgla-sova58.github.io/hero-greg.html"/>', s, count=1)
          s=re.sub(r'<meta property="og:image" content="[^"]*"/>', '<meta property="og:image" content="https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/greg/portrait.webp"/>', s, count=1)
          s=re.sub(r'<meta name="twitter:image" content="[^"]*"/>', '<meta name="twitter:image" content="https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/greg/portrait.webp"/>', s, count=1)
          article={"@context":"https://schema.org","@type":"Article","headline":"Грег: полный гайд","description":"Подробный гайд по Грегу: герой 3 поколения, навыки Освоения и Экспедиции, Указ государства, получение, плюсы и минусы.","url":"https://belaya-mgla-sova58.github.io/hero-greg.html","mainEntityOfPage":{"@type":"WebPage","@id":"https://belaya-mgla-sova58.github.io/hero-greg.html"},"author":{"@type":"Person","name":"SOVA58","url":"https://belaya-mgla-sova58.github.io/sova58.html","gender":"Female"},"isPartOf":{"@type":"WebSite","name":"Белая мгла · SOVA58","url":"https://belaya-mgla-sova58.github.io/"},"inLanguage":"ru","dateModified":"2026-10-23","image":["https://belaya-mgla-sova58.github.io/assets/heroes/gen-03/greg/portrait.webp"]}
          breadcrumb={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Главная","item":"https://belaya-mgla-sova58.github.io/"},{"@type":"ListItem","position":2,"name":"Герои","item":"https://belaya-mgla-sova58.github.io/heroes.html"},{"@type":"ListItem","position":3,"name":"Грег","item":"https://belaya-mgla-sova58.github.io/hero-greg.html"}]}
          blocks=re.findall(r'<script(?: id="guide-article-schema-v625")? type="application/ld\+json">.*?</script>',s,flags=re.S)
          if len(blocks)>=2:
            s=s.replace(blocks[0],'<script id="guide-article-schema-v625" type="application/ld+json">'+json.dumps(article,ensure_ascii=False,separators=(',',':'))+'</script>',1)
            s=s.replace(blocks[1],'<script type="application/ld+json">'+json.dumps(breadcrumb,ensure_ascii=False,separators=(',',':'))+'</script>',1)
          p.write_text(s,encoding='utf-8')
          PY
          mkdir -p assets/heroes/gen-03/greg
          curl -L --fail --retry 3 -sS 'https://whiteout-survival.com/heroes/greg/' -o /tmp/greg.html
          python3 - <<'PY'
          from pathlib import Path
          import re, html, urllib.request
          text=html.unescape(Path('/tmp/greg.html').read_text(encoding='utf-8',errors='ignore'))
          urls=re.findall(r'https?://[^"\'<>\s]+?\.(?:webp|png|jpe?g)',text,re.I)
          wanted={
            'portrait.webp':['Greg.webp','greg.webp'],
            'skill-righteous-wind.webp':['Righteous-Wind.webp','righteous-wind.webp'],
            'skill-poetic-justice.webp':['Poetic-Justice.webp','poetic-justice.webp'],
            'skill-fair-judgment.webp':['Fair-Judgment.webp','fair-judgment.webp'],
            'skill-sword-of-justice.webp':['Sword-of-Justice.webp','sword-of-justice.webp'],
            'skill-deterrence-of-law.webp':['Deterrence-of-Law.webp','deterrence-of-law.webp'],
            'skill-law-and-order.webp':['Law-and-Order.webp','law-and-order.webp'],
            'gear-state-edict.webp':['State-Edict.webp','state-edict.webp'],
            'gear-courtroom-order.webp':['Courtroom-Order.webp','courtroom-order.webp'],
            'gear-trumpet-of-justice.webp':['Trumpet-of-Justice.webp','trumpet-of-justice.webp'],
          }
          base=Path('assets/heroes/gen-03/greg')
          for dest,pats in wanted.items():
            match=None
            for pat in pats:
              for u in urls:
                if pat.lower() in u.lower():
                  match=u; break
              if match: break
            if match:
              urllib.request.urlretrieve(match,base/dest)
            else:
              ok=False
              for month in ['07','06','08','05']:
                for pat in pats:
                  candidate=f'https://whiteout-survival.com/wp-content/uploads/2025/{month}/'+pat
                  try:
                    urllib.request.urlretrieve(candidate,base/dest)
                    ok=True; break
                  except Exception:
                    pass
                if ok: break
            if not (base/dest).exists():
              raise SystemExit(f'Missing asset: {dest}; patterns={pats}; sample={urls[:20]}')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          url='https://belaya-mgla-sova58.github.io/hero-greg.html'
          if url not in s:
            s=s.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
            p.write_text(s,encoding='utf-8')
          PY
          git add hero-greg.html assets/heroes/gen-03/greg sitemap.xml
          git commit -m "Add detailed Greg hero page" || true
          git pull --rebase origin main
          git push origin HEAD:main
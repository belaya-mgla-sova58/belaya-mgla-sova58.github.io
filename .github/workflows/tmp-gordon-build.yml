name: Temporary Gordon build
on:
  push:
    paths:
      - '.github/workflows/tmp-gordon-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Gordon hero page
        run: |
          python -m pip install requests beautifulsoup4
          python tmp-gordon-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-gordon.html assets/heroes/gen-07/gordon sitemap.xml
          git commit -m "Add Gordon hero guide"
          git pull --rebase origin main
          git push origin main

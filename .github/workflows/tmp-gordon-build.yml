name: Temporary Gordon build
on:
  push:
    paths:
      - '.github/workflows/tmp-gordon-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Gordon hero page
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p assets/heroes/gen-07/gordon
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_venom_infusion.webp -o assets/heroes/gen-07/gordon/skill-venom-infusion.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_chemical_terror.webp -o assets/heroes/gen-07/gordon/skill-chemical-terror.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_toxic_release.webp -o assets/heroes/gen-07/gordon/skill-toxic-release.webp
          sed -i "/pick('skill-venom-infusion.webp'/d; /pick('skill-chemical-terror.webp'/d; /pick('skill-toxic-release.webp'/d" tmp-gordon-build.py
          python tmp-gordon-build.py
          git checkout -- tmp-gordon-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-gordon.html assets/heroes/gen-07/gordon sitemap.xml
          git commit -m "Add Gordon hero guide"
          git pull --rebase origin main
          git push origin main

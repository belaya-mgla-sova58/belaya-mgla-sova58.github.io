name: Temporary generation metadata polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generation-final-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish generation pages
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          python tmp-generation-final-fix.py
          git add hero-generation-*.html heroes.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish hero generation pages'
          git pull --rebase --autostash origin main
          git push

name: Lift Endless Trial image v495

on:
  push:
    paths:
      - '.github/workflows/v495-endless-image-lift.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lift Endless Trial image more visibly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('endless-trial.html')
          s = p.read_text(encoding='utf-8')
          old = 'style="position:absolute;left:0;right:0;top:-8px;width:100%;height:calc(100% + 8px);object-fit:cover;display:block"'
          new = 'style="position:absolute;left:0;right:0;top:-20px!important;width:100%;height:calc(100% + 20px)!important;object-fit:cover;display:block"'
          if old not in s:
              raise SystemExit('current Endless image style not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git add endless-trial.html
          git diff --cached --quiet || git commit -m "v495: lift Endless Trial image 20px"
          git push

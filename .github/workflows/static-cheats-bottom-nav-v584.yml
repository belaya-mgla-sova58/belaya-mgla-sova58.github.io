name: Static Cheats bottom nav v584

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/static-cheats-bottom-nav-v584.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Cheats bottom nav static and remove runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          # Replace only the mobile bottom-nav Heroes item, not sidebar/menu Heroes links.
          pat=re.compile(r'<a\s+data-v424-nav="heroes"\s+href="heroes\.html">(.*?)</a>', re.S)
          def repl(m):
              s=m.group(0)
              s=s.replace('data-v424-nav="heroes"','data-v424-nav="cheats"',1)
              s=s.replace('href="heroes.html"','href="cheats.html"',1)
              s=s.replace('assets/ui-heroes-v534.webp','ui-cheats-v583.svg',1)
              s=s.replace('<b>Герои</b>','<b>Шпоры</b>',1)
              return s

          for p in Path('.').glob('*.html'):
              txt=p.read_text(encoding='utf-8')
              nt,n=pat.subn(repl,txt)
              if n and nt!=txt:
                  p.write_text(nt,encoding='utf-8')
                  changed.append(str(p))

          # Remove separate runtime patch loader from site wrapper.
          p=Path('site-v269.js')
          txt=p.read_text(encoding='utf-8')
          nt=re.sub(r'\n\s*var mobileCheats=document\.createElement\(["\']script["\']\);\s*\n\s*mobileCheats\.src=["\']mobile-cheats-v583\.js\?v=583["\'];\s*\n\s*mobileCheats\.async=false;\s*\n\s*document\.head\.appendChild\(mobileCheats\);','',txt,flags=re.S)
          if nt!=txt:
              p.write_text(nt,encoding='utf-8'); changed.append(str(p))

          # Bottom-nav active state should know the new page.
          p=Path('site-v269-core-v465.js')
          txt=p.read_text(encoding='utf-8')
          nt=txt
          if "'cheats.html':'cheats'" not in nt:
              nt=nt.replace("'heroes.html':'heroes',\n    'fire-furnace-calculator.html':'calc',","'heroes.html':'heroes',\n    'cheats.html':'cheats',\n    'fire-furnace-calculator.html':'calc',",1)
          if nt!=txt:
              p.write_text(nt,encoding='utf-8'); changed.append(str(p))

          # Delete the no-longer-needed runtime patch.
          runtime=Path('mobile-cheats-v583.js')
          if runtime.exists():
              runtime.unlink(); changed.append(str(runtime))

          # Refresh PWA cache after removing the extra JS.
          p=Path('service-worker.js')
          if p.exists():
              txt=p.read_text(encoding='utf-8')
              nt=re.sub(r"const CACHE_NAME = 'belaya-mgla-v\d+';", "const CACHE_NAME = 'belaya-mgla-v584';", txt, count=1)
              if nt!=txt:
                  p.write_text(nt,encoding='utf-8'); changed.append(str(p))

          # One-time workflow removes itself.
          Path('.github/workflows/static-cheats-bottom-nav-v584.yml').unlink(missing_ok=True)
          print('Changed:',len(changed))
          print('\n'.join(changed))
          PY

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Make Cheats bottom navigation static and faster'
          git push origin HEAD:main

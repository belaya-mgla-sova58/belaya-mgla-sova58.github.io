name: Temporary Gregory build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-gregory-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build page and assets
        shell: bash
        run: |
          set -euo pipefail
          python tmp-gregory-build.py
          mkdir -p assets/heroes/gen-10/gregory
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          curl -fsSL "$base/Gregory.webp" -o assets/heroes/gen-10/gregory/portrait.webp
          curl -fsSL "$base/Sword-of-the-Mountain.webp" -o assets/heroes/gen-10/gregory/skill-sword-of-the-mountain.webp
          curl -fsSL "$base/Parryshield.webp" -o assets/heroes/gen-10/gregory/skill-parryshield.webp
          curl -fsSL "$base/Sacrificial-Will.webp" -o assets/heroes/gen-10/gregory/skill-sacrificial-will.webp
          curl -fsSL "$base/Legion-of-the-Sun.webp" -o assets/heroes/gen-10/gregory/skill-legion-of-the-sun.webp
          curl -fsSL "$base/Charged-Assault.webp" -o assets/heroes/gen-10/gregory/skill-charged-assault.webp
          curl -fsSL "$base/Unbroken.webp" -o assets/heroes/gen-10/gregory/skill-unbroken.webp
          curl -fsSL "$base/Solarsword.webp" -o assets/heroes/gen-10/gregory/gear-solarsword.webp
          curl -fsSL "$base/Indomitable-Armor.webp" -o assets/heroes/gen-10/gregory/gear-indomitable-armor.webp
          curl -fsSL "$base/Day-of-the-Guard.webp" -o assets/heroes/gen-10/gregory/gear-day-of-the-guard.webp
          git add hero-gregory.html sitemap.xml assets/heroes/gen-10/gregory
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Gregory generation 10 hero guide'
          git pull --rebase origin main
          git push
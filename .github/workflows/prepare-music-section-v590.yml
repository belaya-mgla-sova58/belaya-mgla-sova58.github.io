name: Prepare Music 58 section v590
on:
  push:
    paths:
      - '.github/workflows/prepare-music-section-v590.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare music section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('creative-corner.html')
          s = p.read_text(encoding='utf-8')
          style = '''
<style id="creative-music-v590-style">
.creative-music-v590{margin:18px 0 20px;padding:16px;border:1px solid rgba(117,193,245,.25);border-radius:22px;background:linear-gradient(145deg,rgba(10,45,80,.92),rgba(7,31,59,.96));box-shadow:0 14px 34px rgba(0,12,28,.20)}
.creative-music-head-v590{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.creative-music-head-v590 h2{margin:0;color:#f4faff;font-size:21px}.creative-music-head-v590 p{margin:5px 0 0;color:#b9d7e9;font-size:13px;line-height:1.45;max-width:680px}
.creative-music-badge-v590{flex:0 0 auto;padding:6px 9px;border-radius:999px;border:1px solid rgba(139,126,232,.38);background:rgba(91,75,165,.20);color:#d7d0ff;font-size:10px;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.creative-music-grid-v590{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.creative-music-grid-v590>.creative-v349-card{margin:0!important}
.creative-song-coming-v590{min-height:132px;padding:16px;border:1px dashed rgba(117,193,245,.28);border-radius:18px;background:linear-gradient(145deg,rgba(14,58,98,.72),rgba(8,34,65,.82));display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.creative-song-coming-v590:after{content:"♫";position:absolute;right:18px;bottom:6px;font-size:58px;color:rgba(139,198,238,.10)}
.creative-song-coming-v590 span{color:#8dcef7;font-size:10px;font-weight:900;letter-spacing:.08em}.creative-song-coming-v590 strong{margin-top:6px;color:#f4faff;font-size:18px}.creative-song-coming-v590 small{margin-top:6px;color:#9fc2d8;font-size:12px;line-height:1.4;max-width:320px}
@media(max-width:700px){.creative-music-head-v590{display:block}.creative-music-badge-v590{display:inline-block;margin-top:9px}.creative-music-grid-v590{grid-template-columns:1fr}.creative-music-v590{padding:12px;border-radius:18px}}
</style>
'''
          marker = '<meta content="Творчество игроков государства 58: песни, стихи, рассказы, рисунки и другие работы." name="description"/>'
          if 'creative-music-v590-style' not in s:
              s = s.replace(marker, style + marker, 1)
          song_start = '<a aria-label="Открыть песню Солнечный замок" class="creative-v349-card creative-song-card-v396" href="creative-solnechny-zamok.html">'
          music_open = '''<section class="creative-music-v590" aria-labelledby="creativeMusicTitleV590">
<div class="creative-music-head-v590"><div><h2 id="creativeMusicTitleV590">♫ Музыка 58-го</h2><p>Песни игроков государства 58. Для каждого трека — отдельная страница с плеером, автором, текстом, лайками и просмотрами.</p></div><span class="creative-music-badge-v590">НОВАЯ ПЕСНЯ ГОТОВИТСЯ</span></div>
<div class="creative-music-grid-v590">
'''
          if '<section class="creative-music-v590"' not in s:
              s = s.replace(song_start, music_open + song_start, 1)
          next_card = '<a class="creative-v349-card" href="creative-roman48.html">'
          close = '''<div class="creative-song-coming-v590" aria-label="Новая песня готовится к публикации"><span>♫ СЛЕДУЮЩАЯ ПРЕМЬЕРА</span><strong>Новая песня</strong><small>Место уже подготовлено. Добавим название, автора, обложку, аудио, дату и текст песни.</small></div>
</div></section>
'''
          if 'creative-song-coming-v590' not in s.split(next_card)[0]:
              s = s.replace(next_card, close + next_card, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative-corner.html
          git commit -m "Prepare Music 58 section" || true
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/prepare-music-section-v590.yml
          git commit -m "Remove Music 58 setup workflow"
          git push

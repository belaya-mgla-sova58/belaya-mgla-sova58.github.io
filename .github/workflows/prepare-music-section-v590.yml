name: Prepare Music 58 section v590
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-music-v590.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative-corner.html
          git commit -m "Prepare Music 58 section" || true
          git push
      - run: |
          git rm .github/workflows/prepare-music-section-v590.yml patch-music-v590.py
          git commit -m "Remove Music 58 setup files"
          git push

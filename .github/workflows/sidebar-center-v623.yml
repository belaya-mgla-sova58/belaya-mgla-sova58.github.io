name: Apply centered desktop sidebar v623

on:
  push:
    paths:
      - 'sidebar-center-v623.csspart'
      - '.github/workflows/sidebar-center-v623.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply centered sidebar
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'v623: center desktop sidebar content' site-v269.css; then
            cat sidebar-center-v623.csspart >> site-v269.css
          fi
          python3 - <<'PY'
          import pathlib,re
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'site-v269\.css\?v=\d+','site-v269.css?v=623',s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v269.css '*.html'
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Center desktop sidebar content'
            git push
          fi

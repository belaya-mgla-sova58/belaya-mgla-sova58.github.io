name: Temporary Karol build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-karol-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Karol page
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pillow
          python tmp-karol-build.py
          git add hero-karol.html sitemap.xml assets/heroes/gen-12/karol
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Karol generation 12 hero guide'
          git pull --rebase --autostash origin main
          git push

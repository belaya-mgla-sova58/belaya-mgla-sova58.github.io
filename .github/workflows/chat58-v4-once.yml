name: Chat58 v4 once
on:
  push:
    paths:
      - '.github/workflows/chat58-v4-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chat58 v4
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip,re
          Path('chat-v4.js').write_bytes(gzip.decompress(Path('.tmp/chat-v4.js.gz').read_bytes()))
          Path('chat-v4.css').write_bytes(gzip.decompress(Path('.tmp/chat-v4.css.gz').read_bytes()))
          p=Path('chat.html')
          s=p.read_text(encoding='utf-8')
          if 'chat-v4.css?v=4' not in s:
              s=s.replace('<link href="site-v269.css?v=571" rel="stylesheet"/>','<link href="site-v269.css?v=571" rel="stylesheet"/><link href="chat-v4.css?v=4" rel="stylesheet"/>',1)
          s,n=re.subn(r'<script id="chat58-js-v1">.*?</script>','<script defer src="chat-v4.js?v=4"></script>',s,count=1,flags=re.S)
          if n!=1 and 'chat-v4.js?v=4' not in s:
              raise SystemExit('chat script anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check chat-v4.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.html chat-v4.js chat-v4.css
          git diff --cached --quiet || git commit -m "Add unique nicknames and signed SOVA admin panel"
          git push

name: Fix event schedule v612
on:
  push:
    branches: [main]
    paths:
      - 'assets/event-schedule-v612.fragment.html'
      - '.github/workflows/fix-event-schedule-v612.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh schedule fragment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page=Path('events.html')
          s=page.read_text(encoding='utf-8')
          fragment=Path('assets/event-schedule-v612.fragment.html').read_text(encoding='utf-8')
          s=re.sub(r'<style id="event-schedule-colors-v613">.*?</style>\s*','',s,flags=re.S)
          pattern=r'<section class="event-schedule-v608".*?</section>'
          if re.search(pattern,s,flags=re.S):
              s=re.sub(pattern,fragment,s,count=1,flags=re.S)
          else:
              target='<div class="route-page active" data-route="events">'
              if target not in s:
                  raise SystemExit('route marker not found')
              s=s.replace(target,target+fragment,1)
          page.write_text(s,encoding='utf-8')
          PY
      - name: Commit page update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git diff --cached --quiet || git commit -m 'Refresh weekly event schedule colors'
          git push

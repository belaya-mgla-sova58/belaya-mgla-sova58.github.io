name: Fix event schedule v612
on:
  push:
    branches: [main]
    paths:
      - 'assets/event-schedule-v612.fragment.html'
      - '.github/workflows/fix-event-schedule-v612.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert schedule fragment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('events.html')
          s=page.read_text(encoding='utf-8')
          if '<section class="event-schedule-v608"' not in s:
              target='<div class="route-page active" data-route="events">'
              if target not in s:
                  raise SystemExit('route marker not found')
              fragment=Path('assets/event-schedule-v612.fragment.html').read_text(encoding='utf-8')
              s=s.replace(target,target+fragment,1)
              page.write_text(s,encoding='utf-8')
          PY
      - name: Commit page update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git diff --cached --quiet || git commit -m 'Insert weekly event schedule v612'
          git push

name: Install approved Dreams event banner once
on:
  push:
    paths:
      - '.github/workflows/sova58-install-dreams-header-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for WebP conversion
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Download and validate approved art, update only Dreams pages
        shell: bash
        env:
          IMAGE_URL: 'https://at.adobe.com/jIVCC3Q6QnMY9WYN'
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import Request,urlopen
          from PIL import Image
          from io import BytesIO
          import os
          expected='71d349e4cc0438d244baf71166e35d07f83648dcfa1f578bcebc767ed928f70e'
          with urlopen(Request(os.environ['IMAGE_URL'],headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as r:
              data=r.read(12_000_000)
          actual=sha256(data).hexdigest()
          if actual!=expected:
              raise RuntimeError('Approved image hash mismatch: '+actual)
          if data[:8]!=b'\x89PNG\r\n\x1a\n':
              raise RuntimeError('Expected approved PNG')
          with Image.open(BytesIO(data)) as original:
              if original.size!=(2172,724):
                  raise RuntimeError('Unexpected dimensions: '+str(original.size))
              image=original.convert('RGB')
          old_card='assets/dreams-card-v508.webp'
          old_header='assets/dreams-header-v508.webp'
          new='assets/dreams-approved-2172x724.webp'
          events_path=Path('events.html')
          guide_path=Path('dreams.html')
          events=events_path.read_text(encoding='utf-8')
          guide=guide_path.read_text(encoding='utf-8')
          if events.count(old_card)!=1 or guide.count(old_header)<3:
              raise RuntimeError('Old Dreams references are different than expected')
          events=events.replace(old_card,new)
          old_markup='src="'+new+'" width="1024" height="341"'
          if events.count(old_markup)!=1:
              raise RuntimeError('Unexpected Dreams card dimensions')
          events=events.replace(old_markup,'src="'+new+'" width="2172" height="724"')
          guide=guide.replace(old_header,new)
          events_path.write_text(events,encoding='utf-8')
          guide_path.write_text(guide,encoding='utf-8')
          image.save(new,format='WEBP',quality=96,method=6)
          with Image.open(new) as final:
              if final.size!=(2172,724):
                  raise RuntimeError('Output WebP dimensions incorrect')
          print('Approved Dreams art installed at 2172x724; bytes:',Path(new).stat().st_size)
          print('New references: events=',events.count(new),'guide=',guide.count(new))
          for old in (old_card,old_header):
              remaining=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                      continue
                  if p.suffix.lower() in {'.html','.js','.css','.json','.xml','.md','.txt','.svg','.webmanifest'}:
                      try:
                          if old in p.read_text(encoding='utf-8'):
                              remaining.append(str(p))
                      except (UnicodeError,OSError):
                          pass
              if remaining:
                  print('Old banner retained due to other references:',old,remaining)
              else:
                  Path(old).unlink(missing_ok=False)
                  print('Removed unused old banner:',old)
          PY
      - name: Commit precisely scoped event changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- events.html dreams.html assets/dreams-approved-2172x724.webp assets/dreams-card-v508.webp assets/dreams-header-v508.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already installed'
            exit 0
          fi
          git commit -m 'Replace Dreams event card and guide banner'
          git push origin HEAD:main

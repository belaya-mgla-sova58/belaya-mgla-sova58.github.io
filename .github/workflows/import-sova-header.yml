name: Switch SOVA58 header to local asset

on:
  push:
    paths:
      - '.github/workflows/import-sova-header.yml'

permissions:
  contents: write

jobs:
  switch-header:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Point SOVA58 page to local image
        run: |
          set -euo pipefail
          test -s assets/sova58-header-v619.png
          python - <<'PY'
          from pathlib import Path
          p = Path('sova58.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://cdn.creativeclaw.co/u/9f9da7ef/images/277c9dfc-4b55-459f-b4bd-4fb108956b85.png'
          new = 'https://belaya-mgla-sova58.github.io/assets/sova58-header-v619.png?v=619'
          if old not in s:
              raise SystemExit('External header URL not found in sova58.html')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sova58.html
          if git diff --cached --quiet; then
            echo 'Page already points to local header'
          else
            git commit -m 'Use local SOVA58 header asset'
            git push
          fi

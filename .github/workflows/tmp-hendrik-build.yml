name: Temporary Hendrik build
on:
  push:
    paths:
      - '.github/workflows/tmp-hendrik-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Hendrik hero page
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p assets/heroes/gen-08/hendrik
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Worms-Ravage.webp -o assets/heroes/gen-08/hendrik/skill-shipworm-devastation.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Armor-of-Barnacles.webp -o assets/heroes/gen-08/hendrik/skill-barnacle-armor.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Dragons-Heir.webp -o assets/heroes/gen-08/hendrik/skill-dragon-heir.webp
          python tmp-hendrik-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-hendrik.html assets/heroes/gen-08/hendrik sitemap.xml
          git commit -m "Add Hendrik hero guide"
          git pull --rebase origin main
          git push origin main

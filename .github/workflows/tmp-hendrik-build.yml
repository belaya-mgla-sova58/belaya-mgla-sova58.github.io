name: Temporary Hendrik build
on:
  push:
    paths:
      - '.github/workflows/tmp-hendrik-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Hendrik hero page
        run: |
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import re, requests
          t=requests.get('https://wos.h5joy-games.com/heroes/s8/hendrik/',headers={'User-Agent':'Mozilla/5.0'}).text
          vals=sorted(set(re.findall(r'https?://[^\"\'<> ]+\.webp|/games/[^\"\'<> ]+\.webp',t)))
          for x in vals:
              if 'hero_skill' in x or 'hendrik' in x or 'special' in x:
                  print(x)
          PY
          exit 1

name: Chat58 inline admin once
on:
  push:
    paths:
      - '.github/workflows/chat58-inline-admin-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load inline admin fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chat.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="chat-admin-inline-fix.js?v=7"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'</body>',1)
              else:
                  s += tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chat58-inline-admin-once.yml
          git add chat.html
          git commit -m "Use inline SOVA admin panel in Chat 58"
          git push

name: Clean State 58 v602
on:
  push:
    paths:
      - 'patch-state58-clean-v602.py'
      - '.github/workflows/clean-state58-v602.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-state58-clean-v602.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state-58.html service-worker.js
          git commit -m "Clean State 58 page text and categories" || true
          git push
      - run: |
          git rm .github/workflows/clean-state58-v602.yml patch-state58-clean-v602.py
          git commit -m "Remove State 58 cleanup files"
          git push

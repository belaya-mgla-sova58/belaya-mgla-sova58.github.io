name: Install approved Fishing Tournament image once
on:
  push:
    paths:
      - '.github/workflows/sova58-import-fishing-header-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python and image encoder
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for high-quality WebP compression
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Import approved art, update references, retire unused older banners
        shell: bash
        env:
          IMAGE_URL: 'https://at.adobe.com/GJwvMgOiaRZSFaMC'
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import urlopen, Request
          from PIL import Image
          from io import BytesIO
          import os, struct

          expected_sha='4a118eadc4d61a8badbbdf2f928ccfc154e60ea63e4634213758a396f2d12c9a'
          req=Request(os.environ['IMAGE_URL'],headers={'User-Agent':'Mozilla/5.0'})
          with urlopen(req,timeout=90) as response:
              data=response.read(12_000_000)
          received_sha=sha256(data).hexdigest()
          if received_sha != expected_sha:
              raise RuntimeError('Source artwork checksum mismatch: '+received_sha)
          if data[:8]!=b'\x89PNG\r\n\x1a\n':
              raise RuntimeError('Expected a PNG source file')
          with Image.open(BytesIO(data)) as im:
              if im.size!=(2172,724):
                  raise RuntimeError('Wrong image dimensions: '+str(im.size))
              image=im.convert('RGB')

          old_card='assets/fishing-card-v506.webp'
          old_guide='assets/fishing-header-v506.webp'
          new='assets/fishing-tournament-approved-2172x724.webp'

          events=Path('events.html')
          guide=Path('fishing.html')
          events_text=events.read_text(encoding='utf-8')
          guide_text=guide.read_text(encoding='utf-8')
          if events_text.count(old_card)!=1 or old_guide not in guide_text:
              raise RuntimeError('Expected old fishing card / header markup differs')
          events_text=events_text.replace(old_card,new)
          old_size='src="'+new+'" width="1024" height="341"'
          new_size='src="'+new+'" width="2172" height="724"'
          if events_text.count(old_size)!=1:
              raise RuntimeError('Unexpected fishing event card dimensions')
          events_text=events_text.replace(old_size,new_size)
          guide_text=guide_text.replace(old_guide,new)
          events.write_text(events_text,encoding='utf-8')
          guide.write_text(guide_text,encoding='utf-8')

          image.save(new,format='WEBP',quality=96,method=6)
          with Image.open(new) as verify:
              if verify.size!=(2172,724):
                  raise RuntimeError('Output dimensions do not match requested banner')
          print('Image: 2172x724, high-quality WebP, bytes:',Path(new).stat().st_size)
          print('Updated card references: 1; updated guide references:',guide_text.count(new))
          for old in (old_card,old_guide):
              remaining=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                      continue
                  if p.suffix.lower() in {'.html','.css','.js','.json','.xml','.webmanifest','.md','.txt','.svg'}:
                      try:
                          if old in p.read_text(encoding='utf-8'):
                              remaining.append(str(p))
                      except (UnicodeError,OSError):
                          pass
              if remaining:
                  print('Retaining old image still referenced in',remaining)
              else:
                  Path(old).unlink(missing_ok=False)
                  print('Deleted no-longer-used:',old)
          PY
      - name: Commit only Fishing Tournament updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- events.html fishing.html assets/fishing-tournament-approved-2172x724.webp assets/fishing-card-v506.webp assets/fishing-header-v506.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git commit -m 'Replace Fishing Tournament card and guide image'
          git push origin HEAD:main

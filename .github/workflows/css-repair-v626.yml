name: CSS repair v626

on:
  push:
    paths:
      - '.github/workflows/css-repair-v626.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair escaped newlines outside CSS strings
        shell: python
        run: |
          import pathlib
          p=pathlib.Path('site-v269.css')
          s=p.read_text(encoding='utf-8')
          out=[]; i=0; quote=None
          replaced=0
          while i < len(s):
            if quote:
              ch=s[i]; out.append(ch)
              if ch=='\\' and i+1<len(s):
                out.append(s[i+1]); i+=2; continue
              if ch==quote: quote=None
              i+=1; continue
            if s.startswith('/*',i):
              j=s.find('*/',i+2)
              if j<0:
                out.append(s[i:]); i=len(s); break
              out.append(s[i:j+2]); i=j+2; continue
            ch=s[i]
            if ch in ('"',"'"):
              quote=ch; out.append(ch); i+=1; continue
            if s.startswith('\\n',i):
              out.append('\n'); i+=2; replaced+=1; continue
            if s.startswith('\\r',i):
              out.append('\n'); i+=2; replaced+=1; continue
            if s.startswith('\\t',i):
              out.append(' '); i+=2; replaced+=1; continue
            out.append(ch); i+=1
          fixed=''.join(out)
          p.write_text(fixed,encoding='utf-8')
          print('REPAIRED_ESCAPES',replaced)

      - name: Build warning-free optimized CSS
        shell: bash
        run: |
          set -euo pipefail
          npx --yes clean-css-cli@5 -O1 -o site-v626.min.css site-v269.css 2> /tmp/cleancss.err
          cat /tmp/cleancss.err
          if grep -q 'WARNING:' /tmp/cleancss.err; then
            echo 'clean-css still reports CSS syntax warnings' >&2
            exit 1
          fi
          sed -e 's#site-v269-core-v465.js?v=465#site-core-v625.min.js?v=625#g' \
              -e 's#site-author-v615.js?v=615#site-author-v625.min.js?v=625#g' \
              site-v269.js > /tmp/site-v626-loader.js
          npx --yes terser@5 /tmp/site-v626-loader.js -c passes=1 -o site-v626.min.js
          node --check site-v626.min.js
          echo "CSS_SOURCE_BYTES $(wc -c < site-v269.css)"
          echo "CSS_MIN_BYTES $(wc -c < site-v626.min.css)"

      - name: Switch pages and service worker to repaired assets
        shell: python
        run: |
          import pathlib,re
          for p in pathlib.Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'site-v625\.min\.css\?v=\d+','site-v626.min.css?v=626',s)
            s=re.sub(r'site-v625\.min\.js\?v=\d+','site-v626.min.js?v=626',s)
            p.write_text(s,encoding='utf-8')
          sw=pathlib.Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME = 'belaya-mgla-v\d+';","const CACHE_NAME = 'belaya-mgla-v626';",s)
          s=s.replace("'./site-v625.min.css?v=625'","'./site-v626.min.css?v=626'")
          s=s.replace("'./site-v625.min.js?v=625'","'./site-v626.min.js?v=626'")
          sw.write_text(s,encoding='utf-8')

      - name: Audit repaired site assets
        shell: python
        run: |
          import pathlib
          htmls=list(pathlib.Path('.').glob('*.html'))
          assert htmls
          bad=[]
          for p in htmls:
            s=p.read_text(encoding='utf-8',errors='ignore')
            if 'site-v625.min.css?v=625' in s or 'site-v625.min.js?v=625' in s: bad.append(p.name)
          assert not bad,bad
          assert pathlib.Path('site-v626.min.css').stat().st_size < pathlib.Path('site-v269.css').stat().st_size
          print('HTML_FILES',len(htmls))
          print('OLD_V625_REFS',len(bad))

      - name: Commit repaired optimized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v269.css site-v626.min.css site-v626.min.js service-worker.js '*.html'
          git commit -m 'Repair legacy CSS syntax and publish optimized assets'
          git push

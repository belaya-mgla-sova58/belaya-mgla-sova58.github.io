name: Temporary calendar update v609
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-calendar-update-v609.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update confirmed event calendar
        run: |
          set -euo pipefail
          python tmp-calendar-update-v609.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git commit -m 'Update event calendar through 2 November 2026'
          git pull --rebase --autostash origin main
          git push

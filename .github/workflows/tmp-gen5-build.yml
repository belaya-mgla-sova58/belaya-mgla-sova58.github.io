name: Temporary Generation 5 build
on:
  push:
    paths:
      - '.github/workflows/tmp-gen5-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Generation 5 hero pages
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python tmp-gen5-build.py
          git config user.name 'belaya-mgla-sova58'
          git config user.email 'monroe6662004@gmail.com'
          git add hero-hector.html hero-norah.html hero-gwen.html assets/heroes/gen-05 sitemap.xml
          git stash push -u -m gen5-pages
          git pull --rebase origin main
          git stash pop
          git add hero-hector.html hero-norah.html hero-gwen.html assets/heroes/gen-05 sitemap.xml
          git commit -m 'Add Generation 5 hero guides'
          git push origin main

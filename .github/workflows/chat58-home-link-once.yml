name: Add Chat 58 home link once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat58-home-link-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Chat 58 to home
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='''<a class="route-link route-link-state58" href="state-58.html"><span aria-hidden="true" class="sidebar-color-icon sidebar-emoji-icon-v421">🏰</span><span>Государство 58</span></a>'''
          nav_chat=nav+'''<a class="route-link route-link-chat58" href="chat.html"><span aria-hidden="true" class="sidebar-color-icon sidebar-emoji-icon-v421">💬</span><span>Чат 58</span></a>'''
          card='''<a class="modern-topic-card-v424" href="state-58.html"><span class="v445-topic-icon" aria-hidden="true" style="font-size:28px;line-height:1;">🏰</span><b>Государство 58</b><small>Президенты, победы и история</small></a>'''
          card_chat=card+'''<a class="modern-topic-card-v424" href="chat.html"><span class="v445-topic-icon" aria-hidden="true" style="font-size:28px;line-height:1;">💬</span><b>Чат 58</b><small>Анонимный онлайн-чат государства</small></a>'''
          if 'href="chat.html"' not in s:
              if nav not in s: raise SystemExit('state58 nav anchor not found')
              s=s.replace(nav,nav_chat,1)
              if card not in s: raise SystemExit('state58 card anchor not found')
              s=s.replace(card,card_chat,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/chat58-home-link-once.yml
          git add index.html
          git commit -m "Add Chat 58 entry to home" || true
          git push

name: Temporary Bradley build
on:
  push:
    paths:
      - '.github/workflows/tmp-bradley-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Bradley hero page
        run: |
          python -m pip install requests beautifulsoup4
          python tmp-bradley-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-bradley.html assets/heroes/gen-07/bradley sitemap.xml
          git commit -m "Add Bradley hero guide" || exit 0
          git pull --rebase origin main
          git push origin main

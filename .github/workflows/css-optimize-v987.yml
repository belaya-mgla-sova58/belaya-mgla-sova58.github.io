name: Verify CSS optimization in-place via Chromium
on:
  push:
    paths: ['.github/workflows/css-optimize-v987.yml']
permissions: {contents: read}
jobs:
  controlled-css:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser and CSS compiler
        run: |
          npm install --no-save --no-package-lock lightningcss playwright pngjs
          npx playwright install --with-deps chromium
      - name: Test optimized CSS without navigating or changing any live files
        run: |
          node <<'JS'
          const fs=require('fs'),{transform}=require('lightningcss'),{chromium}=require('playwright'),{PNG}=require('pngjs');
          const original=fs.readFileSync('site-v626.min.css');
          const optimized=transform({filename:'site-v626.min.css',code:original,minify:true,sourceMap:false,errorRecovery:true}).code;
          console.log('OPTIMIZATION SIZE',JSON.stringify({originalBytes:original.length,optimizedBytes:optimized.length,percent:Math.round((1-optimized.length/original.length)*10000)/100}));
          (async()=>{
            const browser=await chromium.launch({headless:true}), failures=[];
            const pages=['index.html','events.html','hero-generations.html','heroes.html','pets.html','experts.html','gear.html','bear.html','crazy-joe.html','endless-trial.html','fishing.html','foundry.html','faq.html','calculators.html','essence-mithril-calculator.html'];
            let passed=0;
            const properties=['display','position','visibility','opacity','color','backgroundColor','backgroundImage','boxShadow','borderColor','borderWidth','borderRadius','padding','margin','fontSize','fontFamily','fontWeight','lineHeight','letterSpacing','textAlign','gridTemplateColumns','gridTemplateRows','gap','width','height','maxWidth','minWidth','objectFit','overflow','outlineColor','transform','filter'];
            for(const mode of ['desktop','mobile']){
              const ctx=await browser.newContext(mode==='desktop'?{viewport:{width:1440,height:900},deviceScaleFactor:1,serviceWorkers:'block',reducedMotion:'reduce'}:{viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block',reducedMotion:'reduce'});
              for(const name of pages){
                const page=await ctx.newPage();
                try {
                  await page.goto('https://belaya-mgla-sova58.github.io/'+name+'?cdpCssAudit=v987',{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForTimeout(520);
                  await page.addStyleTag({content:'*,*::before,*::after{animation-play-state:paused!important;transition-duration:0s!important}'});
                  const client=await ctx.newCDPSession(page),headers=[];
                  client.on('CSS.styleSheetAdded',evt=>headers.push(evt.header));
                  await client.send('DOM.enable');
                  await client.send('CSS.enable');
                  const matching=headers.filter(h=>h.sourceURL&&h.sourceURL.includes('site-v626.min.css'));
                  if(matching.length!==1)throw Error('stylesheet source count '+matching.length);
                  const id=matching[0].styleSheetId;
                  async function read(){
                    return page.evaluate(props=>{
                      const els=Array.from(document.querySelectorAll('body,body *')).slice(0,1300);
                      return els.map((el,i)=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();
                        return {i,t:el.tagName,cls:typeof el.className==='string'?el.className.slice(0,55):'',
                          css:props.map(k=>s[k]),bounds:[r.x,r.y,r.width,r.height].map(v=>Math.round(v*10)/10)};
                      });
                    },properties);
                  }
                  const before=await read();
                  const shotBefore=PNG.sync.read(await page.screenshot({animations:'disabled',caret:'hide'}));
                  await client.send('CSS.setStyleSheetText',{styleSheetId:id,text:optimized.toString('utf8')});
                  const after=await read();
                  const shotAfter=PNG.sync.read(await page.screenshot({animations:'disabled',caret:'hide'}));
                  let mismatches=0, first=[];
                  for(let i=0;i<Math.max(before.length,after.length);i++){
                    if(JSON.stringify(before[i])!==JSON.stringify(after[i])){mismatches++;if(first.length<3)first.push({before:before[i],after:after[i]})}
                  }
                  let count=0,samples=0;
                  for(let i=0;i<Math.min(shotBefore.data.length,shotAfter.data.length);i+=32){
                    samples++;
                    if(Math.abs(shotBefore.data[i]-shotAfter.data[i])+Math.abs(shotBefore.data[i+1]-shotAfter.data[i+1])+Math.abs(shotBefore.data[i+2]-shotAfter.data[i+2])>45)count++;
                  }
                  const pct=Math.round(count/Math.max(1,samples)*10000)/100;
                  const result={mode,page:name,checkedDom:before.length,changedDom:mismatches,pixelDeltaPct:pct};
                  console.log('CONTROLLED CSS',JSON.stringify(result));
                  if(mismatches>0||pct>0.65)failures.push({...result,first});
                  else passed++;
                }catch(e){failures.push({mode,page:name,error:String(e).slice(0,300)});console.log('CONTROLLED ERROR',mode,name,String(e).slice(0,230))}
                await page.close();
              }
              await ctx.close();
            }
            await browser.close();
            console.log('CONTROLLED SUMMARY',JSON.stringify({passed,total:pages.length*2,failures}));
            if(failures.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

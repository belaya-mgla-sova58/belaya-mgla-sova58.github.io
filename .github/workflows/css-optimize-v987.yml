name: Audit CSS optimization without changing site
on:
  push:
    paths: ['.github/workflows/css-optimize-v987.yml']
permissions: {contents: read}
jobs:
  safe-minification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install audit dependencies
        run: |
          npm install --no-save --no-package-lock lightningcss playwright pngjs
          npx playwright install --with-deps chromium
      - name: Compare original CSS against minified styles in the browser
        run: |
          node <<'JS'
          const fs=require('fs'),{transform}=require('lightningcss'),{chromium}=require('playwright'),{PNG}=require('pngjs');
          const original=fs.readFileSync('site-v626.min.css');
          const optimized=transform({filename:'site-v626.min.css',code:original,minify:true,sourceMap:false,errorRecovery:true}).code;
          const pct=Math.round((1-optimized.length/original.length)*10000)/100;
          console.log('MINIFY SIZES',JSON.stringify({original:original.length,optimized:optimized.length,savedPercent:pct}));
          fs.writeFileSync('/tmp/site-v626-v987-candidate.css',optimized);
          const pages=['index.html','events.html','hero-generations.html','heroes.html','pets.html','experts.html','gear.html','bear.html','crazy-joe.html','endless-trial.html','fishing.html','foundry.html','faq.html','calculators.html','essence-mithril-calculator.html'];
          (async()=>{
            let total=0,failures=[];
            const browser=await chromium.launch({headless:true});
            for(const mode of ['desktop','mobile']){
              const ctx=await browser.newContext(mode==='desktop'?{viewport:{width:1440,height:900},deviceScaleFactor:1,serviceWorkers:'block',reducedMotion:'reduce'}:{viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block',reducedMotion:'reduce'});
              for(const name of pages){
                const p=await ctx.newPage();
                const target='https://belaya-mgla-sova58.github.io/'+name+'?cssAudit=987';
                function geom(){
                  return p.evaluate(()=>{
                    const els=document.querySelectorAll('#appMain,.route-page.active,.modern-home-v424,.guide-page-v69,.section,.page-heading-v424,.intro,.guide-nav-card,.endless-card,.bear-card,.pet-stage,.pet-catalog-card,.expert-row,.faq-card,.calc-hub-card,.hero-mini,.gen-panel,.news-category-card');
                    return Array.from(els).slice(0,90).map((e,i)=>{
                      const s=getComputedStyle(e),r=e.getBoundingClientRect();
                      return [i,e.className?.toString().slice(0,55),...['display','position','color','backgroundColor','fontSize','lineHeight','borderRadius','paddingTop','paddingLeft','gridTemplateColumns'].map(q=>s[q]),Math.round(r.width*2)/2,Math.round(r.height*2)/2];
                    });
                  });
                }
                function screenshot(){return p.screenshot({animations:'disabled',caret:'hide'});}
                try{
                  await p.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
                  await p.waitForTimeout(360);
                  const beforeGeom=await geom(),beforeScreenshot=PNG.sync.read(await screenshot());
                  await p.route('**/site-v626.min.css*',route=>route.fulfill({status:200,contentType:'text/css; charset=utf-8',body:optimized}));
                  await p.reload({waitUntil:'domcontentloaded',timeout:30000});
                  await p.waitForTimeout(360);
                  const afterGeom=await geom(),afterScreenshot=PNG.sync.read(await screenshot());
                  const geometryDiff=JSON.stringify(beforeGeom)===JSON.stringify(afterGeom)?0:beforeGeom.reduce((a,row,i)=>a+(JSON.stringify(row)!==JSON.stringify(afterGeom[i])?1:0),0);
                  let changed=0,checked=0;
                  for(let k=0;k<Math.min(beforeScreenshot.data.length,afterScreenshot.data.length);k+=32){
                    checked++;
                    let q=k;
                    if(Math.abs(beforeScreenshot.data[q]-afterScreenshot.data[q])+
                       Math.abs(beforeScreenshot.data[q+1]-afterScreenshot.data[q+1])+
                       Math.abs(beforeScreenshot.data[q+2]-afterScreenshot.data[q+2])>45)changed++;
                  }
                  const pixels=Math.round(10000*changed/Math.max(1,checked))/100;
                  const info={mode,page:name,geometryDiff,comparedGeometry:beforeGeom.length,pixelDeltaPct:pixels,desktopWidth:afterGeom[1]?.at(-2)};
                  console.log('CSS COMPARE',JSON.stringify(info));
                  if(geometryDiff>0||pixels>1.2)failures.push(info);
                  total++;
                }catch(e){failures.push({mode,page:name,error:String(e).slice(0,200)})}
                await p.close();
              }
              await ctx.close();
            }
            await browser.close();
            console.log('CSS AUDIT FINAL',JSON.stringify({total,expected:pages.length*2,failures,originalBytes:original.length,minBytes:optimized.length}));
            if(failures.length||total!==pages.length*2)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

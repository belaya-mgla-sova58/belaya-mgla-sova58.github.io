name: Fix Gina and Bear event card proportions v594
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-gina-bear-v594.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html
          git commit -m "Normalize Gina and Bear event cards" || true
          git push
      - run: |
          git rm .github/workflows/fix-gina-bear-card-v594.yml patch-gina-bear-v594.py
          git commit -m "Remove Gina Bear card fix files"
          git push

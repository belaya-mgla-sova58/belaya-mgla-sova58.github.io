name: Temporary Renee build
on:
  push:
    paths:
      - '.github/workflows/tmp-renee-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Renee hero page
        run: |
          python -m pip install --quiet requests
          python tmp-renee-build.py
          git config user.name 'belaya-mgla-sova58'
          git config user.email 'monroe6662004@gmail.com'
          git add hero-renee.html assets/heroes/gen-06/renee sitemap.xml
          git stash push -u -m renee-page
          git pull --rebase origin main
          git stash pop
          git add hero-renee.html assets/heroes/gen-06/renee sitemap.xml
          git commit -m 'Add Renee hero guide'
          git push origin main

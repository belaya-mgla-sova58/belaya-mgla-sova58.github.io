name: Link generation header v716 styles
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-link-generation-v716.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add v716 override stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-generations.html')
          s=p.read_text(encoding='utf-8')
          old='<link href="hero-generations-v714.css?v=715" rel="stylesheet"/>'
          new=old+'<link href="hero-generations-v716.css?v=716" rel="stylesheet"/>'
          if 'hero-generations-v716.css?v=716' not in s:
              if old not in s:
                  raise SystemExit('base stylesheet link not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-generations.html
          git commit -m 'Enable dark generation headers and count badges'
          git push

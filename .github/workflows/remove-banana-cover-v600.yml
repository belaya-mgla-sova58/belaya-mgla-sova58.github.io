name: Remove Bananovyi MOM cover v600
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-remove-banana-cover-v600.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative-bananovyi-mom.html service-worker.js
          git commit -m "Remove Bananovyi MOM cover" || true
          git push
      - run: |
          git rm .github/workflows/remove-banana-cover-v600.yml patch-remove-banana-cover-v600.py banana-song-cover-v596.css || true
          git commit -m "Remove cover setup files" || true
          git push

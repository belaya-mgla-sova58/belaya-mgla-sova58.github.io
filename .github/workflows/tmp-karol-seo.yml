name: Temporary Karol SEO fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-karol-seo.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Karol SEO grammar
        run: |
          set -euo pipefail
          python tmp-karol-seo.py
          git add hero-karol.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Karol Russian SEO grammar'
          git pull --rebase --autostash origin main
          git push

name: Temporary Gen5 grammar fix
on:
  push:
    paths:
      - '.github/workflows/tmp-gen5-grammar.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Russian metadata
        run: |
          python <<'PY'
          from pathlib import Path
          fixes = {
            'hero-hector.html': {
              'Подробный гайд по Гектор:': 'Подробный гайд по Гектору:',
              'плюсы и минусы Гектор.': 'плюсы и минусы Гектора.'
            },
            'hero-norah.html': {
              'Подробный гайд по Нора:': 'Подробный гайд по Норе:',
              'плюсы и минусы Нора.': 'плюсы и минусы Норы.'
            }
          }
          for fn, repls in fixes.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              for a,b in repls.items(): s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'belaya-mgla-sova58'
          git config user.email 'monroe6662004@gmail.com'
          git add hero-hector.html hero-norah.html
          git stash push -u -m gen5-grammar
          git pull --rebase origin main
          git stash pop
          git add hero-hector.html hero-norah.html
          git commit -m 'Fix Generation 5 Russian metadata'
          git push origin main

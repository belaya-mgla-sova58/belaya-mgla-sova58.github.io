name: Import approved Endless Trial header once
on:
  push:
    paths:
      - '.github/workflows/sova58-import-endless-header-once.yml'

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download verified approved image and update only the two pages
        env:
          IMAGE_URL: 'https://at.adobe.com/ZP4y8CZHKccE12Sn'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import urlopen, Request
          import os
          expected='385b0c5fe7d72ad7ce623bda045c3336a61ec0ffc0ddbe0ad784800e90517775'
          url=os.environ['IMAGE_URL']
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}), timeout=60) as r:
              data=r.read(10_000_000)
          actual=sha256(data).hexdigest()
          if actual != expected:
              raise RuntimeError('Image bytes do not match approved source: '+actual)
          old='assets/endless-trial-cosmic-v1211.jpg'
          new='assets/endless-trial-approved-2172x724.jpg'
          pages=['events.html','endless-trial.html']
          for filename in pages:
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              count=text.count(old)
              if count < 1:
                  raise RuntimeError('Expected image reference missing from '+filename)
              path.write_text(text.replace(old,new),encoding='utf-8')
              print('Replaced', count, 'references in', filename)
          Path(new).write_bytes(data)
          other_refs=[]
          for root in [Path('.')]:
              for p in root.rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                      continue
                  if p.suffix.lower() in {'.html','.js','.css','.json','.xml','.webmanifest','.md','.txt','.svg'}:
                      try:
                          if old in p.read_text(encoding='utf-8'):
                              other_refs.append(str(p))
                      except (UnicodeError,OSError):
                          pass
          if not other_refs:
              Path(old).unlink(missing_ok=True)
              print('Removed unused old image:',old)
          else:
              print('Kept old image, still referenced in:',other_refs)
          print('Image verified:',len(data),'bytes, SHA-256',actual)
          PY
      - name: Commit and publish updated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- events.html endless-trial.html assets/endless-trial-approved-2172x724.jpg assets/endless-trial-cosmic-v1211.jpg
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Update approved Endless Trial header in card and guide'
          git push origin HEAD:main

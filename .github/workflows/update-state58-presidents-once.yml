name: Update State 58 presidents once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-state58-presidents-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update presidents list
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('state-58.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Кто возглавлял государство, когда и чем запомнился период.', 'Кто возглавлял государство и когда вступил в должность.')
          lines = [
              '<section class="guide-section" id="presidents"><h2>👑 История президентства</h2><p>Хронология президентов государства 58. Только ник и дата вступления в должность.</p><div class="president-timeline">',
              '<article class="president-entry"><h3>❄SOVA❄</h3><p>2026.10.11</p></article>',
              '<article class="president-entry"><h3>Роман 48</h3><p>2026.09.27</p></article>',
              '<article class="president-entry"><h3>AmoonRa</h3><p>2026.09.13</p></article>',
              '<article class="president-entry"><h3>Безразличие</h3><p>2026.08.30</p></article>',
              '<article class="president-entry"><h3>《DK》</h3><p>2026.08.16</p></article>',
              '<article class="president-entry"><h3>ツ Бⓞлⓞлⓞ</h3><p>2026.08.02</p></article>',
              '<article class="president-entry"><h3>Адмирал Ушаков</h3><p>2026.07.20</p></article>',
              '</div></section>',
              ''
          ]
          block = '\n'.join(lines)
          pattern = r'<section class="guide-section" id="presidents">.*?(?=<section class="guide-section" id="victories">)'
          new_s, n = re.subn(pattern, block, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one presidents section, replaced {n}')
          p.write_text(new_s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git add state-58.html
          git diff --cached --quiet && exit 0
          git commit -m "Fill State 58 president history"
          git push

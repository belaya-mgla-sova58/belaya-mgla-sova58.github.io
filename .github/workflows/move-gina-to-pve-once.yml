name: Move Gina guide card to PvE once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-gina-to-pve-once.yml'

permissions:
  contents: write

jobs:
  move-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Gina card into PvE section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('events.html')
          s = p.read_text(encoding='utf-8')

          card = '<a class="guide-nav-card gina-event-card-v587" href="ginas-revenge.html"><span class="gina-event-icon-v587">🏹</span><span class="gina-event-copy-v587"><span class="gina-event-badge-v587">НОВЫЙ ГАЙД</span><strong>Месть Джины</strong><small>Рога Криптида • рейды • осколки Джины • экономия энергии</small></span></a>'

          if card in s:
              s = s.replace(card, '', 1)

          pve_count_old = '<span class="event-group-count-v522">2</span>\n</div>\n<div class="guide-nav-grid event-group-grid-v522">\n<a aria-label="Престиж наёмника"'
          pve_count_new = '<span class="event-group-count-v522">3</span>\n</div>\n<div class="guide-nav-grid event-group-grid-v522">\n' + card + '\n<a aria-label="Престиж наёмника"'

          if pve_count_old not in s:
              raise SystemExit('PvE insertion point not found')
          s = s.replace(pve_count_old, pve_count_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          rm .github/workflows/move-gina-to-pve-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.html .github/workflows/move-gina-to-pve-once.yml
          git commit -m "Place Gina's Revenge under PvE events"
          git push

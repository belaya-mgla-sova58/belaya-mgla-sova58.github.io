name: Temporary dark generation headers v716
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-dark-generation-heads-v716.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dark generation header treatment
        shell: bash
        run: |
          set -euo pipefail
          cat >> hero-generations-v714.css <<'EOF'

/* v716: darker generation headers and stronger text contrast across all generations */
.gen-acc>summary{
  background-color:#030b18!important;
  background-image:linear-gradient(90deg,rgba(2,8,20,.84),rgba(3,12,27,.68) 52%,rgba(2,7,18,.80)),var(--gen-space)!important;
  border-color:rgba(117,196,238,.48)!important;
}
.gen-acc>summary::after{
  background:linear-gradient(180deg,rgba(0,5,15,.16),rgba(0,7,18,.36))!important;
}
.gen-acc>summary:hover{
  filter:saturate(1.08) brightness(1.02)!important;
}
.gen-acc[open]>summary{
  background-image:linear-gradient(90deg,rgba(2,8,20,.78),rgba(3,12,27,.60) 52%,rgba(2,7,18,.74)),var(--gen-space)!important;
}
.gen-title strong{
  color:#f8fcff!important;
  text-shadow:0 0 8px rgba(255,255,255,.34),0 0 18px rgba(81,190,255,.52),0 2px 8px rgba(0,0,0,.96)!important;
}
.gen-title span{
  color:#9edcff!important;
  text-shadow:0 1px 7px rgba(0,0,0,1)!important;
}
.gen-chevron{
  background:rgba(3,15,33,.82)!important;
  color:#dff5ff!important;
  border-color:rgba(150,218,255,.42)!important;
}
EOF
          sed -i 's/hero-generations-v714.css?v=715/hero-generations-v714.css?v=716/g' hero-generations.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-generations-v714.css hero-generations.html
          git commit -m 'Darken all hero generation headers'
          git push

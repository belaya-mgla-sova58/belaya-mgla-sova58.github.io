name: Temporary Flint page builder

on:
  push:
    paths:
      - '.github/workflows/tmp-flint-page.yml'
      - 'tmp-flint-main.html'

permissions:
  contents: write

jobs:
  build-flint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Flint page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/gen-02/flint
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          getimg(){
            out="$1"; shift
            for src in "$@"; do
              if curl -fL --retry 2 "$base/$src" -o "assets/heroes/gen-02/flint/$out"; then return 0; fi
            done
            echo "Could not download $out" >&2
            exit 1
          }
          getimg portrait.webp Flint.webp flint.webp
          getimg skill-fires-of-vengeance.webp Fires-of-Vengeance.webp fires-of-vengeance.webp
          getimg skill-incinerator.webp Incinerator.webp incinerator.webp
          getimg skill-heat-diffusion.webp Heat-Diffusion.webp heat-diffusion.webp
          getimg skill-pyromaniac.webp Pyromaniac.webp pyromaniac.webp
          getimg skill-burning-resolve.webp Burning-Resolve.webp burning-resolve.webp
          getimg skill-immolation.webp Immolation.webp immolation.webp
          getimg gear-dragonbane.webp Dragonbane.webp dragonbane.webp
          getimg gear-vengeful-task.webp Vengeful-Task.webp vengeful-task.webp
          getimg gear-dragonbreath.webp Dragonbreath.webp dragonbreath.webp
          cp hero-alonso.html hero-flint.html
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-flint.html')
          s=p.read_text(encoding='utf-8')
          repl={
          'Алонсо: навыки, Капитан Ахав, плюсы и минусы | Белая мгла':'Флинт: навыки, Драконья погибель, плюсы и минусы | Белая мгла',
          'Подробный гайд по Алонсо: герой 2 поколения, навыки Освоения и Экспедиции, Капитан Ахав, получение, прокачка, плюсы, минусы и применение.':'Подробный гайд по Флинту: герой 2 поколения, навыки Освоения и Экспедиции, Драконья погибель, получение, прокачка, плюсы, минусы и применение.',
          'hero-alonso.html':'hero-flint.html',
          'Алонсо: полный гайд':'Флинт: полный гайд',
          'Навыки, Капитан Ахав, плюсы и минусы Алонсо.':'Навыки, Драконья погибель, плюсы и минусы Флинта.',
          'assets/heroes/gen-02/alonso/portrait.webp':'assets/heroes/gen-02/flint/portrait.webp',
          '"name":"Алонсо"':'"name":"Флинт"',
          'Подробный гайд по Алонсо: герой 2 поколения, навыки Освоения и Экспедиции, Капитан Ахав, получение, плюсы и минусы.':'Подробный гайд по Флинту: герой 2 поколения, навыки Освоения и Экспедиции, Драконья погибель, получение, плюсы и минусы.'
          }
          for a,b in repl.items(): s=s.replace(a,b)
          a=s.index('<main id="appMain">'); b=s.index('</main>',a)+7
          s=s[:a]+Path('tmp-flint-main.html').read_text(encoding='utf-8').strip()+s[b:]
          p.write_text(s,encoding='utf-8')
          sm=Path('sitemap.xml'); x=sm.read_text(encoding='utf-8')
          loc='https://belaya-mgla-sova58.github.io/hero-flint.html'
          if loc not in x:
            x=x.replace('</urlset>',f'  <url><loc>{loc}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
          sm.write_text(x,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-flint.html sitemap.xml assets/heroes/gen-02/flint
          git commit -m 'Add detailed Flint hero page'
          git pull --rebase origin main
          git push
name: Temporary Alonso page builder

on:
  push:
    paths:
      - '.github/workflows/tmp-alonso-page.yml'
      - 'tmp-alonso-main.html'

permissions:
  contents: write

jobs:
  build-alonso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Alonso page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/gen-02/alonso
          getimg(){
            out="$1"; shift
            for src in "$@"; do
              for month in 07 08; do
                url="https://whiteout-survival.com/wp-content/uploads/2025/${month}/${src}"
                if curl -fL --retry 2 "$url" -o "assets/heroes/gen-02/alonso/$out"; then return 0; fi
              done
            done
            echo "Could not download $out" >&2
            exit 1
          }
          getimg portrait.webp Alonso.webp alonso.webp
          getimg skill-trapnet.webp Trapnet.webp trapnet.webp
          getimg skill-tidal-force.webp Tidal-Force.webp Tidal-force.webp tidal-force.webp
          getimg skill-harpoon-blast.webp Harpoon-Blast.webp Harpoon-blast.webp harpoon-blast.webp
          getimg skill-onslaught.webp Onslaught.webp onslaught.webp
          getimg skill-iron-strength.webp Iron-Strength.webp Iron-strength.webp iron-strength.webp
          getimg skill-poison-harpoon.webp Poison-Harpoon.webp Poison-harpoon.webp poison-harpoon.webp
          getimg gear-captain-ahab.webp Captain-Ahab.webp Captain-ahab.webp captain-ahab.webp
          getimg gear-oceans-bounty.webp Oceans-Bounty.webp Ocean-s-Bounty.webp Oceans-bounty.webp oceans-bounty.webp
          getimg gear-harpoon-enhancement.webp Harpoon-Enhancement.webp Harpoon-enhancement.webp harpoon-enhancement.webp
          cp hero-zinman.html hero-alonso.html
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-alonso.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Зинман: навыки, Дятел, строительство, плюсы и минусы | Белая мгла':'Алонсо: навыки, Капитан Ахав, плюсы и минусы | Белая мгла',
            'Подробный гайд по Зинману: навыки Освоения и Экспедиции, строительство, Дятел, получение, приоритет прокачки, плюсы, минусы и применение.':'Подробный гайд по Алонсо: герой 2 поколения, навыки Освоения и Экспедиции, Капитан Ахав, получение, прокачка, плюсы, минусы и применение.',
            'hero-zinman.html':'hero-alonso.html',
            'Зинман: полный гайд':'Алонсо: полный гайд',
            'Навыки, строительство, Дятел, плюсы и минусы Зинмана.':'Навыки, Капитан Ахав, плюсы и минусы Алонсо.',
            'assets/heroes/gen-01/zinman/portrait.webp':'assets/heroes/gen-02/alonso/portrait.webp',
            '"name":"Зинман"':'"name":"Алонсо"',
            'Подробный гайд по Зинману: навыки Освоения и Экспедиции, строительство, Дятел, получение, плюсы и минусы.':'Подробный гайд по Алонсо: герой 2 поколения, навыки Освоения и Экспедиции, Капитан Ахав, получение, плюсы и минусы.'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          start=s.index('<main id="appMain">')
          end=s.index('</main>', start)+7
          main=Path('tmp-alonso-main.html').read_text(encoding='utf-8').strip()
          s=s[:start]+main+s[end:]
          p.write_text(s, encoding='utf-8')
          sm=Path('sitemap.xml')
          x=sm.read_text(encoding='utf-8')
          loc='https://belaya-mgla-sova58.github.io/hero-alonso.html'
          if loc not in x:
              x=x.replace('</urlset>',f'  <url><loc>{loc}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
          sm.write_text(x, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-alonso.html sitemap.xml assets/heroes/gen-02/alonso
          git commit -m 'Add detailed Alonso hero page'
          git pull --rebase origin main
          git push
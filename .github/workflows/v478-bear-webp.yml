name: v478 bear webp
on:
  push:
    paths:
      - '.bear478/part4.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build approved bear image and update pages
        run: |
          cat .bear478/part1.txt .bear478/part2.txt .bear478/part3.txt .bear478/part4.txt | base64 -d > assets/bear-approved-v478.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-v269.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('event-bear-v476','event-bear-v478').replace('event-bear-header-v476','event-bear-header-v478').replace('event-bear-v476-style','event-bear-v478-style').replace('assets/bear-approved-v476.svg','assets/bear-approved-v478.webp')
          p.write_text(s,encoding='utf-8')
          for name in ['events.html','bear.html']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=s.replace('site-v269.js?v=477','site-v269.js?v=478').replace('site-v269.js?v=465','site-v269.js?v=478').replace('assets/bear-approved-v476.svg?v=477','assets/bear-approved-v478.webp?v=478').replace('assets/bear-approved-v476.svg','assets/bear-approved-v478.webp').replace('assets/img_22767d469133f308.webp','assets/bear-approved-v478.webp?v=478')
              p.write_text(s,encoding='utf-8')
          PY
          rm -rf .bear478
          rm -f .github/workflows/v478-bear-webp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v478: use approved bear as normal webp file'
          git push

name: Desktop responsive v620

on:
  push:
    paths:
      - '.github/workflows/desktop-responsive-v620.yml'

permissions:
  contents: write

jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append final desktop responsive layer
        shell: bash
        run: |
          set -euo pipefail
          cat >> site-v269.css <<'CSS'

/* ===== v620: final desktop responsive layer =====
   Keeps the approved mobile layout untouched and normalizes desktop geometry. */
@media (min-width:1201px) and (hover:hover) and (pointer:fine){
  :root{
    --desktop-sidebar:clamp(210px,14.5vw,240px);
    --desktop-content:1320px;
    --desktop-gutter:clamp(20px,2.2vw,34px);
  }

  html,body{max-width:100%;overflow-x:hidden!important;}
  body{min-width:0!important;}
  .mobile-topbar,.mobile-nav-overlay{display:none!important;}

  /* Compact fixed sidebar */
  body .nav-wrap{
    position:fixed!important;
    inset:0 auto 0 0!important;
    width:var(--desktop-sidebar)!important;
    height:100vh!important;
    margin:0!important;
    padding:112px 9px 22px!important;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    border-radius:0!important;
    box-sizing:border-box!important;
  }
  body .nav-wrap::before,body .nav-wrap::after{display:none!important;content:none!important;}
  body .nav-wrap>.sidebar-exact-logo{
    display:block!important;
    position:absolute!important;
    top:17px!important;
    left:50%!important;
    right:auto!important;
    transform:translateX(-50%)!important;
    width:min(188px,calc(100% - 28px))!important;
    max-width:188px!important;
    height:auto!important;
    object-fit:contain!important;
  }
  body .nav-wrap>nav{
    width:100%!important;
    max-width:none!important;
    margin:0!important;
    padding:0!important;
    display:flex!important;
    flex-direction:column!important;
    gap:3px!important;
    overflow:visible!important;
  }
  body .nav-wrap>nav>a,
  body .nav-wrap>nav>a.route-link{
    width:100%!important;
    min-width:0!important;
    min-height:42px!important;
    height:auto!important;
    margin:0!important;
    padding:7px 10px!important;
    gap:9px!important;
    border-radius:10px!important;
    font-size:14px!important;
    line-height:1.15!important;
    white-space:normal!important;
    transform:none!important;
  }
  body .nav-wrap nav a .sidebar-color-icon,
  body .nav-wrap nav a .state-position-menu-icon{
    width:31px!important;
    height:31px!important;
    min-width:31px!important;
    flex:0 0 31px!important;
    object-fit:contain!important;
  }

  /* Header uses the available desktop width without becoming oversized */
  body .hero,
  body.is-home-route .hero,
  body:not(.is-home-route) .hero{
    margin:0 0 0 var(--desktop-sidebar)!important;
    width:calc(100% - var(--desktop-sidebar))!important;
    max-width:none!important;
    min-height:230px!important;
    height:clamp(230px,18vw,292px)!important;
    aspect-ratio:auto!important;
    padding:0!important;
    border-radius:0!important;
    box-sizing:border-box!important;
    background-size:cover!important;
  }
  body .hero-inner{
    width:100%!important;
    max-width:none!important;
    height:100%!important;
    min-height:0!important;
    margin:0!important;
    padding:0!important;
  }
  body .ui-route-hero{
    width:100%!important;
    max-width:var(--desktop-content)!important;
    height:100%!important;
    margin:0 auto!important;
    padding:22px var(--desktop-gutter)!important;
    box-sizing:border-box!important;
    display:flex!important;
    align-items:center!important;
  }
  body .ui-route-emblem{
    width:clamp(126px,10.5vw,170px)!important;
    height:clamp(126px,10.5vw,170px)!important;
    min-width:clamp(126px,10.5vw,170px)!important;
    flex:0 0 clamp(126px,10.5vw,170px)!important;
    margin:0!important;
  }
  body .ui-route-copy{
    min-width:0!important;
    max-width:min(720px,62%)!important;
    margin-left:26px!important;
    padding:0!important;
  }
  body .ui-route-copy h1,
  body #uiRouteTitle{
    font-size:clamp(38px,3.7vw,58px)!important;
    line-height:1!important;
    margin:0 0 7px!important;
    overflow-wrap:anywhere!important;
  }
  body .ui-route-subtitle,
  body #uiRouteSubtitle{
    font-size:clamp(18px,1.8vw,26px)!important;
    line-height:1.15!important;
    margin-bottom:10px!important;
  }
  body .ui-route-copy p,
  body #uiRouteDescription{
    max-width:690px!important;
    font-size:clamp(14px,1.15vw,17px)!important;
    line-height:1.45!important;
  }
  body .ui-route-owl{
    width:clamp(180px,18vw,260px)!important;
    height:clamp(180px,18vw,260px)!important;
    right:12px!important;
    bottom:-20px!important;
  }

  /* Horizontal category bar */
  body .ui-tabsbar{
    margin-left:var(--desktop-sidebar)!important;
    width:calc(100% - var(--desktop-sidebar))!important;
    min-height:72px!important;
    height:auto!important;
    padding:10px max(var(--desktop-gutter),calc((100vw - var(--desktop-sidebar) - var(--desktop-content))/2 + var(--desktop-gutter)))!important;
    gap:10px!important;
    box-sizing:border-box!important;
    display:flex!important;
    align-items:center!important;
    justify-content:flex-start!important;
    flex-wrap:wrap!important;
  }
  body .ui-tabsbar button{
    flex:0 1 auto!important;
    min-width:150px!important;
    height:46px!important;
    padding:0 18px!important;
    border-radius:14px!important;
    font-size:15px!important;
    white-space:nowrap!important;
  }

  /* Main reading canvas */
  body main,
  body main#appMain,
  body #appMain{
    margin-left:var(--desktop-sidebar)!important;
    width:calc(100% - var(--desktop-sidebar))!important;
    max-width:none!important;
    min-width:0!important;
    padding:20px max(var(--desktop-gutter),calc((100vw - var(--desktop-sidebar) - var(--desktop-content))/2 + var(--desktop-gutter))) 64px!important;
    box-sizing:border-box!important;
  }
  body main#appMain>.route-page.active,
  body #appMain>.route-page.active{
    width:100%!important;
    max-width:var(--desktop-content)!important;
    min-width:0!important;
    margin-left:auto!important;
    margin-right:auto!important;
    box-sizing:border-box!important;
  }
  body .route-page:not([data-route="home"]).active{
    padding:18px!important;
  }
  body .guide-page-v69,
  body .page-shell,
  body .content-wrap{
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    margin-left:auto!important;
    margin-right:auto!important;
    box-sizing:border-box!important;
  }

  /* Prevent cards/media from forcing the page wider than the screen */
  body .section,
  body .guide-section,
  body .home-card,
  body .event-card,
  body .resource-card,
  body .mini-card,
  body article,
  body figure,
  body details{min-width:0!important;max-width:100%!important;box-sizing:border-box!important;}
  body img,body video,body canvas,body svg{max-width:100%!important;}
  body img,body video{height:auto!important;}
  body .author-page-v616{width:100%!important;max-width:1120px!important;margin-left:auto!important;margin-right:auto!important;}
  body .author-cover-v616{width:100%!important;height:auto!important;max-height:none!important;object-fit:contain!important;}

  /* Desktop card grids stay balanced instead of stretching into giant tiles */
  body .home-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important;}
  body .quick-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;}
  body .event-grid,
  body .resource-grid,
  body .beacon-grid,
  body .mail-grid,
  body .arena-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  body .expert-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;}
  body .pet-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;}

  body table{max-width:100%!important;}
  body .guide-section,body .details-body,body section.section{overflow-x:auto;}
}

/* Mid-size desktop / small laptop refinement */
@media (min-width:1201px) and (max-width:1399px) and (hover:hover) and (pointer:fine){
  :root{--desktop-sidebar:205px;--desktop-gutter:18px;}
  body .nav-wrap{padding-left:7px!important;padding-right:7px!important;}
  body .nav-wrap>.sidebar-exact-logo{width:164px!important;}
  body .nav-wrap>nav>a,body .nav-wrap>nav>a.route-link{font-size:13px!important;padding:7px 8px!important;gap:7px!important;}
  body .nav-wrap nav a .sidebar-color-icon,body .nav-wrap nav a .state-position-menu-icon{width:28px!important;height:28px!important;min-width:28px!important;flex-basis:28px!important;}
  body .ui-route-copy h1,body #uiRouteTitle{font-size:clamp(36px,4vw,48px)!important;}
  body .ui-route-owl{width:190px!important;height:190px!important;}
  body .ui-tabsbar button{min-width:132px!important;font-size:14px!important;padding:0 14px!important;}
  body .home-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  body .pet-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;}
}
CSS

      - name: Bump stylesheet cache version
        shell: python
        run: |
          import pathlib,re
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ns=re.sub(r'site-v269\.css\?v=\d+', 'site-v269.css?v=620', s)
              if ns!=s:
                  p.write_text(ns, encoding='utf-8')

      - name: Commit responsive desktop changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v269.css '*.html'
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Normalize desktop responsive layout'
            git push
          fi

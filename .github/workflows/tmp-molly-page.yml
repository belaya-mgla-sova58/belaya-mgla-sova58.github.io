name: Temporary Molly final patch

on:
  push:
    paths:
      - '.github/workflows/tmp-molly-page.yml'

permissions:
  contents: write

jobs:
  patch-molly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Molly metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-molly.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Подробный гайд по Джеронимо: навыки, талант, Рассвет, получение, плюсы и минусы.','Подробный гайд по Молли: навыки Освоения и Экспедиции, Дух Йети, получение, плюсы и минусы.')
          s=s.replace('"name":"Джеронимо","item":"https://belaya-mgla-sova58.github.io/hero-molly.html"','"name":"Молли","item":"https://belaya-mgla-sova58.github.io/hero-molly.html"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-molly.html
          git diff --cached --quiet || (git commit -m 'Fix Molly page metadata' && git push)

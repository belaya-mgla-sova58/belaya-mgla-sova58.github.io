name: Temporary Molly page builder

on:
  push:
    paths:
      - '.github/workflows/tmp-molly-page.yml'

permissions:
  contents: write

jobs:
  build-molly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Molly game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/gen-01/molly
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          curl -fL --retry 3 "$base/Molly.webp" -o assets/heroes/gen-01/molly/portrait.webp
          curl -fL --retry 3 "$base/Super-Snowball.webp" -o assets/heroes/gen-01/molly/skill-super-snowball.webp
          curl -fL --retry 3 "$base/Frost-Ambush.webp" -o assets/heroes/gen-01/molly/skill-frost-ambush.webp
          curl -fL --retry 3 "$base/Youthful-Persistence.webp" -o assets/heroes/gen-01/molly/skill-youthful-persistence.webp
          curl -fL --retry 3 "$base/Calling-of-the-Snow.webp" -o assets/heroes/gen-01/molly/skill-snows-grace.webp
          curl -fL --retry 3 "$base/Ice-Dominion.webp" -o assets/heroes/gen-01/molly/skill-ice-dominion.webp
          curl -fL --retry 3 "$base/Youthful-Rage.webp" -o assets/heroes/gen-01/molly/skill-youthful-rage.webp
          curl -fL --retry 3 "$base/Yeti-Spirit.webp" -o assets/heroes/gen-01/molly/gear-yeti-spirit.webp
          curl -fL --retry 3 "$base/Modified-Launcher.webp" -o assets/heroes/gen-01/molly/gear-modified-launcher.webp
          curl -fL --retry 3 "$base/Snowy-Blessing.webp" -o assets/heroes/gen-01/molly/gear-snowy-blessing.webp
      - name: Create Molly page
        shell: bash
        run: |
          set -euo pipefail
          cp hero-jeronimo.html hero-molly.html
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          p=Path('hero-molly.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Джеронимо: навыки, Рассвет, плюсы и минусы | Белая мгла','Молли: навыки, Дух Йети, плюсы и минусы | Белая мгла')
          s=s.replace('Подробный гайд по Джеронимо: навыки Освоения и Экспедиции, талант, Рассвет, получение, приоритет прокачки, плюсы, минусы и применение.','Подробный гайд по Молли: навыки Освоения и Экспедиции, Дух Йети, получение, приоритет прокачки, плюсы, минусы и применение.')
          s=s.replace('hero-jeronimo.html','hero-molly.html').replace('Джеронимо: полный гайд','Молли: полный гайд').replace('Навыки, талант, Рассвет, плюсы и минусы Джеронимо.','Навыки, Дух Йети, плюсы и минусы Молли.').replace('assets/heroes/gen-01/jeronimo/portrait.webp','assets/heroes/gen-01/molly/portrait.webp').replace('<small>Джеронимо</small>','<small>Молли</small>')
          main=gzip.decompress(base64.b64decode('')).decode('utf-8')
          s=re.sub(r'<main id="appMain">.*?</main>',main,s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-molly.html assets/heroes/gen-01/molly
          git diff --cached --quiet || (git commit -m 'Add detailed Molly hero page' && git push)

name: Move approved SvS Battle banner to Preparation once
on:
  push:
    paths:
      - '.github/workflows/sova58-move-battle-banner-to-prep-once.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main with full history for original battle artwork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Move approved banner and restore original battle header/card
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          
          before='c1d7e209165f9c53008693ef65f4e2c0309ae437'
          old_prep_card='assets/svs-prep-card-v516.webp'
          old_prep_header='assets/svs-prep-header-v516.webp'
          new_banner='assets/svs-battle-approved-2172x724.webp'
          new_prep='assets/svs-prep-approved-2172x724.webp'
          original_battle_card='assets/svs-battle-card-v514.webp'
          original_battle_header='assets/svs-battle-header-v514.webp'
          
          events_path=Path('events.html')
          battle_path=Path('svs.html')
          prep_path=Path('svs-prep.html')
          events=events_path.read_text(encoding='utf-8')
          battle=battle_path.read_text(encoding='utf-8')
          prep=prep_path.read_text(encoding='utf-8')
          
          if events.count(new_banner)!=1 or events.count(old_prep_card)!=1:
              raise RuntimeError('Expected exactly one battle and one preparation card')
          if battle.count(new_banner)<3 or prep.count(old_prep_header)<3:
              raise RuntimeError('Battle/preparation guide image links differ from expected')
          if not Path(new_banner).is_file() or Path(new_prep).exists():
              raise RuntimeError('Expected one current approved banner and no new prep banner')
          original_sha=subprocess.check_output(['git','hash-object',new_banner],text=True).strip()
          if original_sha!='0f04da76db84d530f8971510aadf76b6ee7a9403':
              raise RuntimeError('Approved banner has an unexpected Git blob hash: '+original_sha)
          
          for filepath, expected_sha in [
              (original_battle_card,'a9fd21da0438ab102eebfbf34b4355e16db3a276'),
              (original_battle_header,'f4b06e8382da8c97bdb14f6dd4c463aee9bfee14'),
          ]:
              raw=subprocess.check_output(['git','show',f'{before}:{filepath}'])
              Path(filepath).write_bytes(raw)
              actual=subprocess.check_output(['git','hash-object',filepath],text=True).strip()
              if actual!=expected_sha:
                  raise RuntimeError(f'Restored {filepath} differs from original: {actual}')
              print('Restored original Battle Phase image:',filepath)
          
          # Make the 2172x724 artwork exclusive to Preparation.
          Path(new_banner).rename(new_prep)
          events=events.replace(old_prep_card,new_prep).replace(new_banner,original_battle_card)
          previous_prep_dimensions='src="'+new_prep+'" width="1024" height="341"'
          previous_battle_dimensions='src="'+original_battle_card+'" width="2172" height="724"'
          if events.count(previous_prep_dimensions)!=1 or events.count(previous_battle_dimensions)!=1:
              raise RuntimeError('Unexpected card dimension markup')
          events=events.replace(previous_prep_dimensions,'src="'+new_prep+'" width="2172" height="724"')
          events=events.replace(previous_battle_dimensions,'src="'+original_battle_card+'" width="1024" height="341"')
          prep=prep.replace(old_prep_header,new_prep)
          battle=battle.replace(new_banner,original_battle_header)
          events_path.write_text(events,encoding='utf-8')
          prep_path.write_text(prep,encoding='utf-8')
          battle_path.write_text(battle,encoding='utf-8')
          
          assert events.count(new_prep)==1 and events.count(original_battle_card)==1
          assert prep.count(new_prep)>=3 and battle.count(original_battle_header)>=3
          assert new_banner not in events and new_banner not in battle
          
          # Remove old Preparation artwork ONLY if no site content still references it.
          for old in (old_prep_card,old_prep_header):
              remaining=[]
              for f in Path('.').rglob('*'):
                  if not f.is_file() or '.git' in f.parts or '.github' in f.parts:
                      continue
                  if f.suffix.lower() in {'.html','.css','.js','.json','.xml','.webmanifest','.md','.txt','.svg'}:
                      try:
                          if old in f.read_text(encoding='utf-8'):
                              remaining.append(str(f))
                      except (UnicodeError,OSError):
                          pass
              if not remaining:
                  Path(old).unlink(missing_ok=False)
                  print('Deleted unused Preparation banner:',old)
              else:
                  print('Kept still-referenced Preparation image:',old,remaining)
          print('Moved approved image without re-encoding; image Git blob:',original_sha)
          print('Updated only events.html, svs.html, svs-prep.html')
          PY
      - name: Commit only SvS card and banner changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- events.html svs.html svs-prep.html assets/svs-battle-approved-2172x724.webp assets/svs-prep-approved-2172x724.webp assets/svs-battle-card-v514.webp assets/svs-battle-header-v514.webp assets/svs-prep-card-v516.webp assets/svs-prep-header-v516.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Move approved battle banner to SvS preparation and restore battle artwork'
          git push origin HEAD:main

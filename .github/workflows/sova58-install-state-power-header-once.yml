name: Install approved State Power banner once
on:
  push:
    paths:
      - '.github/workflows/sova58-install-state-power-header-once.yml'
permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet 'Pillow>=10,<13'
      - name: Install verified art in State Power card and guide
        shell: bash
        env:
          IMAGE_URL: 'https://at.adobe.com/tnharkO8d5O3OzYL'
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image
          import os
          expected='24502617d2db4bb634b6f2da71d8046ccc192758a685fc2f1343957eada03ef8'
          with urlopen(Request(os.environ['IMAGE_URL'],headers={'User-Agent':'Mozilla/5.0'}),timeout=90) as r:
              payload=r.read(12_000_000)
          actual=sha256(payload).hexdigest()
          if actual!=expected:
              raise RuntimeError('The image is not the approved one: '+actual)
          if payload[:8]!=b'\x89PNG\r\n\x1a\n':
              raise RuntimeError('Expected PNG input')
          with Image.open(BytesIO(payload)) as source:
              if source.size!=(2172,724):
                  raise RuntimeError('Wrong input size: '+str(source.size))
              image=source.convert('RGB')
          card='assets/state-power-card-v521.webp'
          header='assets/state-power-header-v521.webp'
          new='assets/state-power-approved-2172x724.webp'
          events_file=Path('events.html')
          guide_file=Path('state-power.html')
          events=events_file.read_text(encoding='utf-8')
          guide=guide_file.read_text(encoding='utf-8')
          if events.count(card)!=1 or guide.count(header)<3:
              raise RuntimeError('State Power card/guide references unexpected')
          events=events.replace(card,new)
          dimensions='src="'+new+'" width="1024" height="341"'
          if events.count(dimensions)!=1:
              raise RuntimeError('Card dimensions are not as expected')
          events=events.replace(dimensions,'src="'+new+'" width="2172" height="724"')
          guide=guide.replace(header,new)
          events_file.write_text(events,encoding='utf-8')
          guide_file.write_text(guide,encoding='utf-8')
          image.save(new,format='WEBP',quality=96,method=6)
          with Image.open(new) as check:
              assert check.size==(2172,724)
          print('Verified final WebP: 2172 x 724,',Path(new).stat().st_size,'bytes')
          print('Updated new-image references:',events.count(new),guide.count(new))
          for old in (card,header):
              references=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or '.git' in p.parts or '.github' in p.parts:
                      continue
                  if p.suffix.lower() in {'.html','.css','.js','.json','.xml','.webmanifest','.md','.txt','.svg'}:
                      try:
                          if old in p.read_text(encoding='utf-8'):
                              references.append(str(p))
                      except (OSError,UnicodeError):
                          pass
              if references:
                  print('Retained still referenced:',old,references)
              else:
                  Path(old).unlink(missing_ok=False)
                  print('Removed unused old asset:',old)
          PY
      - name: Commit State Power files only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- events.html state-power.html assets/state-power-approved-2172x724.webp assets/state-power-card-v521.webp assets/state-power-header-v521.webp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'Replace State Power card and guide banner'
          git push origin HEAD:main

name: v479 prestige art
on:
  push:
    paths:
      - '.github/workflows/v479-prestige.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install approved Prestige artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js=Path('site-v269.js')
          s=js.read_text(encoding='utf-8')
          marker='event-prestige-v479-style'
          if marker not in s:
              s += r'''

(function(){
  var style=document.createElement('style');
  style.id='event-prestige-v479-style';
  style.textContent='\
body.is-events-route .guide-nav-card.event-prestige-v479{position:relative!important;min-height:0!important;aspect-ratio:2/1!important;padding:0!important;overflow:hidden!important;border-radius:14px!important;border:1px solid rgba(108,205,255,.35)!important;background-image:url("assets/events-cards-sprite-v466.jpg")!important;background-size:100% 700%!important;background-position:center 16.666667%!important;background-repeat:no-repeat!important;color:transparent!important;font-size:0!important;box-shadow:0 10px 24px rgba(0,8,24,.22)!important;}\
body.is-events-route .guide-nav-card.event-prestige-v479::after{content:"";position:absolute;inset:9px;border:1px solid rgba(220,245,255,.55);border-radius:12px;pointer-events:none;}\
body.is-mercenary-prestige-route .page-heading-v424.frost-header-v431.event-prestige-header-v479{position:relative!important;padding:0!important;overflow:hidden!important;background-image:url("assets/events-headers-sprite-v466.jpg")!important;background-size:100% 700%!important;background-position:center 16.666667%!important;background-repeat:no-repeat!important;border:0!important;box-shadow:none!important;aspect-ratio:3/1!important;min-height:0!important;border-radius:14px!important;}\
body.is-mercenary-prestige-route .event-prestige-header-v479::after{content:"";position:absolute;inset:14px;border:1px solid rgba(220,245,255,.55);border-radius:14px;pointer-events:none;}\
body.is-mercenary-prestige-route .event-prestige-header-v479>h1,body.is-mercenary-prestige-route .event-prestige-header-v479>p{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}\
@media(max-width:760px){body.is-events-route .guide-nav-card.event-prestige-v479,body.is-mercenary-prestige-route .event-prestige-header-v479{border-radius:12px!important;}body.is-events-route .guide-nav-card.event-prestige-v479::after{inset:7px;border-radius:10px;}body.is-mercenary-prestige-route .event-prestige-header-v479::after{inset:9px;border-radius:11px;}}';
  document.head.appendChild(style);

  function applyPrestigeArt(){
    var path=(location.pathname.split('/').pop()||'index.html').toLowerCase();
    if(path==='events.html'){
      document.querySelectorAll('.guide-nav-card[href="mercenary-prestige.html"]').forEach(function(card){
        card.classList.add('event-prestige-v479');
        card.setAttribute('aria-label','Престиж наёмника');
        card.setAttribute('title','Престиж наёмника');
      });
    }
    if(path==='mercenary-prestige.html'){
      var sec=document.querySelector('.page-heading-v424.frost-header-v431');
      if(sec) sec.classList.add('event-prestige-header-v479');
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',applyPrestigeArt,{once:true});
  else applyPrestigeArt();
})();
'''
              js.write_text(s,encoding='utf-8')

          for name in ['events.html','mercenary-prestige.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              import re
              s=re.sub(r'site-v269\.js\?v=\d+', 'site-v269.js?v=479', s)
              p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/v479-prestige.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v479: add approved Prestige card and header'
          git push

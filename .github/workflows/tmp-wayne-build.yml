name: Temporary Wayne build
on:
  push:
    paths:
      - '.github/workflows/tmp-wayne-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Wayne hero page
        run: |
          python -m pip install requests
          python tmp-wayne-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-wayne.html assets/heroes/gen-06/wayne sitemap.xml
          git commit -m "Add Wayne hero guide" || exit 0
          git pull --rebase origin main
          git push origin main

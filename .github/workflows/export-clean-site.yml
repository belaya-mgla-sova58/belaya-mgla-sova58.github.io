name: Export clean website ZIP
on:
  push:
    branches: [clean-export-2026-11-19]
    paths:
      - '.github/workflows/export-clean-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble clean static website package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, zipfile, hashlib, json, collections
          root=Path('.')
          excluded_dirs={'.git','.github','tests','visual-tests','scripts','node_modules',
              'test-results','playwright-report','coverage','_site','.venv','venv','__pycache__'}
          allowed={'.html','.css','.js','.json','.webmanifest','.xml','.txt','.png','.jpg','.jpeg',
              '.webp','.avif','.svg','.ico','.mp3','.mp4','.webm','.gif','.woff','.woff2','.ttf','.otf',
              '.pdf','.wasm'}
          files=sorted(p for p in root.rglob('*') if p.is_file()
              and not any(part in excluded_dirs for part in p.parts)
              and (p.suffix.lower() in allowed or p.name=='.nojekyll'))
          pages=[p for p in files if p.suffix.lower()=='.html']
          assert len(pages)>=190, f'Unexpectedly few website pages: {len(pages)}'
          assert Path('index.html') in files and Path('bear.html') in files
          text_ext={'.html','.css','.js','.json','.webmanifest','.xml','.txt'}
          texts={p:p.read_text('utf-8',errors='replace') for p in files if p.suffix.lower() in text_ext}
          # Exclude ONLY CSS/JS not discoverable from the existing page and script references.
          # Other assets are retained if ambiguous: do not silently break dynamic game images.
          css_js={p for p in files if p.suffix.lower() in {'.css','.js'}}
          names=collections.defaultdict(list)
          for p in css_js:names[p.name].append(p)
          keep_text=set(pages)|set(p for p in texts if p.suffix.lower() not in {'.css','.js'})
          queue=list(keep_text)
          import_pat=re.compile(r'(?<![A-Za-z0-9_.-])([A-Za-z0-9_./-]+\.(?:css|js))(?:\?[^"''\s<>)]*)?',re.I)
          while queue:
              current=queue.pop()
              for token in import_pat.findall(texts.get(current,'')):
                  basename=token.split('/')[-1]
                  for candidate in names.get(basename,[]):
                      if candidate not in keep_text:
                          keep_text.add(candidate)
                          queue.append(candidate)
          unused_code=sorted(css_js-keep_text)
          included=[p for p in files if p not in unused_code]
          # Ensure no original legacy Bear illustration survives the new clean export.
          forbidden={'assets/img_22767d469133f308.webp','assets/img_f4053b4bd49b720d.webp'}
          assert not forbidden.intersection({str(p) for p in included})
          # Verify that every static local HTML reference remains in the package.
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,unquote
          class URLs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for k in ('href','src','poster'):
                      if d.get(k): self.links.append(d[k])
          included_set={p.as_posix() for p in included}
          missing=[]
          for p in pages:
              parser=URLs();parser.feed(texts[p])
              for href in parser.links:
                  if href.startswith(('#','//','data:','mailto:','tel:','javascript:','blob:')):continue
                  u=urlsplit(href)
                  if u.scheme or u.netloc:continue
                  target=unquote(u.path)
                  if not target or '{' in target or '}' in target: continue
                  target_path=(Path(target.lstrip('/')) if target.startswith('/') else p.parent/target)
                  if target_path.is_dir():target_path/='index.html'
                  if target_path.as_posix() not in included_set:
                      missing.append((str(p),href))
          if missing:
              raise RuntimeError(f'Archive would have {len(missing)} broken HTML references: {missing[:20]}')
          archive=Path('belaya-mgla-clean-site-2026-11-19.zip')
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in included:z.write(p,p.as_posix())
          with zipfile.ZipFile(archive) as z:
              bad=z.testzip()
              assert bad is None, f'Invalid ZIP entry: {bad}'
              assert len(z.namelist())==len(included)
              assert 'index.html' in z.namelist()
              assert 'bear.html' in z.namelist()
              assert 'service-worker.js' in z.namelist()
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          report={
            'source_commit':os.environ.get('GITHUB_SHA'),
            'pages':len(pages),'files_in_archive':len(included),
            'omitted_unreferenced_css_js':len(unused_code),
            'omitted_css_js_names':[p.as_posix() for p in unused_code],
            'missing_html_refs':len(missing),
            'zip_bytes':archive.stat().st_size,
            'sha256':digest,
            'note':'Uncertain images retained to avoid broken game icons; deleted legacy Bear backgrounds are absent.'
          }
          Path('PACKAGE-AUDIT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Audit, refresh cache and prepare complete working project
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, re, json, os, pathlib, hashlib
          src=pathlib.Path('belaya-mgla-clean-site-2026-11-19.zip')
          with zipfile.ZipFile(src) as z:
              site={n:z.read(n) for n in z.namelist()}
          assert 'service-worker.js' in site and 'pwa-install.js' in site
          old_sw=site['service-worker.js'].decode('utf-8')
          old_install=site['pwa-install.js'].decode('utf-8')
          assert "belaya-mgla-v1193" in old_sw
          assert "service-worker.js?v=1193" in old_install
          site['service-worker.js']=old_sw.replace('belaya-mgla-v1193','belaya-mgla-v1205').encode('utf-8')
          site['pwa-install.js']=old_install.replace('service-worker.js?v=1193','service-worker.js?v=1205').encode('utf-8')
          revisions=0
          for n,data in list(site.items()):
              if n.endswith('.html'):
                  s=data.decode('utf-8')
                  t,count=re.subn(r'(site-v626\.min\.css\?v=)\d+',r'\g<1>1205',s)
                  if count:site[n]=t.encode('utf-8'); revisions+=count
          assert revisions>=120, 'Not enough CSS cache keys changed'
          missing_canyon='assets/canyon-header-v802.webp'
          misspelled_canyon='assets/canyon-header-v802.webp.webp'
          assert missing_canyon not in site and misspelled_canyon in site
          site[missing_canyon]=site.pop(misspelled_canyon)
          # Remove only confirmed unused old Bear banner variants.
          obsolete_bear=[
            'assets/bear-approved-header-v478.svg',
            'assets/bear-approved-v476.svg',
            'assets/bear-approved-v478.webp',
            'assets/bear-approved-v497.webp',
            'assets/bear-card-v471.webp',
            'assets/bear-header-v471.webp',
            'assets/bear-header-v499.webp',
            'assets/event-bear-v498.jpg']
          text=''.join(v.decode('utf-8','replace') for n,v in site.items()
                   if n.endswith(('.html','.css','.js','.json','.webmanifest','.xml','.txt')))
          for name in obsolete_bear:
              if name not in site:continue
              assert name not in text and name.split('/')[-1] not in text, 'Still-referenced Bear asset: '+name
              site.pop(name)
          # Project archive additionally includes all legitimate source-control tooling.
          project=dict(site)
          project['README-CLEAN-EXPORT.txt']=(
              'BELAYA MGLA CLEAN WORKING PROJECT / 2026-11-19\n'
              'Use CLEAN-SITE ZIP for an isolated static preview or web hosting.\n'
              'Use CLEAN-PROJECT ZIP to replace a GitHub repository and continue development.\n'
              'Keep existing backup branch snapshot-2026-11-19-current-base.\n'
              'Extract files into repository root, not one nested directory.\n'
              'CSS and PWA cache keys refreshed to 1205. Review GitHub Pages deployment and all browser tests before replacing production.\n'
          ).encode('utf-8')
          inf=[]
          root=pathlib.Path('.')
          for folder in ['.github','tests','visual-tests','scripts']:
              for p in (root/folder).rglob('*'):
                  if p.is_file() and not any(s in p.parts for s in ['node_modules','test-results','playwright-report','__pycache__']):
                      if p.name=='export-clean-site.yml':continue
                      rel=p.as_posix()
                      if rel not in project:
                          project[rel]=p.read_bytes();inf.append(rel)
          for name in ['package.json','WORKING-RULES.md','PROJECT-HISTORY.md','README.md']:
              p=root/name
              if p.is_file() and name not in project:
                  project[name]=p.read_bytes();inf.append(name)
          # Repair a pre-existing missing closing brace in the old, non-production calculator test.
          # No calculator logic or live site page is modified.
          test_path='tests/calculator-regression-v1.cjs'
          test_text=project[test_path].decode('utf-8')
          assert test_text.count('const parserExprs=[')==1 and 'for(let from=0;from<=20;from++){' in test_text
          prefix,suffix=test_text.split('const parserExprs=[',1)
          assert prefix.rstrip().endswith('}\n}') is False or prefix.rstrip().endswith('}')  # guard preceding section
          project[test_path]=(prefix.rstrip()+'\n}\nconst parserExprs=['+suffix).encode('utf-8')
          assert len(inf)>=20,'Developer tooling missing'
          # Every local HTML link must resolve in each archive, including scripts introduced dynamically.
          from html.parser import HTMLParser
          from urllib.parse import urlsplit,unquote
          class P(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  for key in ['href','src','poster']:
                      if d.get(key):self.links.append(d[key])
          missing=[]
          for page,content in site.items():
              if not page.endswith('.html'):continue
              parser=P();parser.feed(content.decode('utf-8','replace'))
              parent=pathlib.PurePosixPath(page).parent
              for val in parser.links:
                  if val.startswith(('#','//','data:','mailto:','tel:','javascript:','blob:')):continue
                  u=urlsplit(val)
                  if u.scheme or u.netloc or not u.path or '{' in u.path:continue
                  target=(pathlib.PurePosixPath(u.path.lstrip('/')) if u.path.startswith('/') else parent/u.path)
                  target=pathlib.PurePosixPath(os.path.normpath(str(target)))
                  if str(target) not in site and not val.endswith('/'):missing.append((page,val))
          assert not missing, repr(missing[:10])
          assert not any('img_22767d469133f308' in name or 'img_f4053b4bd49b720d' in name for name in site)
          checks={}
          for kind,items in [('site',site),('project',project)]:
              dest=pathlib.Path('belaya-mgla-'+kind+'-checked-2026-11-19.zip')
              with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
                  for name,content in sorted(items.items()):z.writestr(name,content)
              with zipfile.ZipFile(dest) as z:
                  assert not z.testzip()
                  assert len(z.namelist())==len(items)
                  for required in ['index.html','bear.html','winter-siege.html','site-v626.min.css','service-worker.js','manifest-v541.webmanifest','search-index.json']:
                      assert required in z.namelist(), required
              checks[kind]={'file':str(dest),'entries':len(items),'size':dest.stat().st_size,
                       'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
          assert len([n for n in site if n.endswith('.html')])==203
          assert 'onesignal/OneSignalSDKWorker.js' not in site  # inactive legacy integration
          summary={'source_commit':os.environ.get('GITHUB_SHA'),'css_cache_revisions':revisions,
              'sw_version':'1205','deleted_verified_bear_assets':obsolete_bear,'source_files_added':len(inf),
              'missing_HTML_files':len(missing),'outputs':checks}
          pathlib.Path('FINAL-PACKAGE-CHECK.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          mkdir -p /tmp/sova58-package-validation
          unzip -q belaya-mgla-project-checked-2026-11-19.zip -d /tmp/sova58-package-validation
          (cd /tmp/sova58-package-validation && node tests/pwa-integrity.cjs && node tests/calculator-regression-v1.cjs)
      - name: Upload fully checked ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: belaya-mgla-checked-archives-2026-11-19
          path: |
            belaya-mgla-site-checked-2026-11-19.zip
            belaya-mgla-project-checked-2026-11-19.zip
            FINAL-PACKAGE-CHECK.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload full website ZIP and audit
        uses: actions/upload-artifact@v4
        with:
          name: belaya-mgla-clean-site-2026-11-19
          path: |
            belaya-mgla-clean-site-2026-11-19.zip
            PACKAGE-AUDIT.json
          if-no-files-found: error
          retention-days: 90

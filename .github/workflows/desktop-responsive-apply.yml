name: Apply desktop responsive

on:
  push:
    paths:
      - '.github/workflows/desktop-responsive-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CSS and bump cache
        run: |
          set -euo pipefail
          cat desktop-v620.csspart >> site-v269.css
          python3 - <<'PY'
          import pathlib,re
          for p in pathlib.Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ns=re.sub(r'site-v269\.css\?v=\d+', 'site-v269.css?v=620', s)
              if ns!=s:
                  p.write_text(ns, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v269.css *.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Normalize desktop responsive layout'
            git push
          fi

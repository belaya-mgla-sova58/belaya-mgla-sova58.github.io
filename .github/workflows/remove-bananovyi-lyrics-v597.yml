name: Remove Bananovyi MOM lyrics v597
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-remove-bananovyi-lyrics-v597.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creative-bananovyi-mom.html service-worker.js
          git commit -m "Remove Bananovyi MOM lyrics" || true
          git push
      - run: |
          git rm .github/workflows/remove-bananovyi-lyrics-v597.yml patch-remove-bananovyi-lyrics-v597.py
          git commit -m "Remove lyrics cleanup files"
          git push

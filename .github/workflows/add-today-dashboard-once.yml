name: Add Today dashboard once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-today-dashboard-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Today dashboard to home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')

          style = r'''<style id="home-today-v581-style">
          body.is-home-route .home-today-v581{margin:14px 0 18px;padding:18px;border:1px solid rgba(108,205,255,.24);border-radius:24px;background:linear-gradient(145deg,rgba(7,30,56,.92),rgba(4,19,38,.94));box-shadow:0 18px 46px rgba(0,0,0,.22);position:relative;overflow:hidden}
          body.is-home-route .home-today-v581:before{content:"";position:absolute;inset:-70px auto auto -70px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(90,200,255,.14),transparent 68%);pointer-events:none}
          body.is-home-route .home-today-head-v581{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
          body.is-home-route .home-today-title-v581{display:flex;align-items:center;gap:11px;min-width:0}
          body.is-home-route .home-today-owl-v581{display:grid;place-items:center;flex:0 0 46px;width:46px;height:46px;border-radius:16px;background:rgba(99,202,255,.11);border:1px solid rgba(135,220,255,.20);font-size:26px}
          body.is-home-route .home-today-title-v581 h2{margin:0;font-size:24px;line-height:1.08;color:#f5fbff}
          body.is-home-route .home-today-date-v581{display:block;margin-top:4px;color:#8fb8d6;font-size:13px}
          body.is-home-route .home-today-rule-v581{max-width:360px;margin:0;color:#b9d3e7;font-size:13px;line-height:1.45;text-align:right}
          body.is-home-route .home-today-layout-v581{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:14px}
          body.is-home-route .home-today-check-v581,body.is-home-route .home-today-links-v581{border:1px solid rgba(121,202,246,.14);border-radius:18px;background:rgba(4,18,35,.56);padding:14px}
          body.is-home-route .home-today-sub-v581{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;color:#eaf7ff;font-size:15px;font-weight:800}
          body.is-home-route .home-today-progress-v581{color:#76d6ff;font-size:12px;font-weight:800}
          body.is-home-route .home-today-list-v581{display:grid;gap:8px}
          body.is-home-route .home-today-item-v581{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.035);cursor:pointer;transition:.18s ease}
          body.is-home-route .home-today-item-v581:hover{background:rgba(105,203,255,.075)}
          body.is-home-route .home-today-item-v581 input{appearance:none;-webkit-appearance:none;flex:0 0 21px;width:21px;height:21px;margin:1px 0 0;border-radius:7px;border:1px solid rgba(138,216,255,.46);background:rgba(5,20,38,.84);display:grid;place-items:center;cursor:pointer}
          body.is-home-route .home-today-item-v581 input:checked{background:linear-gradient(145deg,#47c9ff,#278ce8);border-color:#71dbff}
          body.is-home-route .home-today-item-v581 input:checked:after{content:"✓";color:white;font-size:14px;font-weight:900;line-height:1}
          body.is-home-route .home-today-item-v581 span{color:#d9ecf8;font-size:14px;line-height:1.35}
          body.is-home-route .home-today-item-v581 input:checked+span{color:#7fa5bd;text-decoration:line-through;text-decoration-thickness:1px}
          body.is-home-route .home-today-links-grid-v581{display:grid;grid-template-columns:1fr 1fr;gap:8px}
          body.is-home-route .home-today-link-v581{display:flex;align-items:center;gap:9px;min-height:58px;padding:10px 11px;border-radius:14px;border:1px solid rgba(126,207,249,.13);background:rgba(255,255,255,.035);text-decoration:none!important;transition:.18s ease}
          body.is-home-route .home-today-link-v581:hover{transform:translateY(-1px);background:rgba(104,204,255,.08);border-color:rgba(126,207,249,.28)}
          body.is-home-route .home-today-link-v581 strong{display:block;color:#effaff;font-size:13px;line-height:1.16}
          body.is-home-route .home-today-link-v581 small{display:block;margin-top:3px;color:#7faac8;font-size:11px;line-height:1.2}
          body.is-home-route .home-today-link-icon-v581{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;border-radius:11px;background:rgba(99,199,255,.10);font-size:20px}
          body.is-home-route .home-today-note-v581{margin:10px 1px 0;color:#8aaec6;font-size:11.5px;line-height:1.35}
          @media(max-width:900px){body.is-home-route .home-today-layout-v581{grid-template-columns:1fr}body.is-home-route .home-today-rule-v581{display:none}}
          @media(max-width:620px){body.is-home-route .home-today-v581{margin:10px 0 14px;padding:13px;border-radius:18px}body.is-home-route .home-today-title-v581 h2{font-size:20px}body.is-home-route .home-today-owl-v581{flex-basis:40px;width:40px;height:40px;border-radius:13px;font-size:22px}body.is-home-route .home-today-head-v581{margin-bottom:11px}body.is-home-route .home-today-check-v581,body.is-home-route .home-today-links-v581{padding:11px;border-radius:15px}body.is-home-route .home-today-item-v581{padding:9px}body.is-home-route .home-today-links-grid-v581{grid-template-columns:1fr 1fr;gap:7px}body.is-home-route .home-today-link-v581{min-height:55px;padding:8px}}
          @media(max-width:390px){body.is-home-route .home-today-links-grid-v581{grid-template-columns:1fr}}
          </style>'''
          if 'home-today-v581-style' not in s:
              s = s.replace('</head>', style + '</head>', 1)

          block = r'''<section class="home-today-v581" aria-labelledby="homeTodayTitleV581">
          <div class="home-today-head-v581">
            <div class="home-today-title-v581"><span class="home-today-owl-v581" aria-hidden="true">🦉</span><div><h2 id="homeTodayTitleV581">Что делать сегодня?</h2><span class="home-today-date-v581" id="homeTodayDateV581">Ежедневная шпаргалка</span></div></div>
            <p class="home-today-rule-v581"><b>Правило дня:</b> сначала проверь события и условия начисления очков, потом трать редкие ресурсы.</p>
          </div>
          <div class="home-today-layout-v581">
            <div class="home-today-check-v581">
              <div class="home-today-sub-v581"><span>Ежедневный чек-лист</span><span class="home-today-progress-v581" id="homeTodayProgressV581">0 / 5</span></div>
              <div class="home-today-list-v581" id="homeTodayListV581">
                <label class="home-today-item-v581"><input type="checkbox" data-today-task="daily"><span>Забрать ежедневные задания и бесплатные награды.</span></label>
                <label class="home-today-item-v581"><input type="checkbox" data-today-task="beacon"><span>Проверить Маяк и доступные задания.</span></label>
                <label class="home-today-item-v581"><input type="checkbox" data-today-task="arena"><span>Проверить Арену и доступные попытки.</span></label>
                <label class="home-today-item-v581"><input type="checkbox" data-today-task="events"><span>Посмотреть события дня до траты ускорений, ресурсов и предметов.</span></label>
                <label class="home-today-item-v581"><input type="checkbox" data-today-task="alliance"><span>Проверить задания и активности альянса.</span></label>
              </div>
            </div>
            <div class="home-today-links-v581">
              <div class="home-today-sub-v581"><span>Быстро открыть</span></div>
              <div class="home-today-links-grid-v581">
                <a class="home-today-link-v581" href="events.html"><span class="home-today-link-icon-v581">📅</span><span><strong>События</strong><small>Что идёт и как играть</small></span></a>
                <a class="home-today-link-v581" href="bear.html"><span class="home-today-link-icon-v581">🐻</span><span><strong>Медведь</strong><small>Если сегодня охота</small></span></a>
                <a class="home-today-link-v581" href="svs-prep.html"><span class="home-today-link-icon-v581">⚔️</span><span><strong>Подготовка к СВС</strong><small>Что копить и когда тратить</small></span></a>
                <a class="home-today-link-v581" href="other.html"><span class="home-today-link-icon-v581">📘</span><span><strong>База знаний</strong><small>Найти нужную шпаргалку</small></span></a>
              </div>
              <p class="home-today-note-v581">Галочки сохраняются только на этом устройстве и автоматически сбрасываются на следующий день.</p>
            </div>
          </div>
          </section>'''

          marker = '</section>\n<section class="modern-panel-v424 home-news-v442">'
          if 'class="home-today-v581"' not in s:
              if marker not in s:
                  raise SystemExit('Home insertion marker not found')
              s = s.replace(marker, '</section>\n' + block + '\n<section class="modern-panel-v424 home-news-v442">', 1)

          script = r'''<script id="home-today-v581-script">
          (function(){
            var box=document.getElementById('homeTodayListV581');
            if(!box)return;
            var now=new Date();
            var keyDate=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
            var storeKey='belaya-mgla-today-v581:'+keyDate;
            var dateEl=document.getElementById('homeTodayDateV581');
            try{dateEl.textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(now).replace(/^./,function(c){return c.toUpperCase();});}catch(e){}
            var saved={};
            try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')||{};}catch(e){}
            var checks=[].slice.call(box.querySelectorAll('input[data-today-task]'));
            checks.forEach(function(c){c.checked=!!saved[c.dataset.todayTask];});
            function update(){
              var state={},done=0;
              checks.forEach(function(c){state[c.dataset.todayTask]=c.checked;if(c.checked)done++;});
              try{localStorage.setItem(storeKey,JSON.stringify(state));}catch(e){}
              var p=document.getElementById('homeTodayProgressV581');if(p)p.textContent=done+' / '+checks.length;
            }
            checks.forEach(function(c){c.addEventListener('change',update);});
            update();
          })();
          </script>'''
          if 'home-today-v581-script' not in s:
              s = s.replace('</body>', script + '</body>', 1)

          page.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8')
              def bump(m): return "const CACHE_NAME = 'belaya-mgla-v%d';" % (int(m.group(1))+1)
              t2,n=re.subn(r"const CACHE_NAME = 'belaya-mgla-v(\d+)';", bump, t, count=1)
              if n: sw.write_text(t2,encoding='utf-8')

          Path('.github/workflows/add-today-dashboard-once.yml').unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Add daily Today dashboard to homepage'
          git push origin HEAD:main

name: Temporary Wu Ming build
on:
  push:
    paths:
      - '.github/workflows/tmp-wu-ming-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Wu Ming hero page
        run: |
          python -m pip install requests beautifulsoup4
          python tmp-wu-ming-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-wu-ming.html assets/heroes/gen-06/wu-ming sitemap.xml
          git commit -m "Add Wu Ming hero guide" || exit 0
          git pull --rebase origin main
          git push origin main

name: v482 prestige direct images
on:
  push:
    paths:
      - '.github/workflows/v482-prestige-direct.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Prestige images directly in HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # EVENTS CARD: use the approved second tile from the existing card sprite as a real <img>,
          # avoiding background-image rendering/cache issues.
          p=Path('events.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="guide-nav-card" href="mercenary-prestige.html">Престиж наёмника</a>'
          new='''<a aria-label="Престиж наёмника" class="guide-nav-card event-prestige-v482-direct" href="mercenary-prestige.html" title="Престиж наёмника" style="position:relative;min-height:0;aspect-ratio:2/1;padding:0;overflow:hidden;border-radius:14px;font-size:0;color:transparent"><img alt="" aria-hidden="true" src="assets/events-cards-sprite-v466.jpg?v=482" style="position:absolute;left:0;top:-100%;width:100%;height:700%;max-width:none;object-fit:fill;pointer-events:none"/><span aria-hidden="true" style="position:absolute;inset:9px;border:1px solid rgba(220,245,255,.55);border-radius:12px;pointer-events:none"></span></a>'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              # If a prior class was already added, normalize that anchor instead.
              import re
              s=re.sub(r'<a[^>]*href="mercenary-prestige\.html"[^>]*>.*?</a>',new,s,count=1)
          s=s.replace('site-v269.js?v=481','site-v269.js?v=482').replace('site-v269.js?v=480','site-v269.js?v=482').replace('site-v269.js?v=478','site-v269.js?v=482')
          p.write_text(s,encoding='utf-8')

          # LARGE PRESTIGE HEADER: same approved second tile from the header sprite,
          # rendered as a clipped <img> rather than a CSS background.
          p=Path('mercenary-prestige.html')
          s=p.read_text(encoding='utf-8')
          old='''<section class="page-heading-v424 frost-header-v431"><h1>Престиж наёмника</h1><p>«Престиж наёмника» - PvE-событие из двух частей: личной цепочки наёмников Фаэтона и совместных испытаний альянса против капитанов Фаэтона.</p></section>'''
          new='''<section class="page-heading-v424 frost-header-v431 event-prestige-v482-direct" style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px"><img alt="" aria-hidden="true" src="assets/events-headers-sprite-v466.jpg?v=482" style="position:absolute;left:0;top:-100%;width:100%;height:700%;max-width:none;object-fit:fill;pointer-events:none"/><span aria-hidden="true" style="position:absolute;inset:14px;border:1px solid rgba(220,245,255,.55);border-radius:14px;pointer-events:none"></span><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Престиж наёмника</h1><p style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">«Престиж наёмника» - PvE-событие из двух частей: личной цепочки наёмников Фаэтона и совместных испытаний альянса против капитанов Фаэтона.</p></section>'''
          if old in s:
              s=s.replace(old,new,1)
          else:
              import re
              s=re.sub(r'<section class="page-heading-v424 frost-header-v431(?: [^"]*)?">.*?</section>',new,s,count=1,flags=re.S)
          import re
          s=re.sub(r'site-v269\.js\?v=\d+','site-v269.js?v=482',s)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/v482-prestige-direct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v482: render Prestige card and header as direct images'
          git push

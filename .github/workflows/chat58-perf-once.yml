name: Optimize Chat 58 once
on:
  push:
    paths:
      - '.github/workflows/chat58-perf-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat performance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chat.html')
          s=p.read_text(encoding='utf-8')
          old="const ROOT=BASE.slice(0,-1)+'.json';"
          new="const ROOT=BASE.slice(0,-1)+'.json';\nconst CHAT_QUERY=ROOT+'?orderBy='+encodeURIComponent('\\\"$key\\\"')+'&startAt='+encodeURIComponent('\\\"__chat58\\\"')+'&endAt='+encodeURIComponent('\\\"__chat58\\uf8ff\\\"');"
          if old not in s:
              raise SystemExit('ROOT marker not found')
          s=s.replace(old,new,1)
          old_read="async function readRoot(){const r=await fetch(ROOT,{cache:'no-store'});if(!r.ok)throw new Error('read '+r.status);const v=await r.json();return v&&typeof v==='object'?v:{}}"
          new_read="async function readRoot(){const r=await fetch(CHAT_QUERY,{cache:'no-store'});if(!r.ok)throw new Error('read '+r.status);const v=await r.json();return v&&typeof v==='object'?v:{}}"
          if old_read not in s:
              raise SystemExit('readRoot marker not found')
          s=s.replace(old_read,new_read,1)
          style_marker='<style id="chat58-style-v1">'
          perf_css='''<style id="chat58-perf-v2">\nbody[data-static-route="chat"] .site-cosmic-background-v442{display:none!important}\nbody[data-static-route="chat"] *{animation:none!important}\n.chat58-row{content-visibility:auto;contain-intrinsic-size:58px}\n@media(max-width:720px){.chat58-head,.chat58-shell{box-shadow:none!important}}\n</style>'''
          if 'chat58-perf-v2' not in s:
              if style_marker not in s:
                  raise SystemExit('style marker not found')
              s=s.replace(style_marker,perf_css+'\n'+style_marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit optimized chat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize Chat 58 performance"
          git push

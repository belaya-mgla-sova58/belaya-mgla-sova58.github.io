el="Очистить поиск" class="site-search-clear-v426" type="button">×</button></div><div aria-label="Результаты поиска" class="site-search-results-v426" role="listbox"></div></div><div class="route-page active" data-route="heroes"><div class="epic-page"><div class="epic-crumbs"><a href="index.html">Главная</a> › <a href="heroes.html">Герои</a> › <a href="hero-generations.html">Поколения героев</a> › {h['name']}</div><section class="epic-hero"><div class="epic-portrait-wrap"><img class="epic-portrait" src="assets/heroes/rare/{h['slug']}/portrait.webp" alt="{h['name']}" loading="eager" decoding="async"/></div><div><div class="epic-kicker"><span class="epic-chip rarity">Редкий</span><span class="epic-chip">{h['type']}</span><span class="epic-chip">{h['role']}</span></div><h1>{h['name']}</h1><p class="epic-subtitle">Редкий герой · {h['type']} · {h['role']}</p><p class="epic-lead">{h['lead']}</p><div class="epic-quick"><div><b>Как получить</b><span>{h['obtain']}</span></div><div><b>Основная роль</b><span>{h['usage']}</span></div></div></div></section><nav class="epic-nav"><a href="#stats">Характеристики</a><a href="#skills">Навыки</a><a href="#usage">Применение</a><a href="#source">Источник</a></nav><section class="epic-section" id="stats"><h2>Характеристики</h2><p class="epic-section-lead">Базовые показатели героя из справочника.</p><div class="epic-stats"><div class="epic-stat"><strong>{s[0]}</strong><span>Атака · Исследование</span></div><div class="epic-stat"><strong>{s[1]}</strong><span>Защита · Исследование</span></div><div class="epic-stat"><strong>{s[2]}</strong><span>Здоровье · Исследование</span></div><div class="epic-stat"><strong>{s[3]}</strong><span>Атака · Экспедиция</span></div><div class="epic-stat"><strong>{s[4]}</strong><span>Защита · Экспедиция</span></div></div></section><section class="epic-section" id="skills"><h2>Навыки</h2><p class="epic-section-lead">Ключевые эффекты навыков и их развитие по уровням.</p><div class="epic-skill-grid">{skills}</div></section><section class="epic-section" id="usage"><h2>Применение</h2><div class="epic-box"><h3>Где полезен герой</h3><p>{h['usage']}</p></div></section><section class="epic-section" id="source"><h2>Источник</h2><div class="epic-box"><h3>Справочник героя</h3><p>Характеристики и значения навыков сверены с указанным источником.</p><a class="epic-source-link" href="{h['source']}" target="_blank" rel="noopener noreferrer">Открыть источник ↗</a></div></section><a class="epic-back" href="hero-generations.html">← К поколениям, эпическим и редким героям</a><div class="epic-foot">Белая мгла · SOVA58</div></div></div></main></body></html>'''


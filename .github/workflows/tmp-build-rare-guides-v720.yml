"]{--portrait:url("assets/heroes/rare/smith/portrait.webp")}\n.hero-mini[data-rare="cloris"]{--portrait:url("assets/heroes/rare/cloris/portrait.webp")}\n.hero-mini[data-rare="eugene"]{--portrait:url("assets/heroes/rare/eugene/portrait.webp")}\n.hero-mini[data-rare="charlie"]{--portrait:url("assets/heroes/rare/charlie/portrait.webp")}\n'''

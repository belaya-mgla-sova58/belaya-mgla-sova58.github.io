name: Temporary organize heroes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-organize-heroes.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build generations catalog
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4
          python tmp-organize-heroes.py
          git add heroes.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Organize heroes by generations 1 through 12'
          git pull --rebase --autostash origin main
          git push

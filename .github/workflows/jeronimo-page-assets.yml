name: Jeronimo page assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jeronimo-page-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original hero images
        shell: bash
        run: |
          set -euo pipefail
          dir='assets/heroes/gen-01/jeronimo'
          mkdir -p "$dir"
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          declare -A files=(
            [portrait.webp]='Jeronimo.webp'
            [skill-combo-slash.webp]='Combo-Slash.webp'
            [skill-sword-art.webp]='Sword-Art.webp'
            [skill-lone-wolf.webp]='Lone-Wolf.webp'
            [skill-battle-manifesto.webp]='Battle-Manifesto.webp'
            [skill-swordmentor.webp]='Swordmentor.webp'
            [skill-expert-swordsmanship.webp]='Expert-Swordsmanship.webp'
            [talent-natural-leader.webp]='Natural-Leader.webp'
            [gear-dawnbreak.webp]='Dawnbreak.webp'
            [gear-shield-of-swords.webp]='Shield-of-Swords.webp'
            [gear-discernment.webp]='Discernment.webp'
          )
          for out in "${!files[@]}"; do
            src="${files[$out]}"
            echo "Downloading $src"
            curl -L --fail --retry 4 --retry-delay 2 \
              -A 'Mozilla/5.0 (compatible; SOVA58-site/1.0)' \
              -e 'https://whiteout-survival.com/ru/heroes/jeronimo/' \
              "$base/$src" -o "$dir/$out"
            test -s "$dir/$out"
          done
          file "$dir"/*.webp

      - name: Validate downloaded images
        shell: python
        run: |
          from pathlib import Path
          root=Path('assets/heroes/gen-01/jeronimo')
          expected={
            'portrait.webp','skill-combo-slash.webp','skill-sword-art.webp','skill-lone-wolf.webp',
            'skill-battle-manifesto.webp','skill-swordmentor.webp','skill-expert-swordsmanship.webp',
            'talent-natural-leader.webp','gear-dawnbreak.webp','gear-shield-of-swords.webp','gear-discernment.webp'
          }
          found={p.name for p in root.glob('*.webp')}
          missing=expected-found
          if missing:
              raise SystemExit(f'Missing files: {sorted(missing)}')
          for p in root.glob('*.webp'):
              data=p.read_bytes()
              if len(data)<500 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP: {p} size={len(data)}')
              print(p, len(data))

      - name: Link guide from Heroes and update sitemap
        shell: python
        run: |
          from pathlib import Path
          import json,re
          p=Path('heroes.html')
          s=p.read_text(encoding='utf-8')
          if 'hero-jeronimo.html' not in s:
              pos=s.find('id="section-6"')
              if pos < 0:
                  raise SystemExit('section-6 not found')
              end=s.find('</details>',pos)
              if end < 0:
                  raise SystemExit('section-6 closing details not found')
              close=s.rfind('</div>',pos,end)
              if close < 0:
                  raise SystemExit('section-6 body close not found')
              card='''<div class="guide-callout tip hero-detail-link-v627"><b>1 поколение · Джеронимо</b><p>Навыки, талант, эксклюзивное снаряжение «Рассвет», приоритет прокачки, плюсы и минусы.</p><a href="hero-jeronimo.html">Открыть подробный гайд по Джеронимо →</a></div>'''
              s=s[:close]+card+s[close:]
          m=re.search(r'(<script id="guide-article-schema-v625" type="application/ld\+json">)(.*?)(</script>)',s,re.S)
          if m:
              data=json.loads(m.group(2)); data['dateModified']='2026-10-23'
              block=m.group(1)+json.dumps(data,ensure_ascii=False,separators=(',',':'))+m.group(3)
              s=s[:m.start()]+block+s[m.end():]
          p.write_text(s,encoding='utf-8')

          sm=Path('sitemap.xml')
          x=sm.read_text(encoding='utf-8')
          hero='https://belaya-mgla-sova58.github.io/hero-jeronimo.html'
          x=re.sub(r'(<url><loc>https://belaya-mgla-sova58.github.io/heroes.html</loc><lastmod>)[^<]+(</lastmod></url>)',r'\g<1>2026-10-23\g<2>',x)
          if hero in x:
              x=re.sub(r'(<url><loc>'+re.escape(hero)+r'</loc><lastmod>)[^<]+(</lastmod></url>)',r'\g<1>2026-10-23\g<2>',x)
          else:
              x=x.replace('</urlset>',f'  <url><loc>{hero}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
          sm.write_text(x,encoding='utf-8')

      - name: Commit assets and navigation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/heroes/gen-01/jeronimo heroes.html sitemap.xml
          git commit -m 'Add Jeronimo images and detailed hero link' || exit 0
          git push

name: Clean owl sticker source images once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/clean-owl-stickers-once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Clean and reduce all owl PNGs
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import numpy as np

          root = Path('assets/chat-stickers/owls')
          files = sorted(root.glob('owl-*.png'))
          if len(files) != 30:
              raise SystemExit(f'Expected 30 owl PNGs, found {len(files)}')

          # The original owl pack came from rows of adjacent stickers.
          # Remove only the sides that had neighbours in the source row.
          row_ends = {
              1: (False, True), 2: (True, True), 3: (True, True), 4: (True, True), 5: (True, False),
              6: (False, True), 7: (True, True), 8: (True, True), 9: (True, True), 10: (True, False),
              11: (False, True), 12: (True, True), 13: (True, True), 14: (True, True), 15: (True, False),
              16: (False, True), 17: (True, True), 18: (True, True), 19: (True, True), 20: (True, False),
              21: (False, True), 22: (True, True), 23: (True, True), 24: (True, False),
              25: (False, True), 26: (True, True), 27: (True, True), 28: (True, True), 29: (True, True), 30: (True, False),
          }

          for idx, path in enumerate(files, 1):
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              arr = np.array(im)
              alpha = arr[:, :, 3].astype(np.float32)

              cut = max(10, round(w * 0.09))
              feather = max(3, round(w * 0.025))
              trim_left, trim_right = row_ends[idx]

              if trim_left:
                  alpha[:, :cut] = 0
                  for i in range(feather):
                      x = cut + i
                      if x < w:
                          alpha[:, x] *= (i + 1) / feather

              if trim_right:
                  alpha[:, w-cut:] = 0
                  for i in range(feather):
                      x = w - cut - 1 - i
                      if x >= 0:
                          alpha[:, x] *= (i + 1) / feather

              arr[:, :, 3] = alpha.astype(np.uint8)
              cleaned = Image.fromarray(arr, 'RGBA')

              # Reduce the artwork itself so the clean sticker has breathing room.
              scale = 0.88
              nw = max(1, round(w * scale))
              nh = max(1, round(h * scale))
              small = cleaned.resize((nw, nh), Image.Resampling.LANCZOS)
              out = Image.new('RGBA', (w, h), (0, 0, 0, 0))
              out.alpha_composite(small, ((w - nw) // 2, (h - nh) // 2))
              out.save(path, optimize=True)

          print('Cleaned:', len(files), 'owl stickers')

      - name: Refresh PWA cache
        shell: python
        run: |
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("belaya-mgla-v576", "belaya-mgla-v577")
          s = s.replace("belaya-mgla-v575", "belaya-mgla-v577")
          p.write_text(s, encoding='utf-8')

      - name: Verify PNGs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/chat-stickers/owls -maxdepth 1 -type f -name 'owl-*.png' | wc -l)" -eq 30

      - name: Commit cleaned files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/clean-owl-stickers-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chat-stickers/owls service-worker.js .github/workflows/clean-owl-stickers-once.yml
          git commit -m 'Clean and reduce owl sticker PNGs'
          git push origin main

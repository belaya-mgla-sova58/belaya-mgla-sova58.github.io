name: "QA smoke: 20 pages, desktop + Android"
on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa-smoke-20261122.cjs'
      - '.github/workflows/qa-smoke-20261122.yml'
      - 'index.html'
      - 'svs-kopilka-test.html'
      - 'owl-dismiss-v1097.js'
      - 'home-desktop-v966.js'
      - 'sova-home-support-20261121.js'
      - 'news.html'
      - 'events.html'
      - 'heroes.html'
      - 'gear.html'
      - 'experts.html'
      - 'pets.html'
      - 'calculators.html'
      - 'other.html'
      - 'state-58.html'
      - 'svs-prep.html'
      - 'skhvatka.html'
      - 'bear-helper.html'
      - 'furnace-calculator.html'
      - 'fire-furnace-calculator.html'
      - 'chief-gear-calculator.html'
      - 'chief-gear-core-v1222.js'
      - 'site-core-v625.min.js'
      - 'site-author-v625.min.js'
      - 'site-v629.min.js'
      - 'analytics-metrika-v1.js'
      - 'essence-mithril-calculator.html'
      - 'ogonek.html'
      - 'news-elena.html'
  workflow_dispatch:
concurrency:
  group: qa-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current production files
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Test published portal read-only
        run: node scripts/qa-smoke-20261122.cjs
      - name: Attach compact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-report
          path: qa-smoke-output/
          retention-days: 14
          if-no-files-found: warn

name: Portal quality audit (without calculators)
on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'scripts/qa-portal-noncalculators.cjs'
      - '.github/workflows/portal-quality.yml'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap-owl.xml'
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  portal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit live portal excluding calculators
        run: node scripts/qa-portal-noncalculators.cjs
      - name: Save audit report and failed-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-quality-report
          path: qa-portal-output/
          if-no-files-found: warn
          retention-days: 14

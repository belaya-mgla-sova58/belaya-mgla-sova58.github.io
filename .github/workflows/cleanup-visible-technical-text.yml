name: Clean visible technical text
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-visible-technical-text.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove editorial and technical leftovers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'buildings-after-fire.html': [
              ('Точные названия поздних войск проверим отдельно на странице «Войска» по русской версии игры. На этой странице английские названия не используем.', 'Поздние виды войск собраны на отдельной странице «Войска».'),
              ('Названия отдельных развлекательных зданий добавляем только после подтверждения непосредственно в русской версии игры.', ''),
            ],
            'experts.html': [
              ('Проверяем нового эксперта непосредственно в русской версии игры.', ''),
            ],
            'governor.html': [
              ('добавляем только после подтверждения непосредственно в русской версии игры.', ''),
            ],
            'pets.html': [
              ('на сайте они остаются в разделе «Будущие», пока фактически не появятся в 58 государстве. После открытия каждого питомца проверяем его непосредственно в русской версии игры и только тогда переносим в основной список.', 'Питомцы, которые ещё не открылись в 58 государстве, находятся в разделе «Будущие».'),
            ],
            'labyrinth.html': [
              ('Старая версия сайта предлагала одну базовую схему', 'Одна базовая схема покупок не подходит всем поколениям'),
            ],
            'fire-furnace-calculator.html': [
              ('Данные для Этапов 1–5 повторно сверены по Whiteout Survival Data и Whiteout Survival Wiki.', 'Данные для Этапов 1–5 повторно сверены по WhiteoutData и WOS Wiki.'),
            ],
            'furnace-calculator.html': [
              ('Требования и базовые стоимости уровней 20–30 сверены по нескольким справочникам Whiteout Survival.', 'Требования и базовые стоимости уровней 20–30 сверены по нескольким игровым справочникам.'),
            ],
            'ginas-revenge.html': [
              ('Механика и числа перепроверены по Whiteout Survival Wiki:', 'Механика и числа перепроверены по WOS Wiki:'),
            ],
            'news-eu.html': [
              ('Обновления и изменения EU-версии Whiteout Survival.', 'Обновления и изменения EU-версии «Белой мглы».'),
              ('Whiteout Survival Wiki — September Developer Feedback', 'WOS Wiki — September Developer Feedback'),
            ],
            'news-ru.html': [
              ('Обновления и изменения RU-версии Whiteout Survival.', 'Обновления и изменения RU-версии «Белой мглы».'),
            ],
            'news-update-2026-10-19.html': [
              ('Whiteout Survival', 'Белая мгла'),
              ('(рабочий перевод: «Сундук чести династии»)', '«Сундук чести династии»'),
              ('Пример прежней временной механики Popularity. Новый постоянный интерфейс после обновления может отличаться.', 'Пример прежней механики популярности. После обновления интерфейс может выглядеть иначе.'),
            ],
          }

          changed=[]
          for name, reps in replacements.items():
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              old=s
              for a,b in reps:
                  s=s.replace(a,b)
              if s != old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(name)
          print('Changed:', ', '.join(changed))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.html
          git diff --cached --quiet || git commit -m 'Remove visible technical and editorial text'
          git push

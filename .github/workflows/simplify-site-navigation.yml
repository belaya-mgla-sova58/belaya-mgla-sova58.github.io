name: Finalize simplified navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-site-navigation.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix knowledge base active menu state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('other.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<a aria-current="page" class="route-link active route-link-calculator" href="other.html#kb-calculators">','<a class="route-link route-link-calculator" href="other.html#kb-calculators">',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/simplify-site-navigation.yml
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Finalize simplified navigation'
          git push

name: Event schedule colors v613
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/event-schedule-colors-v613.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add distinct schedule colors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('events.html')
          s=p.read_text(encoding='utf-8')
          marker='event-schedule-colors-v613'
          if marker not in s:
              css='''<style id="event-schedule-colors-v613">
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+1){border-left:3px solid #f3c247}
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+10){border-left:3px solid #3fcf79}
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+19){border-left:3px solid #f06a3f}
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+28){border-left:3px solid #43d6e8}
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+37){border-left:3px solid #4c7df3}
body.is-events-route .event-week-v608 > .event-row-name-v608:nth-of-type(9n+46){border-left:3px solid #ad5cff}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+10):nth-child(-n+12){background:linear-gradient(145deg,#f6cd4f,#d89423)!important;box-shadow:0 0 10px rgba(246,205,79,.18)}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+18):nth-child(-n+20){background:linear-gradient(145deg,#49d98a,#259b5c)!important;box-shadow:0 0 10px rgba(73,217,138,.16)}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+26):nth-child(-n+29){background:linear-gradient(145deg,#ff874c,#c9493d)!important;box-shadow:0 0 10px rgba(255,135,76,.16)}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+35):nth-child(-n+37){background:linear-gradient(145deg,#52dff0,#278ebd)!important;box-shadow:0 0 10px rgba(82,223,240,.17)}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+42):nth-child(-n+47){background:linear-gradient(145deg,#5d91ff,#3655c7)!important;box-shadow:0 0 10px rgba(93,145,255,.16)}
body.is-events-route .event-week-v608 > .event-cell-v608.on:nth-child(n+50):nth-child(-n+56){background:linear-gradient(145deg,#bd6cff,#7939d4)!important;box-shadow:0 0 10px rgba(189,108,255,.17)}
body.is-events-route .event-soon-chip-v608:nth-child(1){border-color:rgba(246,205,79,.55);background:rgba(246,205,79,.13);color:#ffe28a}
body.is-events-route .event-soon-chip-v608:nth-child(2){border-color:rgba(73,217,138,.52);background:rgba(73,217,138,.12);color:#9af1bd}
body.is-events-route .event-soon-chip-v608:nth-child(3){border-color:rgba(82,223,240,.52);background:rgba(82,223,240,.12);color:#9deef8}
body.is-events-route .event-soon-chip-v608:nth-child(4){border-color:rgba(255,135,76,.52);background:rgba(255,135,76,.12);color:#ffb18a}
body.is-events-route .event-soon-chip-v608:nth-child(5){border-color:rgba(93,145,255,.52);background:rgba(93,145,255,.12);color:#a9c5ff}
</style>'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit colors
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git diff --cached --quiet || git commit -m 'Use distinct colors for event schedule'
          git push

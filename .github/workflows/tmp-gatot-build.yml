name: Temporary Gatot build
on:
  push:
    paths:
      - '.github/workflows/tmp-gatot-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Gatot hero page
        run: |
          python -m pip install requests beautifulsoup4
          python tmp-gatot-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-gatot.html assets/heroes/gen-08/gatot sitemap.xml
          git commit -m "Add Gatot hero guide"
          git pull --rebase origin main
          git push origin main

name: Temporary Gatot build
on:
  push:
    paths:
      - '.github/workflows/tmp-gatot-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Gatot hero page
        run: |
          python -m pip install requests beautifulsoup4
          mkdir -p assets/heroes/gen-08/gatot
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_golden_guard.webp -o assets/heroes/gen-08/gatot/skill-golden-guard.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_king_s_bestowal.webp -o assets/heroes/gen-08/gatot/skill-kings-bestowal.webp
          curl -fL https://wos.h5joy-games.com/games/icon_hero_skill_royal_legion.webp -o assets/heroes/gen-08/gatot/skill-royal-legion.webp
          sed -i "/pick('skill-golden-guard.webp'/d; /pick('skill-kings-bestowal.webp'/d; /pick('skill-royal-legion.webp'/d" tmp-gatot-build.py
          python tmp-gatot-build.py
          git checkout -- tmp-gatot-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-gatot.html assets/heroes/gen-08/gatot sitemap.xml
          git commit -m "Add Gatot hero guide"
          git pull --rebase origin main
          git push origin main

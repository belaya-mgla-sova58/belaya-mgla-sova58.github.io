name: Temporary Natalia metadata fix

on:
  push:
    paths:
      - '.github/workflows/tmp-natalia-page.yml'

permissions:
  contents: write

jobs:
  fix-natalia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Natalia metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('hero-natalia.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Подробный гайд по Молли: навыки Освоения и Экспедиции, Дух Йети, получение, плюсы и минусы.','Подробный гайд по Наталье: навыки Освоения и Экспедиции, талант, Ураганная сила, получение, плюсы и минусы.')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-natalia.html
          git commit -m 'Fix Natalia page metadata'
          git pull --rebase origin main
          git push
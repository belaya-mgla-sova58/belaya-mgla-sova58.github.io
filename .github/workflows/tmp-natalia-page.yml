name: Temporary Natalia page builder

on:
  push:
    paths:
      - '.github/workflows/tmp-natalia-page.yml'

permissions:
  contents: write

jobs:
  build-natalia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Natalia game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/heroes/gen-01/natalia
          base='https://whiteout-survival.com/wp-content/uploads/2025/07'
          declare -A files=(
            [portrait.webp]='Natalia.webp'
            [skill-beast-charge.webp]='Beast-Charge.webp'
            [skill-whip.webp]='Whip.webp'
            [skill-rage-response.webp]='Rage-Response.webp'
            [skill-feral-protection.webp]='Wildling-Roar.webp'
            [skill-queen-of-the-wild.webp]='Queen-of-the-Wild.webp'
            [skill-call-of-the-wild.webp]='Call-of-the-Wild.webp'
            [talent-ursus-strength.webp]='Ursus-Strength.webp'
            [gear-gale-force.webp]='Gale-Force.webp'
            [gear-unity.webp]='Unity.webp'
            [gear-invincibles.webp]='Invincibles.webp'
          )
          for out in "${!files[@]}"; do
            curl -fL --retry 3 "$base/${files[$out]}" -o "assets/heroes/gen-01/natalia/$out"
          done
          file assets/heroes/gen-01/natalia/*.webp
      - name: Create Natalia page from Molly template
        shell: bash
        run: |
          set -euo pipefail
          cp hero-molly.html hero-natalia.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('hero-natalia.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Молли: навыки, Дух Йети, плюсы и минусы | Белая мгла','Наталья: навыки, Ураганная сила, плюсы и минусы | Белая мгла')
          s=s.replace('Подробный гайд по Молли: навыки Освоения и Экспедиции, Дух Йети, получение, приоритет прокачки, плюсы, минусы и применение.','Подробный гайд по Наталье: навыки Освоения и Экспедиции, талант, Ураганная сила, получение, приоритет прокачки, плюсы, минусы и применение.')
          s=s.replace('hero-molly.html','hero-natalia.html')
          s=s.replace('Молли: полный гайд','Наталья: полный гайд')
          s=s.replace('Навыки, Дух Йети, плюсы и минусы Молли.','Навыки, талант, Ураганная сила, плюсы и минусы Натальи.')
          s=s.replace('assets/heroes/gen-01/molly/portrait.webp','assets/heroes/gen-01/natalia/portrait.webp')
          s=s.replace('Молли</span>','Наталья</span>')
          s=s.replace('<small>Молли</small>','<small>Наталья</small>')
          s=s.replace('Молли: навыки, Дух Йети, получение, плюсы и минусы.','Наталья: навыки, талант, Ураганная сила, получение, плюсы и минусы.')
          s=s.replace('"description":"Подробный гайд по Молли: навыки, Дух Йети, получение, плюсы и минусы."','"description":"Подробный гайд по Наталье: навыки, талант, Ураганная сила, получение, плюсы и минусы."')
          s=s.replace('"name":"Молли"','"name":"Наталья"')
          start=s.index('<main id="appMain">')
          end=s.index('</main>', start)+7
          main='''<main id="appMain"><div class="site-search-v426" data-site-search=""><div class="site-search-box-v426"><span aria-hidden="true" class="site-search-icon-v426">⌕</span><input aria-expanded="false" aria-label="Поиск по сайту" autocomplete="off" class="site-search-input-v426" inputmode="search" placeholder="Поиск по сайту..." spellcheck="false" type="search"/><button aria-label="Очистить поиск" class="site-search-clear-v426" type="button">×</button></div><div aria-label="Результаты поиска" class="site-search-results-v426" role="listbox"></div></div><div class="route-page active" data-route="heroes"><div class="jero-page">
<nav aria-label="Хлебные крошки" class="jero-crumbs"><a href="index.html">Главная</a> › <a href="heroes.html">Герои</a> › <span>Наталья</span></nav>
<section class="jero-hero" id="top"><div class="jero-portrait-wrap"><img class="jero-portrait" src="assets/heroes/gen-01/natalia/portrait.webp" alt="Наталья" fetchpriority="high"/></div><div><div class="jero-kicker"><span class="jero-chip">1 поколение</span><span class="jero-chip">Пехота</span><span class="jero-chip gold">Мифический</span><span class="jero-chip">Бой</span></div><h1>Наталья</h1><div class="jero-subtitle">Передняя линия · контроль · усиление рейдов на зверей</div><p class="jero-lead">Наталья — мифический пехотный герой первого поколения. Она хорошо держит переднюю линию, контролирует врагов в Освоении и особенно полезна в рейдах на зверей благодаря отдельному бонусу урона.</p><div class="jero-quick"><div><b>Основное получение</b><span>Открывается после первой внутриигровой покупки. Дальнейшие осколки в основном идут из VIP-наборов и ограниченных ранних источников.</span></div><div><b>Главная специализация</b><span>Пехота, Арена, Освоение и руководство рейдами на зверей.</span></div><div><b>Для кого</b><span>В первую очередь для игроков с небольшим или средним донатом. Для полностью бесплатной игры прокачка ограничена.</span></div><div><b>Актуальность</b><span>Сильна в ранних поколениях и долго сохраняет нишу на Свирепом медведе, но в обычном PvP со временем уступает новой пехоте.</span></div></div></div></section>
<nav class="jero-nav" aria-label="Содержание"><a href="#stats">Характеристики</a><a href="#exploration">Освоение</a><a href="#expedition">Экспедиция</a><a href="#talent">Талант</a><a href="#gear">Ураганная сила</a><a href="#priority">Прокачка</a><a href="#modes">Где использовать</a><a href="#pros">Плюсы и минусы</a></nav>
<section class="jero-section" id="stats"><h2>Характеристики</h2><p class="jero-section-lead">Максимальные базовые показатели Натальи.</p><div class="jero-stats"><div class="jero-stat"><strong>1 873</strong><span>Атака героя</span></div><div class="jero-stat"><strong>2 220</strong><span>Защита героя</span></div><div class="jero-stat"><strong>36 630</strong><span>Здоровье героя</span></div><div class="jero-stat"><strong>200,16%</strong><span>Атака пехоты</span></div><div class="jero-stat"><strong>200,16%</strong><span>Защита пехоты</span></div></div></section>
<section class="jero-section" id="exploration"><h2>Навыки Освоения</h2><p class="jero-section-lead">Работают в Освоении и на Арене.</p><div class="jero-skill-grid"><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-beast-charge.webp" alt="Звериный рывок"/><div><h3>Звериный рывок</h3><small>Урон по площади + отбрасывание + оглушение</small></div></div><p>Медведь Натальи бьёт по земле, отбрасывает врагов в радиусе действия и оглушает их на 1 секунду.</p><p class="jero-values">Уровни 1–5: 160% / 176% / 192% / 208% / 224% от атаки.</p></article><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-whip.webp" alt="Кнут"/><div><h3>Кнут</h3><small>Сильный одиночный удар</small></div></div><p>Наталья атакует цель кнутом и наносит высокий разовый урон.</p><p class="jero-values">Уровни 1–5: 150% / 165% / 180% / 195% / 210% от атаки.</p></article><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-rage-response.webp" alt="Ответ ярости"/><div><h3>Ответ ярости</h3><small>Суммируемое усиление атаки</small></div></div><p>При получении урона Наталья имеет 10% шанс повысить атаку на 3 секунды. Эффект складывается до 5 раз.</p><p class="jero-values">Уровни 1–5: +4% / +6% / +8% / +10% / +12% за заряд.</p></article></div></section>
<section class="jero-section" id="expedition"><h2>Навыки Экспедиции</h2><p class="jero-section-lead">Работают в PvP, походах, рейдах и боях с войсками.</p><div class="jero-skill-grid"><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-feral-protection.webp" alt="Дикая защита"/><div><h3>Дикая защита</h3><small>Актуальная механика 2026</small></div></div><p>Даёт 40% шанс снизить получаемый всеми войсками урон.</p><p class="jero-values">Уровни 1–5: −10% / −20% / −30% / −40% / −50% получаемого урона.</p></article><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-queen-of-the-wild.webp" alt="Королева дикой природы"/><div><h3>Королева дикой природы</h3><small>Постоянное усиление атаки</small></div></div><p>Повышает атаку всех войск без дополнительного условия.</p><p class="jero-values">Уровни 1–5: +5% / +10% / +15% / +20% / +25%.</p></article><article class="jero-skill"><div class="jero-skill-head"><img src="assets/heroes/gen-01/natalia/skill-call-of-the-wild.webp" alt="Зов дикой природы"/><div><h3>Зов дикой природы</h3><small>Урон в рейдах на зверей</small></div></div><p>Увеличивает наносимый всеми войсками урон во время рейдов на зверей.</p><p class="jero-values">Уровни 1–5: +5% / +10% / +15% / +20% / +25%.</p></article></div><div class="jero-note"><strong>Важно:</strong> старые гайды показывают первый навык Экспедиции как «Рёв одичалых» с шансом оглушения на 1 ход. После переработки 2026 используется защитная механика: 40% шанс снизить получаемый всеми войсками урон до 50%.</div></section>
<section class="jero-section" id="talent"><h2>Талант</h2><div class="jero-gear-layout"><img class="jero-gear-img" src="assets/heroes/gen-01/natalia/talent-ursus-strength.webp" alt="Сила Урсуса"/><div><h3 class="jero-gear-title">Сила Урсуса</h3><p class="jero-section-lead">Пассивный талант Натальи усиливает весь аккаунт даже тогда, когда она не находится в марше.</p><div class="jero-stats"><div class="jero-stat"><strong>+2%</strong><span>1 звезда</span></div><div class="jero-stat"><strong>+4%</strong><span>2 звезды</span></div><div class="jero-stat"><strong>+6%</strong><span>3 звезды</span></div><div class="jero-stat"><strong>+8%</strong><span>4 звезды</span></div><div class="jero-stat"><strong>+10%</strong><span>5 звёзд</span></div></div><div class="jero-note"><strong>Эффект:</strong> одновременно повышает атаку и защиту всех войск. Бонус работает даже без Натальи в марше, но не передаётся при присоединении к чужому рейду.</div></div></div></section>
<section class="jero-section" id="gear"><h2>Эксклюзивное снаряжение</h2><div class="jero-gear-layout"><img class="jero-gear-img" src="assets/heroes/gen-01/natalia/gear-gale-force.webp" alt="Ураганная сила"/><div><h3 class="jero-gear-title">Ураганная сила</h3><p class="jero-section-lead">Эксклюзивное снаряжение Натальи усиливает её личный урон и рейды, которыми она руководит.</p><div class="jero-stats"><div class="jero-stat"><strong>+379</strong><span>Атака</span></div><div class="jero-stat"><strong>+495</strong><span>Защита</span></div><div class="jero-stat"><strong>+7 425</strong><span>Здоровье</span></div><div class="jero-stat"><strong>+55,5%</strong><span>Смертоносность пехоты</span></div><div class="jero-stat"><strong>+55,5%</strong><span>Здоровье пехоты</span></div></div><div class="jero-gear-skills"><div class="jero-gear-skill"><img src="assets/heroes/gen-01/natalia/gear-unity.webp" alt="Единство"/><div><b>Единство</b><span>Повышает наносимый Натальей урон. На максимальном уровне: +30%.</span></div></div><div class="jero-gear-skill"><img src="assets/heroes/gen-01/natalia/gear-invincibles.webp" alt="Непобедимые"/><div><b>Непобедимые</b><span>Повышает смертоносность войск в рейде, который ведёт Наталья. На максимальном уровне: +15%.</span></div></div></div></div></div></section>
<section class="jero-section" id="priority"><h2>Что прокачивать в первую очередь</h2><div class="jero-two"><div class="jero-box"><h3>Для Арены и Освоения</h3><p><span class="jero-rank">1</span><b>Звериный рывок</b> — главный урон по площади и контроль.</p><p><span class="jero-rank">2</span><b>Кнут</b> — сильный дополнительный урон.</p><p><span class="jero-rank">3</span><b>Ответ ярости</b> — полезен в затяжных боях, но зависит от шанса.</p></div><div class="jero-box"><h3>Для походов и рейдов</h3><p><span class="jero-rank">1</span><b>Дикая защита</b> — сильнейший защитный эффект.</p><p><span class="jero-rank">2</span><b>Королева дикой природы</b> — стабильные +25% атаки всех войск.</p><p><span class="jero-rank">3</span><b>Зов дикой природы</b> — обязательно развивать, если Наталья ведёт рейды на Свирепого медведя.</p></div></div></section>
<section class="jero-section" id="modes"><h2>Где использовать Наталью</h2><div class="jero-mode-grid"><div class="jero-mode"><b>🐻 Свирепый медведь</b><p>Одна из главных ниш Натальи. «Зов дикой природы» повышает урон по зверям, а эксклюзивное снаряжение усиливает смертоносность войск рейда.</p></div><div class="jero-mode"><b>🏟 Арена</b><p>Сильна в ранней игре как передний герой: отбрасывание и оглушение помогают ломать построение соперника.</p></div><div class="jero-mode"><b>🧭 Освоение</b><p>Хороший танк первой линии с контролем и большим запасом здоровья.</p></div><div class="jero-mode"><b>⚔️ PvP</b><p>Уверенно работает в первом поколении. Позже новые пехотные герои дают заметно более высокие характеристики.</p></div></div></section>
<section class="jero-section" id="pros"><h2>Плюсы и минусы</h2><div class="jero-two"><div class="jero-box good"><h3>✅ Плюсы</h3><ul><li>сильная пехота первого поколения;</li><li>хорошая выживаемость и контроль в Арене;</li><li>постоянные +25% к атаке всех войск;</li><li>отдельный бонус урона в рейдах на зверей;</li><li>талант усиливает атаку и защиту всего аккаунта даже без Натальи в марше;</li><li>эксклюзивное снаряжение полезно лидеру рейда;</li><li>долго сохраняет нишу на Свирепом медведе.</li></ul></div><div class="jero-box bad"><h3>❌ Минусы</h3><ul><li>нельзя полноценно развить без доната;</li><li>универсальные мифические осколки на неё не используются;</li><li>после первого поколения доступ к осколкам становится хуже;</li><li>в позднем PvP уступает более новым героям пехоты;</li><li>часть сильных эффектов раскрывается именно при руководстве рейдом;</li><li>для полностью бесплатного игрока инвестиция практически закрыта.</li></ul></div></div></section>
<section class="jero-section"><div class="jero-verdict"><h3>Стоит ли развивать?</h3><p><b>Да, если вы уже тратите на игру и регулярно ведёте рейды.</b> Наталья даёт хороший результат в первом поколении, усиливает весь аккаунт талантом и долго остаётся полезной на Свирепом медведе. Но специально вкладываться в неё как в долгосрочного PvP-героя не стоит: новые поколения пехоты постепенно вытесняют её из основного состава.</p></div></section>
<section class="jero-section" id="sources"><h2>Источники и проверка</h2><p class="jero-section-lead">Изображения взяты отдельными игровыми файлами. Механика и рекомендации сверены по нескольким источникам, включая базы с обновлениями 2026 года.</p><div class="jero-sources"><a href="https://whiteout-survival.com/ru/heroes/natalia/" target="_blank" rel="noopener">Игровые изображения, базовые характеристики и старая версия описаний</a><a href="https://www.whiteoutsurvival-community.com/tools/wiki/heroes/natalia.html" target="_blank" rel="noopener">Актуальная база героя, обновлена 1 октября 2026</a><a href="https://wosguru.com/hero/natalia" target="_blank" rel="noopener">Свежая сверка ролей, навыков и эксклюзивного снаряжения</a><a href="https://whiteoutsurvivalhandbook.com/guides/whiteoutsurvival-natalia-guide-2026" target="_blank" rel="noopener">Проверка переработанного первого навыка Экспедиции и таланта</a><a href="https://theriagames.com/ru/guide/whiteout-survival-natalia-guide/" target="_blank" rel="noopener">Дополнительная русскоязычная сверка названий и старой механики</a></div><div class="jero-note"><strong>Проверено 23 октября 2026.</strong> При расхождении старых гайдов приоритет отдаётся актуальному игровому описанию и свежим базам.</div><a class="jero-back" href="heroes.html">← Вернуться к разделу «Герои»</a></section>
<div class="jero-foot">Белая мгла · гайды SOVA58 · независимый неофициальный игровой сайт</div></div></div></main>'''
          s=s[:start]+main+s[end:]
          p.write_text(s,encoding='utf-8')
          sm=Path('sitemap.xml')
          x=sm.read_text(encoding='utf-8')
          for page in ['hero-molly.html','hero-natalia.html']:
            loc=f'https://belaya-mgla-sova58.github.io/{page}'
            if loc not in x:
              x=x.replace('</urlset>',f'  <url><loc>{loc}</loc><lastmod>2026-10-23</lastmod></url>\n</urlset>')
          sm.write_text(x,encoding='utf-8')
          PY
      - name: Commit Natalia page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-natalia.html sitemap.xml assets/heroes/gen-01/natalia
          git commit -m 'Add detailed Natalia hero page'
          git push
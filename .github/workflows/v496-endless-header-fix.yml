name: Restore Endless Trial frame v496

on:
  push:
    paths:
      - '.github/workflows/v496-endless-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full banner and lift block slightly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('endless-trial.html')
          s = p.read_text(encoding='utf-8')
          old_section = 'style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px;border:0;box-shadow:none"'
          new_section = 'style="position:relative;padding:0;overflow:hidden;aspect-ratio:3/1;min-height:0;border-radius:14px;border:0;box-shadow:none;margin-top:-8px!important"'
          old_img = 'style="position:absolute;left:0;right:0;top:-20px!important;width:100%;height:calc(100% + 20px)!important;object-fit:cover;display:block"'
          new_img = 'style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"'
          if old_section not in s:
              raise SystemExit('section style not found')
          if old_img not in s:
              raise SystemExit('image style not found')
          s = s.replace(old_section, new_section, 1)
          s = s.replace(old_img, new_img, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "belaya-mgla-sova58"
          git config user.email "actions@users.noreply.github.com"
          git add endless-trial.html
          git diff --cached --quiet || git commit -m "v496: keep full Endless Trial frame visible"
          git push

name: Revert Android Cheats change once

on:
  push:
    branches: [ android-app-v1 ]
    paths:
      - '.github/workflows/revert-android-cheats-once.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-app-v1
          fetch-depth: 0

      - name: Restore previous Android navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('android-app/app/src/main/java/ru/belayamgla/app/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          s = s.replace('addNavItem(bar, "cheats", "Шпоры", R.drawable.ic_cheats, "cheats.html");',
                        'addNavItem(bar, "heroes", "Герои", R.drawable.ic_heroes, "heroes.html");')
          main.write_text(s, encoding='utf-8')

          gradle = Path('android-app/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 5', 'versionCode = 4')
          g = g.replace('versionName = "4.1.0"', 'versionName = "4.0.0"')
          gradle.write_text(g, encoding='utf-8')

          Path('android-app/app/src/main/res/drawable/ic_cheats.xml').unlink(missing_ok=True)
          Path('.github/workflows/revert-android-cheats-once.yml').unlink(missing_ok=True)
          PY

      - name: Commit revert
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore Android app before Cheats nav change'
          git push origin HEAD:android-app-v1

name: Publish mobile navigation v986 on standard site pages
on:
  push:
    paths: ['.github/workflows/site-script-v986.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Refresh shared JS version across HTML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for p in sorted(Path('.').glob('*.html')):
              content=p.read_text(encoding='utf-8')
              prev='site-v629.min.js?v=985'
              if prev not in content:continue
              new=content.replace(prev,'site-v629.min.js?v=986')
              if new!=content:
                  p.write_text(new,encoding='utf-8')
                  changed.append(p.name)
          assert len(changed)>=170, f'Only {len(changed)} pages changed'
          print('UPDATED SCRIPT PAGES:',len(changed))
          print('UPDATED SCRIPT SAMPLE:',','.join(changed[:14]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git diff --cached --quiet || (git commit -m 'Load mobile navigation fix v986 on standard pages' && git push)

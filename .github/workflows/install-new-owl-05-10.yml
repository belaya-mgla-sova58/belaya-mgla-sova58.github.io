name: Finish direct owl sticker install

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/install-new-owl-05-10.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uploaded owl blobs
        shell: python
        run: |
          from pathlib import Path
          import urllib.request, json, base64

          repo = 'belaya-mgla-sova58/belaya-mgla-sova58.github.io'
          items = {
              'owl-05.png': '74f1f78a40a0efdf5a294a1cef4c614730d1fcb8',
              'owl-06.png': '78c8071d0bf84823acb2f99b278f6c31e85fe68e',
              'owl-07.png': '1979b742cd42cd2977ad8811eb76edca72295f24',
          }
          out = Path('assets/chat-stickers/owls')
          out.mkdir(parents=True, exist_ok=True)
          for name, sha in items.items():
              url = f'https://api.github.com/repos/{repo}/git/blobs/{sha}'
              with urllib.request.urlopen(url) as r:
                  data = json.load(r)
              raw = base64.b64decode(data['content'])
              (out / name).write_bytes(raw)
              print(name, len(raw))

      - name: Refresh PWA cache
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"belaya-mgla-v\d+", "belaya-mgla-v578", s, count=1)
          p.write_text(s, encoding='utf-8')

      - name: Clean temporary installer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tmp/owl_05_10_new.zip
          rm -f .github/workflows/install-new-owl-05-10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chat-stickers/owls/owl-05.png assets/chat-stickers/owls/owl-06.png assets/chat-stickers/owls/owl-07.png service-worker.js .tmp/owl_05_10_new.zip .github/workflows/install-new-owl-05-10.yml
          git commit -m 'Install regenerated owl stickers 05-07 and clean installer'
          git push origin main

name: Temporary Blanchette cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-blanchette-build.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean Blanchette temporary files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  <url><loc>https://belaya-mgla-sova58.github.io/tmp-blanchette-main.html</loc><lastmod>2026-10-23</lastmod></url>\n','')
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/tmp-blanchette-build.yml
          rm -f tmp-blanchette-main.html tmp-blanchette-images.txt
          git add sitemap.xml
          git add -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Blanchette hero guide'
          git pull --rebase origin main
          git push

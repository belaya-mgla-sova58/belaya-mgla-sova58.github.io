name: Update WhiteFox week 43 questions safely
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          a=s.index('<div class="whitefox-question-list-v557">', s.index('id="whitefox43Questions"'))
          b=s.index('</div>\n<div class="whitefox-editor-note-v557">', a)
          payload=''
          new=base64.b64decode(payload).decode('utf-8')
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Update WhiteFox week 43 questions'
          git push
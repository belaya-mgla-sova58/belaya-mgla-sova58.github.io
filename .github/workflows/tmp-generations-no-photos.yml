name: Update WhiteFox week 43 romance
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch romance
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          start_marker='<div class="whitefox-section-title"><span>💕</span><h3>Клуб романтики госа 58, неделя 43</h3></div>'
          end_marker='<div class="anon-comments-v557" data-comment-key="whitefox-elena-43-romance">'
          a=s.index(start_marker)+len(start_marker)
          b=s.index(end_marker,a)
          payload=''
          new='\n'+base64.b64decode(payload).decode('utf-8')+'\n'
          p.write_text(s[:a]+new+s[b:],encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Update WhiteFox week 43 romance'
          git push
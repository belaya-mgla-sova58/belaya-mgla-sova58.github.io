name: Refresh notification script cache
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh notification script version
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'notifications-v630.js?v=630' in s:
              s = s.replace('notifications-v630.js?v=630', 'notifications-v630.js?v=631', 1)
          elif 'notifications-v630.js?v=631' not in s:
              raise SystemExit('notification script reference not found')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Refresh notification script cache'
          git push

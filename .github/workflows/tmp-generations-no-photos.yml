name: Remove Canyon Clash shop section
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Canyon Clash shop section
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('canyon-clash.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<section class="guide-section"><h2>Магазин в каньоне</h2>.*?</section>\s*', '', s, flags=re.S)
          s = re.sub(r'body\.is-canyon-clash-route \.shop-placeholder\{[^}]*\}\s*', '', s)
          p.write_text(s, encoding='utf-8')
          PY
          git add canyon-clash.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Remove Canyon Clash shop section'
          git pull --rebase --autostash origin main
          git push
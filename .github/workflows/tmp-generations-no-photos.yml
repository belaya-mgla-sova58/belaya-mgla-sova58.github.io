name: Fix Canyon map source
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('canyon-clash.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://truth.bahamut.com.tw/s01/202407/forum/76999/4f3eb413455116893a68382c8cb007b0.JPG','https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2024/04/cc6-300x283.webp')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canyon-clash.html
          git diff --cached --quiet || git commit -m 'Fix Canyon map source'
          git push
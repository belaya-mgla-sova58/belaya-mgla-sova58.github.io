name: Remove notification feature
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove notification feature
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          ref = '<script defer="" src="notifications-v630.js?v=631"></script>'
          if ref in s:
              s = s.replace(ref, '', 1)
          elif 'notifications-v630.js' in s:
              raise SystemExit('unexpected notification script reference')
          p.write_text(s, encoding='utf-8')
          PY
          git rm -f notifications-v630.js OneSignalSDKWorker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove notification feature'
          git push

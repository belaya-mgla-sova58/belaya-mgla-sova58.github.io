name: Update WhiteFox week 43 romance club
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="whitefox-romance-item-v557">🚗 🚗 Банкир подарил Puss и ее подружке по машинке. Какой щедрый мужчина ☺</div>
<div class="whitefox-romance-item-v557">В LAF был замечен романтический жест со стороны Солнышка в сторону Irko007. Любофф..?</div>
<div class="whitefox-romance-item-v557">🎁 Насчитали три подарка от Адмирала соклановцам. Будет 4ый?</div>
<div class="whitefox-romance-item-v557">🌸 Еще видела подарки игрокам ZOV, один из них точно был от DK. Но кажется он шифруется (стесняется) и остальные 2-3 (?) подарил тайно.. 👀</div>'''
          new='''<div class="whitefox-romance-item-v557">💙💙 Атаман и Безразличие не скрывают своих чувств 😌</div>
<div class="whitefox-romance-item-v557">🚗 🚗 Банкир подарил Puss и ее подружке по машинке. Щедрый мужчина ☺</div>
<div class="whitefox-romance-item-v557">В LAF замечен романтический жест от Солнышка в сторону Irko007. Любофф..?</div>
<div class="whitefox-romance-item-v557">🎁 Насчитали 3 подарка от Адмирала соклановцам. Будет 4ый?</div>
<div class="whitefox-romance-item-v557">🌸 Видела подарки игрокам ZOV, один точно был от DK. Но кажется он шифруется (стесняется) и остальные 2-3 (?) подарил тайно.. 👀</div>
<div class="whitefox-romance-item-v557">🐻 Братский жест от Dias в сторону Modest мы тоже заметили 😉</div>'''
          if old not in s:
              raise SystemExit('old romance block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Update week 43 romance club text'
          git push
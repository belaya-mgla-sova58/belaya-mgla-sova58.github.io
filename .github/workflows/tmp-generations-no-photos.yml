      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          old="const articleKey='news-elena-42-v1';"
          new="const articleKey='news-elena-43-v1';"
          if old not in s:
              raise SystemExit('old article like key not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Separate WhiteFox week 43 like key'
          git push
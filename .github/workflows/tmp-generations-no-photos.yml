name: Bust splash script cache
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update splash cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-v629.min.js')
          s = p.read_text(encoding='utf-8')
          old = 'app-splash-v726.js?v=729'
          new = 'app-splash-v726.js?v=911'
          if old not in s and new not in s:
              raise SystemExit('splash script reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'site-v629.min.js?v=629'
          new = 'site-v629.min.js?v=911'
          if old not in s and new not in s:
              raise SystemExit('site loader reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v629.min.js index.html
          git diff --cached --quiet || git commit -m 'Refresh mobile splash scripts'
          git push
name: Separate WhiteFox week 43 comments
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          old="function scopeFor(key){return key.indexOf('romance')!==-1?'r':'q'}"
          new="function scopeFor(key){return key.indexOf('romance')!==-1?'r43':'q43'}"
          if old not in s:
              raise SystemExit('scopeFor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Separate WhiteFox week 43 comments from old news'
          git push
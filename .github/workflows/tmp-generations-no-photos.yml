name: Publish mobile browser splash cache refresh
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh splash script versions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-v629.min.js')
          s = p.read_text(encoding='utf-8')
          if 'app-splash-v726.js?v=911' in s:
              s = s.replace('app-splash-v726.js?v=911', 'app-splash-v726.js?v=914', 1)
          elif 'app-splash-v726.js?v=914' not in s:
              raise SystemExit('app splash reference not found')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'site-v629.min.js?v=911' in s:
              s = s.replace('site-v629.min.js?v=911', 'site-v629.min.js?v=914', 1)
          elif 'site-v629.min.js?v=914' not in s:
              raise SystemExit('site loader reference not found')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-v629.min.js index.html
          git diff --cached --quiet || git commit -m 'Refresh mobile browser splash cache'
          git push

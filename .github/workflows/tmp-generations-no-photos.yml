name: Restore Canyon Clash map image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore map image directly
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('canyon-clash.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<div class="map-media">.*?<div class="caption">Пример схемы маршрутов и связанных точек Каньона\.</div></div>'
          replacement = '''<figure style="margin:15px auto 4px;max-width:760px;padding:8px;border-radius:18px;background:rgba(7,23,42,.8);border:1px solid rgba(119,194,255,.2);overflow:hidden">
<img src="https://truth.bahamut.com.tw/s01/202407/forum/76999/4f3eb413455116893a68382c8cb007b0.JPG" alt="Карта Битвы в каньоне" style="display:block;width:100%;height:auto;max-width:100%;margin:0;border-radius:12px">
<figcaption style="margin:8px 0 0;padding:0 5px 2px;color:#9ebbd5;font-size:12px;text-align:center;line-height:1.45">Пример схемы маршрутов и связанных точек Каньона.</figcaption>
</figure>'''
          s, n = re.subn(pattern, replacement, s, flags=re.S)
          if n == 0:
              raise SystemExit('map block not found')
          p.write_text(s, encoding='utf-8')
          PY
          git add canyon-clash.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Restore Canyon Clash map image directly'
          git pull --rebase --autostash origin main
          git push
name: Fix Canyon Clash map caption spacing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix map block spacing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('canyon-clash.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''\nbody.is-canyon-clash-route .map-media{display:block!important;height:auto!important;min-height:0!important;max-height:none!important;padding:8px!important;overflow:visible!important}\nbody.is-canyon-clash-route .map-media::before,body.is-canyon-clash-route .map-media::after{content:none!important;display:none!important}\nbody.is-canyon-clash-route .map-media img{position:static!important;display:block!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;margin:0!important;padding:0!important;inset:auto!important;transform:none!important;float:none!important}\nbody.is-canyon-clash-route .map-media .caption{position:static!important;display:block!important;float:none!important;clear:both!important;inset:auto!important;transform:none!important;width:auto!important;height:auto!important;min-height:0!important;max-height:none!important;margin:8px 0 0!important;padding:0 5px 2px!important}\n'''
          if 'map-media::before' not in s:
              s = s.replace(marker, css + marker)
          p.write_text(s, encoding='utf-8')
          PY
          git add canyon-clash.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'Fix Canyon Clash map caption spacing'
          git pull --rebase --autostash origin main
          git push
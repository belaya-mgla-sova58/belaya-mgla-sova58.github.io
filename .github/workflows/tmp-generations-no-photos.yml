name: Temporary generations no photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove hero photos from generations overview
        run: |
          set -euo pipefail
          python tmp-generations-no-photos.py
          git add hero-generations.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make generation hero cards text only'
          git pull --rebase --autostash origin main
          git push

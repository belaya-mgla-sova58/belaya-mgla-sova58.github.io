name: Update WhiteFox week 43 questions
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('whitefox-elena-43.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="whitefox-story-block whitefox-questions-v557" id="whitefox43Questions">')
          qlist=s.index('<div class="whitefox-question-list-v557">', start)
          qend=s.index('</div>\n<div class="whitefox-editor-note-v557">', qlist)
          new='''<div class="whitefox-question-list-v557">
<div class="whitefox-question-v557">Кто подарил больше всего подарков? А кто получил? 😏</div>
<div class="whitefox-question-v557">Малыши RUS ушли к большим в VgB?</div>
<div class="whitefox-question-v557">Сколько солдатиков ZOV пали на этих выходных? 👀 А сколько солдатиков HDA? 👀</div>
<div class="whitefox-question-v557">В чем корни конфликта топ 2 и топ 3?</div>
<div class="whitefox-question-v557">Момосята уйдут в другой гос? Виноваты ZOV? Или не дождались в подарок 🏰 от ..?</div>
<div class="whitefox-question-v557">А кто-то реально еще хочет быть президентом, чтобы слушать какое он *** и вообще во всем не прав?</div>
<div class="whitefox-question-v557">Будут ли еще «подарки» панде от «тайного» поклонника?</div>'''
          s=s[:qlist]+new+s[qend:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html
          git diff --cached --quiet || git commit -m 'Update WhiteFox week 43 questions'
          git push
name: Build WhiteFox week 43 news
on:
  push:
    paths:
      - '.github/workflows/tmp-generations-no-photos.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src=Path('whitefox-elena-42.html').read_text(encoding='utf-8')
          s=src.replace('42','43')

          # Keep only the Questions jump for this issue.
          s=re.sub(r'<div class="whitefox-week43-jump-v558"[^>]*>.*?</div>',
                   '<div class="whitefox-week43-jump-v558" aria-label="Быстрые переходы по публикации"><a href="#whitefox43Questions">❓ Вопросы</a></div>',
                   s, count=1, flags=re.S)

          # Reuse the proven anonymous-comment block from week 42, with fresh week-43 keys.
          q_start=s.index('<section class="whitefox-story-block whitefox-questions-v557"')
          romance_start=s.index('<section class="whitefox-story-block whitefox-romance-v557"', q_start)
          qblock=s[q_start:romance_start]
          questions='''<div class="whitefox-question-list-v557">
          <div class="whitefox-question-v557">Кто подарил больше всего подарков? А кто получил? 😏</div>
          <div class="whitefox-question-v557">RUS теперь в VgB, малыши ушли к большим?</div>
          <div class="whitefox-question-v557">Сколько солдатиков ZOV пали на этих выходных?👀</div>
          <div class="whitefox-question-v557">Сколько солдатиков HDA пали на этих выходных? 👀</div>
          <div class="whitefox-question-v557">Так в чем же корни конфликта топ 2 и топ 3?</div>
          <div class="whitefox-question-v557">Момосята уйдут в другой гос?</div>
          <div class="whitefox-question-v557">А кто-то реально еще хочет быть президентом, чтобы слушать какое он *** и вообще во всем не прав?</div>
          </div>'''
          qblock=re.sub(r'<div class="whitefox-question-list-v557">.*?</div>\s*<div class="whitefox-editor-note-v557">',
                        questions+'\n<div class="whitefox-editor-note-v557">', qblock, count=1, flags=re.S)
          qblock=qblock.replace('Вопросы недели 43','Вопросы госа 58, неделя 43')

          body='''<section class="whitefox-story-block whitefox-week43-intro-v557">
          <p><strong>💥 Замок был слишком спокойный, стоило ожидать подлянки к концу недели. 🚬</strong></p>
          <p>Но давайте по порядку 😌</p>
          <p>👣👣 Заходила в гости Джо. Дважды. Альянсы подсуетились и мы с интересом наблюдали за местами в топе: ARM(Адмирал, Лира, Джулиан), VgB (ЛиХ, MissiamDi), MOM (Godfather), HDA (Dias, AmoonRa).</p>
          <p>Видела еще в топ 10 ребят с FOX и WOW 😉</p>
          </section>
          <section class="whitefox-story-block">
          <div class="whitefox-section-title"><span>🎢</span><h3>Рудник. Рудник. Рудник.</h3></div>
          <p>Посидеть в центре мне в этот раз не дали, забрала только 2ое место. Но практика показывает, что тактика и скорость реакции могут принести топ место любому игроку. Я писала, что ферма Хопера как-то забрала 2ое место, уступив только киту в центре? Моя ферма в этот раз забрала 12ое место (топка 27 и 4 марша).</p>
          <p>🍕 Но не всем нравится рудник. Мне обещали пиццу, если я пройду рудник моему милому другу с другого госа. Как думаете, согласилась? 😉</p>
          </section>
          <section class="whitefox-story-block">
          <div class="whitefox-section-title"><span>🏰</span><h3>Крепости и форты</h3></div>
          <p>Крепость 3 в этот раз осталась без сражения. Битва развернулась на крепости 4 (ZOV vs VgB). Но ДК уже вернулся из отпуска, домик остался у ZOV.</p>
          <p>Интересненькое было на форте 3: началась тусовка с HDA и MOM, кит момосят активно держал домик. Но в скором времени на тусовку пришел третий игрок - VgB. Спустя два часа с начала тусовки на последних секундах HDA выбили форт у МОМ, но сразу же следом их выбили VgB. Домик остался у VgB.</p>
          </section>
          <section class="whitefox-story-block">
          <div class="whitefox-section-title"><span>📢</span><h3>«Братья по оружию»</h3></div>
          <p>Столкновения на плитках были разные. Я вот храбро убивалась пару раз об Ворона и даже об Адмирала. Но самая жара ждала нас уже после.</p>
          </section>
          <section class="whitefox-story-block">
          <div class="whitefox-section-title"><span>🚨</span><h3>HDA и KSV</h3></div>
          <p>Сначала взглянем на ситуацию HDA и KSV. Говорят первые строили стяги к крепости вторых. Не дождались ответа по проходу и начали прокладывать путь путем сожжения стяг малышей. На защиту малышей пришли ребята с VgB и не только. Кто прав?</p>
          </section>
          <section class="whitefox-story-block">
          <div class="whitefox-section-title"><span>🔥</span><h3>Штаб все таки сгорел</h3></div>
          <p>И так. Штаб все таки сгорел. Послушаем мнения сторон.</p>
          <div class="whitefox-quote"><strong>💬 MOM:</strong> «нельзя решить конфликт, который никто по факту решать не хочет) за что пришли мстить ответа так и не поступило вроде)»</div>
          <div class="whitefox-quote"><strong>💬 ZOV:</strong> «Добрый вечер, я как участник конфликта, могу сказать, что сегодняшняя акция это логичный финал, провокаций и оскорблений со стороны МОМ в адрес наших соклановцев. Прошу заметить, что на оскорбления личности, мы ответили по игре, не опускаясь до их уровня.»</div>
          </section>
          '''+qblock

          content_start=s.index('<section class="whitefox-story-block whitefox-week43-intro-v557">')
          signature_start=s.index('<div class="whitefox-story-signature">', content_start)
          s=s[:content_start]+body+'\n'+s[signature_start:]
          Path('whitefox-elena-43.html').write_text(s,encoding='utf-8')

          # Add the new issue to the WhiteFox index while keeping week 42 below it.
          p=Path('news-elena.html')
          idx=p.read_text(encoding='utf-8')
          m=re.search(r'<a aria-label="Открыть новости госа 58 от Elena, неделя 42".*?</a>', idx, re.S)
          if not m:
              raise SystemExit('week 42 card not found')
          old=m.group(0)
          new=old.replace('неделя 42','неделя 43').replace('Неделя 42','Неделя 43').replace('whitefox-elena-42.html?v=565','whitefox-elena-43.html?v=571').replace('whitefox42IndexLikes','whitefox43IndexLikes').replace('whitefox42IndexViews','whitefox43IndexViews')
          new=new.replace('class="whitefox-publication-row whitefox-elena-card whitefox-week42-card-v557"','class="whitefox-publication-row whitefox-elena-card whitefox-week42-card-v557"')
          new=re.sub(r'<span class="whitefox-index-badge-r-v557".*?</span>','',new,count=1,flags=re.S)
          old2=old.replace('✒️ ELENA • НОВОЕ','✒️ ELENA • ВЫПУСК')
          idx=idx.replace(old,new+'\n'+old2,1)
          stats="<script id=\"whitefox43-index-stats-v571\">(function(){const B='https://belaya-mgla-likes-default-rtdb.firebaseio.com/likes/';async function n(k,id){try{const r=await fetch(B+encodeURIComponent(k)+'.json',{cache:'no-store'});const v=await r.json();const e=document.getElementById(id);if(e)e.textContent=(typeof v==='number'?Math.max(0,v):0).toLocaleString('ru-RU')}catch(e){}}n('news-elena-43-v1','whitefox43IndexLikes');n('__views__whitefox-elena-43','whitefox43IndexViews');})();</script>"
          idx=idx.replace('</body></html>',stats+'</body></html>',1)
          p.write_text(idx,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitefox-elena-43.html news-elena.html
          git diff --cached --quiet || git commit -m 'Publish WhiteFox News week 43'
          git push
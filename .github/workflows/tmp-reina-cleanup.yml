name: Temporary Reina cleanup
on:
  push:
    paths:
      - '.github/workflows/tmp-reina-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean sitemap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sitemap.xml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('  <url><loc>https://belaya-mgla-sova58.github.io/tmp-reina-main.html</loc><lastmod>2026-10-23</lastmod></url>\n','')
          p.write_text(s,encoding='utf-8')
          PY
          git add sitemap.xml
          git commit -m "Remove temporary Reina URL from sitemap" || true
          git pull --rebase origin main
          git push origin HEAD:main

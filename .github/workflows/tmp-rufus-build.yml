name: Temporary Rufus build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-rufus-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Rufus page
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pillow
          python tmp-rufus-build.py
          git add hero-rufus.html sitemap.xml assets/heroes/gen-11/rufus
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Rufus generation 11 hero guide'
          git pull --rebase --autostash origin main
          git push

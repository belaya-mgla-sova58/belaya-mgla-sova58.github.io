name: Site source coverage audit v985
on:
  push:
    paths:
      - '.github/workflows/site-coverage-v985.yml'
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML pages for shared desktop loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          ignore={'404.html','maintenance.html'}
          pages=[p for p in Path('.').glob('*.html') if p.name not in ignore and not p.name.startswith(('google','yandex_','owl-reset'))]
          css=[];js=[];both=[];missing=[];caps=[];routes=[]
          for p in sorted(pages):
              s=p.read_text(encoding='utf-8',errors='replace')
              hascss='site-v626.min.css' in s
              hasjs='site-v629.min.js' in s
              if hascss:css.append(p.name)
              if hasjs:js.append(p.name)
              if hascss and hasjs:both.append(p.name)
              else:missing.append({'page':p.name,'css':hascss,'js':hasjs})
              if re.search(r'max-width\s*:\s*(?:720|760|800|900|980|1040|1100)px',s,re.I):caps.append(p.name)
              if 'route-page active' in s:routes.append(p.name)
          print('AUDIT SUMMARY',json.dumps({'htmlPages':len(pages),'cssPages':len(css),'jsPages':len(js),'both':len(both),'routePages':len(routes),'widthCapPages':len(caps)},ensure_ascii=False))
          print('AUDIT MISSING',json.dumps(missing,ensure_ascii=False))
          print('AUDIT WIDTH_CAP',json.dumps(caps,ensure_ascii=False))
          PY

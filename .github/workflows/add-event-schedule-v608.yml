name: Add event schedule v608
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-event-schedule-v608.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert weekly event schedule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('events.html')
          s=p.read_text(encoding='utf-8')
          css='''\n<style id="event-schedule-v608-style">\nbody.is-events-route .event-schedule-v608{margin:10px 0 22px;padding:18px;border:1px solid rgba(92,196,255,.22);border-radius:22px;background:linear-gradient(145deg,rgba(5,29,58,.92),rgba(7,18,44,.94));box-shadow:0 16px 36px rgba(0,0,0,.18)}\nbody.is-events-route .event-schedule-head-v608{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px;flex-wrap:wrap}\nbody.is-events-route .event-schedule-head-v608 h2{margin:0;color:#f4fbff;font-size:22px}\nbody.is-events-route .event-schedule-head-v608 p{margin:4px 0 0;color:#91b5cb;font-size:12px}\nbody.is-events-route .event-schedule-msk-v608{padding:6px 10px;border:1px solid rgba(116,207,255,.20);border-radius:999px;background:rgba(58,164,225,.10);color:#8fdcff;font-size:11px;font-weight:800}\nbody.is-events-route .event-active-v608{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 16px}\nbody.is-events-route .event-active-card-v608{padding:11px 12px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.035);color:#eaf7ff;font-size:12px}\nbody.is-events-route .event-active-card-v608 b{display:block;margin-bottom:3px;color:#fff;font-size:13px}\nbody.is-events-route .event-active-card-v608 span{color:#8fb3c8}\nbody.is-events-route .event-week-wrap-v608{overflow-x:auto;padding-bottom:4px}\nbody.is-events-route .event-week-v608{min-width:760px;display:grid;grid-template-columns:180px repeat(7,minmax(72px,1fr));gap:5px;align-items:center}\nbody.is-events-route .event-week-v608 .corner{color:#7899ae;font-size:11px;font-weight:800;padding:5px}\nbody.is-events-route .event-day-v608{padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.045);text-align:center;color:#a9c5d7;font-size:11px;font-weight:800}\nbody.is-events-route .event-day-v608.today{background:linear-gradient(145deg,#f0ad3f,#d97a26);color:#fff;box-shadow:0 0 14px rgba(240,173,63,.20)}\nbody.is-events-route .event-row-name-v608{padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.028);color:#d9edf8;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\nbody.is-events-route .event-cell-v608{height:30px;border-radius:8px;background:rgba(255,255,255,.025)}\nbody.is-events-route .event-cell-v608.on{background:linear-gradient(145deg,rgba(77,165,239,.78),rgba(64,91,211,.78));box-shadow:inset 0 0 0 1px rgba(142,218,255,.18)}\nbody.is-events-route .event-cell-v608.on.offer{background:linear-gradient(145deg,rgba(235,182,48,.86),rgba(220,126,36,.86))}\nbody.is-events-route .event-cell-v608.on.alliance{background:linear-gradient(145deg,rgba(67,190,106,.82),rgba(37,139,80,.82))}\nbody.is-events-route .event-cell-v608.on.pvp{background:linear-gradient(145deg,rgba(233,133,49,.84),rgba(198,71,52,.84))}\nbody.is-events-route .event-soon-v608{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}\nbody.is-events-route .event-soon-v608 h3{margin:0 0 8px;color:#f6fbff;font-size:15px}\nbody.is-events-route .event-soon-list-v608{display:flex;gap:8px;flex-wrap:wrap}\nbody.is-events-route .event-soon-chip-v608{padding:7px 10px;border:1px solid rgba(255,192,77,.20);border-radius:999px;background:rgba(142,90,20,.15);color:#ffd68b;font-size:11px;font-weight:800}\nbody.is-events-route .event-schedule-note-v608{margin-top:10px;color:#6f93aa;font-size:10px}\n@media(max-width:760px){body.is-events-route .event-schedule-v608{padding:14px;border-radius:18px}body.is-events-route .event-active-v608{grid-template-columns:1fr}body.is-events-route .event-week-v608{min-width:690px;grid-template-columns:165px repeat(7,minmax(68px,1fr))}}\n</style>\n'''
          html='''\n<section class="event-schedule-v608" aria-label="График событий 20–26 октября 2026">\n  <div class="event-schedule-head-v608"><div><h2>📅 График событий</h2><p>20–26 октября 2026 · подтверждено по игровому календарю</p></div><span class="event-schedule-msk-v608">Время МСК</span></div>\n  <div class="event-active-v608">\n    <div class="event-active-card-v608"><b>Сегодня активны</b><span>Колесо фортуны · Безумная Джо · Битвы за форт · Воспоминания о грезах</span></div>\n    <div class="event-active-card-v608"><b>Долгие события</b><span>Награды пути · Ковка эксклюзивного снаряжения</span></div>\n    <div class="event-active-card-v608"><b>22 октября</b><span>Последний день: Колесо фортуны и Безумная Джо</span></div>\n  </div>\n  <div class="event-week-wrap-v608"><div class="event-week-v608">\n    <div class="corner">Событие</div><div class="event-day-v608">Вт<br>20</div><div class="event-day-v608">Ср<br>21</div><div class="event-day-v608 today">Чт<br>22</div><div class="event-day-v608">Пт<br>23</div><div class="event-day-v608">Сб<br>24</div><div class="event-day-v608">Вс<br>25</div><div class="event-day-v608">Пн<br>26</div>\n    <div class="event-row-name-v608">Колесо фортуны</div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div>\n    <div class="event-row-name-v608">Безумная Джо</div><div class="event-cell-v608 on alliance"></div><div class="event-cell-v608 on alliance"></div><div class="event-cell-v608 on alliance"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div>\n    <div class="event-row-name-v608">Битвы за форт</div><div class="event-cell-v608 on pvp"></div><div class="event-cell-v608 on pvp"></div><div class="event-cell-v608 on pvp"></div><div class="event-cell-v608 on pvp"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div>\n    <div class="event-row-name-v608">Воспоминания о грезах</div><div class="event-cell-v608"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div><div class="event-cell-v608"></div>\n    <div class="event-row-name-v608">Награды пути</div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608 on"></div><div class="event-cell-v608"></div>\n    <div class="event-row-name-v608">Ковка эксклюзивного снаряжения</div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div><div class="event-cell-v608 on offer"></div>\n  </div></div>\n  <div class="event-soon-v608"><h3>⏳ Скоро закончится</h3><div class="event-soon-list-v608"><span class="event-soon-chip-v608">22.10 · Колесо фортуны</span><span class="event-soon-chip-v608">22.10 · Безумная Джо</span><span class="event-soon-chip-v608">23.10 · Воспоминания о грезах</span><span class="event-soon-chip-v608">23.10 · Битвы за форт</span><span class="event-soon-chip-v608">25.10 · Награды пути</span></div></div>\n  <div class="event-schedule-note-v608">В график внесены только даты, которые удалось подтвердить по игровому календарю.</div>\n</section>\n'''
          if 'event-schedule-v608-style' not in s:
              s=s.replace('</head>',css+'</head>',1)
          if 'event-schedule-v608' not in s:
              m=re.search(r'(<div[^>]+class="[^"]*route-page[^\"]*active[^\"]*"[^>]+data-route="events"[^>]*>)',s)
              if not m:
                  m=re.search(r'(<div[^>]+data-route="events"[^>]*>)',s)
              if not m:
                  raise SystemExit('events route container not found')
              s=s[:m.end()]+html+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit schedule
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events.html
          git diff --cached --quiet || git commit -m 'Add weekly event schedule block v608'
          git push

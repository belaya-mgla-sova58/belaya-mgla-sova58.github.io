name: Playwright visual check

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.webmanifest'
      - 'assets/**'
      - 'visual-tests/**'
      - 'scripts/**'
      - '.github/workflows/visual-check.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.webmanifest'
      - 'assets/**'
      - 'visual-tests/**'
      - 'scripts/**'
      - '.github/workflows/visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculator-check:
    name: Calculator arithmetic regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        working-directory: visual-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start isolated local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/sova58-calculator-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sova58-calculator-server.log
          exit 1
      - name: Validate calculator arithmetic
        working-directory: visual-tests
        run: npx playwright test essence-calculation.spec.mjs advanced-gear-calculations.spec.mjs --project=desktop
      - name: Report calculator results
        if: always()
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const file='visual-tests/test-results/results.json';
          const output=process.env.GITHUB_STEP_SUMMARY;
          if(!fs.existsSync(file)){
            fs.appendFileSync(output, '\n## Calculator results\nNo JSON result was produced. See job logs.\n');
            process.exit(0);
          }
          const result=JSON.parse(fs.readFileSync(file,'utf8'));
          const stats=result.stats||{};
          const failures=[];
          function visit(suites) {
            for (const suite of suites||[]) {
              for (const spec of suite.specs||[]) {
                for (const test of spec.tests||[]) {
                  if (test.status!=='unexpected') continue;
                  const attempt=test.results?.at(-1);
                  const issue=attempt?.error?.message||attempt?.errors?.[0]?.message||'No error text';
                  failures.push({name:spec.title, project:test.projectName, error:issue});
                }
              }
              visit(suite.suites);
            }
          }
          visit(result.suites);
          let message='\n## Calculator results\nPassed: **'+(stats.expected||0)+
            '**, failed: **'+(stats.unexpected||0)+'**, skipped: **'+(stats.skipped||0)+'**.\n';
          if(failures.length){
            message+='\n### Failed calculations\n';
            for(const failure of failures.slice(0,50)){
              const clean=value=>String(value).replaceAll('\n',' ').replaceAll('|','/').slice(0,280);
              message+='- **'+clean(failure.name)+'** ('+clean(failure.project)+'): '+clean(failure.error)+'\n';
            }
          }
          fs.appendFileSync(output,message);
          console.log(message);
          JS
      - name: Upload calculator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-arithmetic-report
          path: |
            visual-tests/playwright-report/
            visual-tests/test-results/
          if-no-files-found: warn
          retention-days: 14

  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify PWA cache, manifest and critical assets
        run: node tests/pwa-integrity.cjs

      - name: Check homepage CSS generation consistency (non-blocking audit)
        # Report existing CSS drift without skipping the actual desktop/mobile browser tests.
        continue-on-error: true
        run: node scripts/build-home-css.cjs --check

      - name: Install Playwright
        working-directory: visual-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify all calculator and mobile tests are discovered
        working-directory: visual-tests
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --list > /tmp/sova58-playwright-list.txt
          grep -Fq 'Ковка 19→20' /tmp/sova58-playwright-list.txt
          grep -Fq 'Красное +0→+100' /tmp/sova58-playwright-list.txt
          grep -Fq 'Калькуляторы: ссылки, нажатия' /tmp/sova58-playwright-list.txt
          echo 'Calculator, mastery, and mobile-navigation test suites discovered.'
          tail -n 4 /tmp/sova58-playwright-list.txt

      - name: Prepare previous version for visual comparison
        id: reference
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -e
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PREVIOUS_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git worktree add --detach /tmp/belaya-mgla-before "$BASE_SHA"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Start local copy of the site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/belaya-mgla-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/belaya-mgla-http.log
          exit 1

      - name: Start previous site version
        if: steps.reference.outputs.available == 'true'
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/belaya-mgla-before > /tmp/belaya-mgla-before-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/ -o /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/belaya-mgla-before-http.log
          exit 1

      - name: Check desktop and mobile layouts
        working-directory: visual-tests
        run: npx playwright test site-visual.spec.mjs mobile-navigation.spec.mjs

      - name: Summarize Playwright tests and failures
        if: always()
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = 'visual-tests/test-results/results.json';
          const summary = process.env.GITHUB_STEP_SUMMARY;
          if (!fs.existsSync(path)) {
            fs.appendFileSync(summary, '\n## Playwright tests\nNo JSON result available. Check the test job log.\n');
            process.exit(0);
          }
          const result = JSON.parse(fs.readFileSync(path, 'utf8'));
          const count = result.stats || {};
          const passed = count.expected ?? 0;
          const failed = count.unexpected ?? 0;
          const skipped = count.skipped ?? 0;
          const flaky = count.flaky ?? 0;
          let text = '\n## Playwright tests\n';
          text += `Passed: **${passed}**, failed: **${failed}**, skipped: **${skipped}**, flaky: **${flaky}**.\n`;
          const problems=[];
          function walk(suites, parts=[]) {
            for (const suite of suites || []) {
              const next=[...parts, suite.title].filter(Boolean);
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if (test.status !== 'unexpected') continue;
                  const last = test.results?.at(-1);
                  problems.push({ name: [...next, spec.title, test.projectName].filter(Boolean).join(' / '),
                    detail: (last?.error?.message || last?.errors?.[0]?.message || 'Unknown failure').slice(0, 350) });
                }
              }
              walk(suite.suites,next);
            }
          }
          walk(result.suites);
          if (problems.length) {
            text += '\n### Failing checks\n';
            for (const p of problems.slice(0, 40)) {
              text += '- ' + p.name.replaceAll('\n',' ') + ': ' + p.detail.replaceAll('\n',' ').replaceAll('|','/') + '\n';
            }
          }
          fs.appendFileSync(summary,text);
          console.log(text);
          JS

      - name: Compare before and after screenshots
        if: steps.reference.outputs.available == 'true'
        working-directory: visual-tests
        run: npm run compare

      - name: Upload screenshots and comparison galleries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            visual-tests/playwright-report/
            visual-tests/test-results/
            visual-tests/visual-diff-report/
          if-no-files-found: warn
          retention-days: 14

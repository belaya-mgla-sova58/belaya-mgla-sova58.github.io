name: Install clean owl stickers

on:
  push:
    branches: [ main ]
    paths:
      - 'clean-owls-v2-small.zip'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install clean owl pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/clean-owls-unpacked
          mkdir -p /tmp/clean-owls-unpacked
          unzip -q clean-owls-v2-small.zip -d /tmp/clean-owls-unpacked
          test "$(find /tmp/clean-owls-unpacked/assets/chat-stickers/owls -maxdepth 1 -type f -name 'owl-*.png' | wc -l)" -eq 30
          rm -rf assets/chat-stickers/owls
          cp -R /tmp/clean-owls-unpacked/assets/chat-stickers/owls assets/chat-stickers/owls
          test "$(find assets/chat-stickers/owls -maxdepth 1 -type f -name 'owl-*.png' | wc -l)" -eq 30

      - name: Commit clean owl assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f clean-owls-v2-small.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chat-stickers/owls clean-owls-v2-small.zip
          git commit -m 'Replace owl stickers with clean source crops'
          git push origin main

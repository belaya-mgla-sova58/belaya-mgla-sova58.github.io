name: Interactive site diagnostics v986
on:
  push:
    paths: ['.github/workflows/interaction-audit-v986.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Inspect exact click and HTTP behaviors
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            for(const mode of ['desktop','mobile']){
              const ctx=await browser.newContext(mode==='desktop'?{viewport:{width:1440,height:900},serviceWorkers:'block'}:{viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
              const test=async(name,fn)=>{
                const p=await ctx.newPage();const bad=[];
                p.on('response',r=>{if(r.status()>=400&&r.url().includes('belaya-mgla-sova58.github.io'))bad.push([r.status(),r.url()])});
                p.on('pageerror',e=>console.log('PAGE ERROR',mode,name,e.message));
                await p.goto('https://belaya-mgla-sova58.github.io/'+name+'?diag=986',{waitUntil:'domcontentloaded'});
                await p.waitForTimeout(650);
                try{await fn(p)}catch(e){console.log('DIAG EXCEPTION',mode,name,String(e.message||e).slice(0,700))}
                console.log('BAD REQUESTS',mode,name,JSON.stringify(bad.slice(0,15)));
                await p.close();
              };
              await test('index.html',async(p)=>{
                const btn=p.locator('#mobileMenuToggle');
                if(mode==='mobile'){
                  console.log('MENU INIT',await p.evaluate(()=>{let b=document.querySelector('#mobileMenuToggle');let s=getComputedStyle(b);return {rect:b.getBoundingClientRect().toJSON(),z:s.zIndex,position:s.position,display:s.display}}));
                  await btn.click({timeout:3000});console.log('MENU OPEN',await p.evaluate(()=>{const b=document.querySelector('#mobileMenuToggle'),r=b.getBoundingClientRect(),top=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);return {exp:b.getAttribute('aria-expanded'),rect:r.toJSON(),top:top?.outerHTML?.slice(0,140),buttonZ:getComputedStyle(b).zIndex,overlayZ:getComputedStyle(document.querySelector('#mobileNavOverlay')).zIndex}}));
                  try{await btn.click({timeout:2500});console.log('MENU CLOSE BUTTON SUCCESS')}catch(e){console.log('MENU CLOSE BUTTON ERROR',String(e.message).slice(0,400));}
                  await p.locator('#mobileNavOverlay').click({timeout:2500,force:true});
                  console.log('MENU AFTER OVERLAY',await btn.getAttribute('aria-expanded'));
                }
              });
              await test('events.html',async(p)=>{
                const all=p.locator('details.guide-fold-v414'),btn=p.locator('.guide-fold-all-v414');
                console.log('EVENT INIT',mode,await all.evaluateAll(xs=>xs.map(x=>x.open)));
                const b=await btn.evaluate(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e),el=document.elementFromPoint(Math.max(1,r.x+r.width/2),Math.max(1,Math.min(innerHeight-1,r.y+r.height/2)));return {rect:r.toJSON(),visibility:s.visibility,display:s.display,pe:s.pointerEvents,hit:el?.outerHTML?.slice(0,200)}});
                console.log('EVENT BUTTON',mode,JSON.stringify(b));
                try{await btn.click({timeout:3000});console.log('EVENT FIRST',mode,await all.evaluateAll(xs=>xs.map(x=>x.open)))}catch(e){console.log('EVENT CLICK ERR',mode,String(e.message).slice(0,500));}
                try{await btn.click({timeout:3000});console.log('EVENT SECOND',mode,await all.evaluateAll(xs=>xs.map(x=>x.open)))}catch(e){console.log('EVENT SECOND ERR',mode,String(e.message).slice(0,500));}
              });
              await test('essence-mithril-calculator.html',async(p)=>{
                p.on('dialog',async d=>{console.log('CALC DIALOG',mode,d.type(),d.message());await d.accept()});
                const count=()=>p.locator('#ecItems .ec-item').count();
                console.log('CALC START',mode,await count());
                const more=p.locator('#ecMoreItems');
                console.log('CALC OPEN BEFORE',mode,await more.getAttribute('open'));
                try{await more.locator('summary').click({timeout:3000});console.log('CALC OPEN AFTER',mode,await more.getAttribute('open'))}catch(e){console.log('CALC SUMMARY ERROR',mode,String(e.message).slice(0,500))}
                try{await p.locator('#ecAdd').click({timeout:3000});await p.waitForTimeout(200);console.log('CALC AFTER ADD',mode,await count(),await p.locator('#ecAdd').isDisabled());}catch(e){console.log('CALC ADD ERROR',mode,String(e.message).slice(0,500))}
                try{await p.locator('#ecReset').click({timeout:3000});await p.waitForTimeout(200);console.log('CALC AFTER RESET',mode,await count())}catch(e){console.log('CALC RESET ERROR',mode,String(e.message).slice(0,500))}
              });
              await ctx.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

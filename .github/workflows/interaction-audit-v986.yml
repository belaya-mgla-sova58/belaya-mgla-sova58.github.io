name: Verify mobile tap targets v986
on:
  push:
    paths: ['.github/workflows/interaction-audit-v986.yml']
permissions: {contents: read}
jobs:
  mobile-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Locate mobile click blockers and test navigation close
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch(),context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const page=await context.newPage(),base='https://belaya-mgla-sova58.github.io/';
            await page.goto(base+'essence-mithril-calculator.html?diag=988',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(650);
            await page.locator('#ecMoreItems>summary').click();
            await page.evaluate(()=>{
              window._tapEvents=[];
              ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(type=>{
                document.addEventListener(type,e=>{const t=e.target;window._tapEvents.push({type,target:t.id||t.className?.toString().slice(0,80)||t.tagName,cancelled:e.defaultPrevented})},true);
              });
            });
            console.log('CALC RECT',JSON.stringify(await page.locator('#ecAdd').evaluate(b=>{let r=b.getBoundingClientRect(),s=getComputedStyle(b);let x=r.x+r.width/2,y=r.y+r.height/2;return {rect:r.toJSON(),display:s.display,pe:s.pointerEvents,visibility:s.visibility,hit:document.elementFromPoint(x,Math.min(innerHeight-1,y))?.outerHTML?.slice(0,240),detailsOpen:b.closest('details')?.open,ancestor:b.parentElement.outerHTML.slice(0,250)}})));
            await page.locator('#ecAdd').click({timeout:4000});
            console.log('CALC CLICK EVENTS',JSON.stringify(await page.evaluate(()=>window._tapEvents)));
            console.log('CALC CLICK COUNT',await page.locator('#ecItems .ec-item').count());
            await page.locator('#ecAdd').tap({timeout:4000});
            console.log('CALC TAP EVENTS',JSON.stringify(await page.evaluate(()=>window._tapEvents.slice(-14))));
            console.log('CALC TAP COUNT',await page.locator('#ecItems .ec-item').count());
            const p=await context.newPage();
            await p.goto(base+'index.html?diag=988',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(550);
            await p.evaluate(()=>{
              var nav=document.querySelector('.nav-wrap'),toggle=document.getElementById('mobileMenuToggle');
              var close=document.createElement('button');close.id='sovaMobileCloseV986';close.type='button';close.setAttribute('aria-label','Закрыть меню');close.textContent='×';
              close.style.cssText='position:sticky;top:8px;float:right;width:40px;height:40px;z-index:100;background:#144676;border:1px solid #72cfff;border-radius:12px;color:#fff;font-size:28px';
              close.addEventListener('click',()=>toggle.click());
              nav.prepend(close);
            });
            await p.locator('#mobileMenuToggle').click({timeout:3000});
            const close=p.locator('#sovaMobileCloseV986');
            console.log('MENU CUSTOM CLOSE RECT',JSON.stringify(await close.evaluate(b=>{let r=b.getBoundingClientRect();return {r:r.toJSON(),hit:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.outerHTML.slice(0,110)}})));
            try{await close.click({timeout:3000});console.log('MENU CUSTOM CLOSE STATUS',await p.locator('#mobileMenuToggle').getAttribute('aria-expanded'))}
            catch(e){console.log('MENU CUSTOM CLOSE ERROR',String(e.message).slice(0,550))}
            await browser.close();
          })().catch(e=>{console.error('TARGETS ERROR',e);process.exitCode=1});
          JS

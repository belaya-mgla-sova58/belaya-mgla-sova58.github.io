name: Verify published site interactions v986
on:
  push:
    paths: ['.github/workflows/interaction-audit-v986.yml']
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test production browser behavior
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();let passed=0,failures=[];
            for(const [mode,options] of Object.entries({desktop:{viewport:{width:1440,height:900},serviceWorkers:'block'},mobile:{viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'}})){
              const ctx=await browser.newContext(options);
              async function test(file,fn){
                const p=await ctx.newPage(),bad=[],errors=[];
                p.on('pageerror',e=>errors.push(e.message.slice(0,100)));
                p.on('response',r=>{if(r.status()>=400&&r.url().includes('belaya-mgla-sova58.github.io'))bad.push([r.status(),r.url()])});
                const prefix=mode+' '+file;
                try{
                  const res=await p.goto('https://belaya-mgla-sova58.github.io/'+file+'?verify=986',{waitUntil:'domcontentloaded',timeout:30000});
                  await p.waitForTimeout(650);
                  if(!res.ok())throw Error('HTTP '+res.status());
                  await fn(p);
                  if(bad.length)throw Error('failed local resources: '+JSON.stringify(bad));
                  if(errors.length)throw Error('JS pageerrors '+JSON.stringify(errors));
                  passed++;console.log('PASS',prefix);
                }catch(e){failures.push(prefix+': '+String(e.message||e).slice(0,240));console.log('FAIL',prefix,String(e.message||e).slice(0,240))}
                await p.close();
              }
              await test('index.html',async p=>{
                const s=p.locator('.site-search-input-v426').first();
                await s.fill('медвед');await p.waitForTimeout(180);
                if(await p.locator('a.site-search-result-v426').count()<1)throw Error('No search results');
                await s.fill('');
                if(mode==='mobile'){
                  await p.locator('#mobileMenuToggle').tap();
                  const b=p.locator('#sovaMobileCloseV986');
                  if(!await b.isVisible())throw Error('Close button not visible');
                  await b.tap();
                  if((await p.locator('#mobileMenuToggle').getAttribute('aria-expanded'))!=='false')throw Error('Menu stayed open');
                }
              });
              await test('events.html',async p=>{
                const details=p.locator('details.guide-fold-v414');
                if(mode==='desktop'){
                  const button=p.locator('.guide-fold-all-v414');
                  await button.click();
                  const allClosed=await details.evaluateAll(xs=>xs.every(e=>!e.open));
                  await button.click();
                  const allOpened=await details.evaluateAll(xs=>xs.every(e=>e.open));
                  if(!allClosed||!allOpened)throw Error('Expand/collapse all incorrect');
                }else{
                  const first=details.first();
                  await first.locator('summary').tap();
                  if(!await first.evaluate(e=>!e.open))throw Error('Section did not toggle');
                }
              });
              await test('essence-mithril-calculator.html',async p=>{
                p.on('dialog',d=>d.accept());
                const count=()=>p.locator('#ecItems .ec-item').count();
                await p.locator('#ecMoreItems > summary')[mode==='mobile'?'tap':'click']();
                const before=await count();
                await p.locator('#ecAdd')[mode==='mobile'?'tap':'click']();
                if((await count())!==before+1)throw Error('Add item failed');
                await p.locator('#ecReset')[mode==='mobile'?'tap':'click']();
                if((await count())!==1)throw Error('Reset failed');
              });
              await test('pets.html',async p=>{
                const card=p.locator('details.pet-catalog-card').first();
                await card.locator('summary')[mode==='mobile'?'tap':'click']();
                if(!await card.evaluate(e=>e.open))throw Error('Pet did not open');
              });
              await test('faq.html',async p=>{
                const card=p.locator('details.faq-answer-card').first();
                await card.locator('summary')[mode==='mobile'?'tap':'click']();
                if(!await card.evaluate(e=>e.open))throw Error('FAQ did not open');
              });
              await ctx.close();
            }
            await browser.close();
            console.log('FINAL PASS COUNT',passed,'EXPECTED',10);
            console.log('FINAL FAILURES',JSON.stringify(failures));
            if(failures.length||passed!==10)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS

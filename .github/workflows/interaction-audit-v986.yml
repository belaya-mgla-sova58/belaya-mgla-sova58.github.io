name: Verify mobile fixes before publication v986
on:
  push:
    paths: ['.github/workflows/interaction-audit-v986.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify proposed menu fix and calculator add
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const b='https://belaya-mgla-sova58.github.io/';
            const page=await ctx.newPage();
            await page.goto(b+'index.html?diag=987',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(700);
            const css=`@media(max-width:980px),(hover:none) and (pointer:coarse){
              body.modern-v422.mobile-menu-open .mobile-topbar #mobileMenuToggle,
              body.modern-v422.mobile-nav-open .mobile-topbar #mobileMenuToggle{
                position:fixed!important;left:182px!important;top:30vh!important;
                z-index:2147483400!important;transition:none!important;
                pointer-events:auto!important;transform:none!important;
              }
            }`;
            await page.addStyleTag({content:css});
            const btn=page.locator('#mobileMenuToggle');
            await btn.click({timeout:3000});
            await page.waitForTimeout(400);
            console.log('MOBILE MENU OPEN',await page.evaluate(()=>{let x=document.querySelector('#mobileMenuToggle'),r=x.getBoundingClientRect();return JSON.stringify({expanded:x.getAttribute('aria-expanded'),rect:r.toJSON(),top:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.tagName})}));
            try{await btn.click({timeout:3500});console.log('MOBILE MENU CLOSED',await btn.getAttribute('aria-expanded'))}
            catch(e){console.log('MOBILE MENU FAILED',String(e.message).slice(0,850))}
            await page.close();
            const p=await ctx.newPage();
            await p.goto(b+'essence-mithril-calculator.html?diag=987',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(750);
            p.on('dialog',d=>d.accept());
            await p.locator('#ecMoreItems > summary').click();
            const snapshot=()=>p.evaluate(()=>({htmlCount:document.querySelectorAll('#ecItems .ec-item').length,stored:JSON.parse(localStorage.getItem('sova58-essence-mithril-calculator-v1')||'null')?.items?.length,status:document.querySelector('#ecStatus')?.textContent.slice(0,90)}));
            console.log('MOBILE CALC INITIAL',JSON.stringify(await snapshot()));
            await p.evaluate(()=>{window._calcClicks=0;document.querySelector('#ecAdd').addEventListener('click',()=>window._calcClicks++)});
            await p.locator('#ecAdd').click({timeout:3000});
            console.log('MOBILE CALC AFTER PW CLICK',JSON.stringify(await snapshot()),await p.evaluate(()=>window._calcClicks));
            await p.evaluate(()=>document.querySelector('#ecAdd').click());
            await p.waitForTimeout(150);
            console.log('MOBILE CALC AFTER JS CLICK',JSON.stringify(await snapshot()),await p.evaluate(()=>window._calcClicks));
            await p.locator('#ecReset').click({timeout:3000});
            console.log('MOBILE CALC AFTER RESET',JSON.stringify(await snapshot()));
            await p.close();await ctx.close();await browser.close();
          })().catch(e=>{console.error('VERIFY ERROR',e);process.exitCode=1});
          JS

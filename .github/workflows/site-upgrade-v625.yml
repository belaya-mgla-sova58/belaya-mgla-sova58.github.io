name: Site upgrade v625

on:
  push:
    paths:
      - '.github/workflows/site-upgrade-v625.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add article SEO, breadcrumbs, related guides, and real sitemap dates
        shell: python
        run: |
          import pathlib,re,json,html,subprocess,urllib.parse
          from xml.sax.saxutils import escape as xml_escape

          base='https://belaya-mgla-sova58.github.io/'
          guides=[
            'alliance-championship.html','alliance-mobilization.html','alliance-showdown.html',
            'arena.html','armament-competition.html','beacon.html','bear.html','brothers-in-arms.html',
            'buildings-after-fire.html','buildings-before-fire.html','buildings.html','castle.html','cheats.html',
            'crazy-joe.html','dreams.html','endless-trial.html','experts.html','exploration.html','farm.html',
            'fishing.html','forts.html','foundry.html','frostfire-mine.html','gear.html','ginas-revenge.html',
            'governor-orders.html','governor.html','heroes.html','island.html','labyrinth.html','mails.html',
            'mercenary-prestige.html','newbie.html','pets.html','president-guide.html','research.html','resources.html',
            'snowplow.html','state-positions.html','svs-prep.html','svs.html','troops.html','tundra-trade-route.html',
            'winter-siege.html'
          ]
          guides=[g for g in guides if pathlib.Path(g).exists()]

          event_group=[
            'ginas-revenge.html','crazy-joe.html','bear.html','forts.html','foundry.html','frostfire-mine.html',
            'winter-siege.html','fishing.html','tundra-trade-route.html','brothers-in-arms.html','endless-trial.html',
            'mercenary-prestige.html','dreams.html','alliance-championship.html','alliance-mobilization.html',
            'alliance-showdown.html','armament-competition.html','svs.html','svs-prep.html'
          ]
          growth_group=[
            'newbie.html','buildings.html','buildings-before-fire.html','buildings-after-fire.html','research.html',
            'troops.html','gear.html','heroes.html','experts.html','pets.html','resources.html','farm.html',
            'exploration.html','island.html','labyrinth.html','beacon.html','snowplow.html','arena.html'
          ]
          state_group=['president-guide.html','governor.html','governor-orders.html','state-positions.html','castle.html']
          misc_group=['cheats.html','mails.html']

          TECH_WORDS=(
            'branding','responsive','desktop','mobile','sidebar','cache','seo','sitemap','indexnow',
            'verification','view switch','normalize','cleanup','author metadata','metadata cleanup',
            'remove temporary','pages','breadcrumb','related guide','minif','layout fix','css fix'
          )

          def significant_date(path):
            try:
              out=subprocess.check_output(['git','log','--format=%cs\t%s','--',path],text=True,stderr=subprocess.DEVNULL)
              rows=[x for x in out.splitlines() if x.strip()]
              for row in rows:
                date,subject=(row.split('\t',1)+[''])[:2]
                low=subject.lower()
                if not any(w in low for w in TECH_WORDS):
                  return date
              if rows:
                return rows[0].split('\t',1)[0]
            except Exception:
              pass
            return '2026-10-22'

          def strip_tags(s):
            return html.unescape(re.sub(r'<[^>]+>','',s or '')).strip()

          def attr(s, pattern):
            m=re.search(pattern,s,re.I|re.S)
            return html.unescape(m.group(1)).strip() if m else ''

          def title_of(s,p):
            m=re.search(r'<h1\b[^>]*>(.*?)</h1>',s,re.I|re.S)
            if m: return strip_tags(m.group(1))
            t=attr(s,r'<title>(.*?)</title>')
            t=re.sub(r'^Белая\s+Мгла\s*[•|:-]\s*','',t,flags=re.I)
            return t or p.stem.replace('-',' ').title()

          docs={}
          titles={}
          for name in guides:
            p=pathlib.Path(name)
            s=p.read_text(encoding='utf-8')
            docs[name]=s
            titles[name]=title_of(s,p)

          def group_for(name):
            for grp in (event_group,growth_group,state_group,misc_group):
              if name in grp:
                return [x for x in grp if x in guides]
            return guides

          def crumb_for(name):
            if name in event_group:
              return ('События','events.html')
            if name in state_group:
              return ('Государство 58','state-58.html')
            return ('База знаний','other.html')

          changed=[]
          for name in guides:
            p=pathlib.Path(name)
            s=docs[name]
            old=s
            title=titles[name]
            desc=attr(s,r'<meta\s+[^>]*content="([^"]*)"[^>]*name="description"[^>]*/?>')
            if not desc:
              desc=attr(s,r'<meta\s+[^>]*name="description"[^>]*content="([^"]*)"[^>]*/?>')
            canonical=attr(s,r'<link\s+[^>]*href="([^"]+)"[^>]*rel="canonical"[^>]*/?>') or (base+name)
            ogimg=attr(s,r'<meta\s+[^>]*content="([^"]+)"[^>]*property="og:image"[^>]*/?>')
            body_hi=attr(s,r'<img\b[^>]*src="([^"]+)"[^>]*fetchpriority="high"[^>]*>')
            image=body_hi or ogimg
            if image and not image.startswith(('http://','https://')):
              image=urllib.parse.urljoin(base,image)
            mod=significant_date(name)

            # Mark guides as articles for social/search parsers.
            s=re.sub(r'<meta\s+content="website"\s+property="og:type"\s*/?>','<meta content="article" property="og:type"/>',s,count=1,flags=re.I)
            if 'property="article:author"' not in s:
              s=s.replace('</head>',f'<meta content="{base}sova58.html" property="article:author"/><link href="sova58.html" rel="author"/></head>',1)

            # Visible breadcrumbs only where absent.
            crumb_label,crumb_href=crumb_for(name)
            if 'breadcrumbs-v409' not in s:
              nav=(f'<nav aria-label="Хлебные крошки" class="breadcrumbs-v409">'
                   f'<a href="index.html">Главная</a><span aria-hidden="true" class="breadcrumbs-sep-v409">›</span>'
                   f'<a href="{crumb_href}">{crumb_label}</a><span aria-hidden="true" class="breadcrumbs-sep-v409">›</span>'
                   f'<span aria-current="page">{html.escape(title)}</span></nav>')
              s,n=re.subn(r'(<div\s+class="route-page active"[^>]*>)',r'\1'+nav,s,count=1,flags=re.I)
              if not n:
                s=s.replace('<main id="appMain">','<main id="appMain">'+nav,1)

            # Remove old v625 schemas if workflow is rerun.
            s=re.sub(r'<script\s+id="guide-article-schema-v625"[^>]*>.*?</script>','',s,flags=re.I|re.S)
            s=re.sub(r'<script\s+id="guide-breadcrumb-schema-v625"[^>]*>.*?</script>','',s,flags=re.I|re.S)

            article={
              '@context':'https://schema.org','@type':'Article','headline':title,
              'description':desc,'url':canonical,'mainEntityOfPage':{'@type':'WebPage','@id':canonical},
              'author':{'@type':'Person','name':'SOVA58','url':base+'sova58.html'},
              'isPartOf':{'@type':'WebSite','name':'Белая мгла · SOVA58','url':base},
              'inLanguage':'ru','dateModified':mod
            }
            if image: article['image']=[image]
            breadcrumb={
              '@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[
                {'@type':'ListItem','position':1,'name':'Главная','item':base},
                {'@type':'ListItem','position':2,'name':crumb_label,'item':urllib.parse.urljoin(base,crumb_href)},
                {'@type':'ListItem','position':3,'name':title,'item':canonical}
              ]
            }
            schema=(f'<script id="guide-article-schema-v625" type="application/ld+json">{json.dumps(article,ensure_ascii=False,separators=(",",":"))}</script>'
                    f'<script id="guide-breadcrumb-schema-v625" type="application/ld+json">{json.dumps(breadcrumb,ensure_ascii=False,separators=(",",":"))}</script>')
            s=s.replace('</head>',schema+'</head>',1)

            # Static related-guide links for users and crawlers.
            s=re.sub(r'<section\s+class="related-guides-v625".*?</section>','',s,flags=re.I|re.S)
            grp=group_for(name)
            if len(grp)>1:
              idx=grp.index(name) if name in grp else 0
              rel=[]
              step=1
              while len(rel)<min(3,len(grp)-1) and step<=len(grp)+2:
                candidate=grp[(idx+step)%len(grp)]
                if candidate!=name and candidate not in rel:
                  rel.append(candidate)
                step+=1
              cards=''.join(f'<a class="related-guide-card-v625" href="{r}"><span>{html.escape(titles.get(r,r))}</span><b>Открыть гайд ›</b></a>' for r in rel)
              section=f'<section class="related-guides-v625" aria-label="Похожие гайды"><div class="related-guides-head-v625"><span>Ещё по теме</span><h2>Похожие гайды</h2></div><div class="related-guides-grid-v625">{cards}</div></section>'
              s=s.replace('</main>',section+'</main>',1)

            # New optimized static assets.
            s=re.sub(r'site-v269\.css\?v=\d+','site-v625.min.css?v=625',s)
            s=re.sub(r'site-v269\.js\?v=\d+','site-v625.min.js?v=625',s)

            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)

          # All HTML pages use the optimized assets, not just guides.
          for p in sorted(pathlib.Path('.').glob('*.html')):
            s=p.read_text(encoding='utf-8')
            old=s
            s=re.sub(r'site-v269\.css\?v=\d+','site-v625.min.css?v=625',s)
            s=re.sub(r'site-v269\.js\?v=\d+','site-v625.min.js?v=625',s)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              if p.name not in changed: changed.append(p.name)

          # Styles stay in the editable source; the browser gets a minified build.
          css=pathlib.Path('site-v269.css')
          cs=css.read_text(encoding='utf-8')
          marker='v625: related guides and author links'
          if marker not in cs:
            cs += '''\n/* ===== v625: related guides and author links ===== */\n.related-guides-v625{margin:28px 0 8px;padding:20px;border:1px solid rgba(116,205,255,.16);border-radius:22px;background:linear-gradient(145deg,rgba(8,31,55,.82),rgba(4,18,35,.88));box-shadow:0 14px 38px rgba(0,0,0,.16)}\n.related-guides-head-v625 span{display:block;color:#72d7ff;font-size:11px;font-weight:900;letter-spacing:.10em;text-transform:uppercase}.related-guides-head-v625 h2{margin:4px 0 14px;color:#f3fbff;font-size:21px}.related-guides-grid-v625{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.related-guide-card-v625{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:104px;padding:14px 15px;border:1px solid rgba(121,202,246,.14);border-radius:16px;background:rgba(255,255,255,.035);text-decoration:none!important;transition:.18s ease}.related-guide-card-v625:hover{transform:translateY(-2px);background:rgba(95,195,245,.08);border-color:rgba(121,202,246,.28)}.related-guide-card-v625 span{color:#eaf7ff;font-size:14px;font-weight:800;line-height:1.35}.related-guide-card-v625 b{color:#76d6ff;font-size:12px}.guide-author-link-v625{color:#7bdcff!important;font-weight:900;text-decoration:none!important}@media(max-width:760px){.related-guides-v625{margin-top:20px;padding:14px;border-radius:18px}.related-guides-grid-v625{grid-template-columns:1fr}.related-guide-card-v625{min-height:0}}\n'''
            css.write_text(cs,encoding='utf-8')

          # Sitemap with per-page significant-content dates.
          excludes={'404.html','maintenance.html','google94584035fdf43cd0.html','yandex_ee69138efc48d1ec.html'}
          pages=[p for p in sorted(pathlib.Path('.').glob('*.html')) if p.name not in excludes]
          lines=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          # Homepage first.
          pages=sorted(pages,key=lambda p:(p.name!='index.html',p.name))
          for p in pages:
            loc=base if p.name=='index.html' else base+p.name
            lines.append(f'  <url><loc>{xml_escape(loc)}</loc><lastmod>{significant_date(p.name)}</lastmod></url>')
          lines.append('</urlset>')
          pathlib.Path('sitemap.xml').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          print('GUIDES',len(guides))
          print('CHANGED_HTML',len(set(changed)))
          print('SITEMAP_URLS',len(pages))

      - name: Build optimized CSS and JavaScript assets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes clean-css-cli@5 -O1 -o site-v625.min.css site-v269.css
          npx --yes terser@5 site-v269-core-v465.js -c passes=1 -o site-core-v625.min.js
          npx --yes terser@5 site-author-v615.js -c passes=1 -o site-author-v625.min.js
          sed -e 's#site-v269-core-v465.js?v=465#site-core-v625.min.js?v=625#g' \
              -e 's#site-author-v615.js?v=615#site-author-v625.min.js?v=625#g' \
              site-v269.js > /tmp/site-v625-loader.js
          npx --yes terser@5 /tmp/site-v625-loader.js -c passes=1 -o site-v625.min.js
          node --check site-core-v625.min.js
          node --check site-author-v625.min.js
          node --check site-v625.min.js
          echo "CSS_SOURCE_BYTES $(wc -c < site-v269.css)"
          echo "CSS_MIN_BYTES $(wc -c < site-v625.min.css)"
          echo "CORE_SOURCE_BYTES $(wc -c < site-v269-core-v465.js)"
          echo "CORE_MIN_BYTES $(wc -c < site-core-v625.min.js)"

      - name: Update service worker for optimized assets
        shell: python
        run: |
          import pathlib,re
          p=pathlib.Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CACHE_NAME = 'belaya-mgla-v\d+';","const CACHE_NAME = 'belaya-mgla-v625';",s)
          s=re.sub(r"'\./site-v269\.css\?v=\d+'","'./site-v625.min.css?v=625'",s)
          s=re.sub(r"'\./site-v269\.js\?v=\d+'","'./site-v625.min.js?v=625'",s)
          p.write_text(s,encoding='utf-8')

      - name: Audit generated upgrade
        shell: python
        run: |
          import pathlib,re,xml.etree.ElementTree as ET
          guides=set([
            'alliance-championship.html','alliance-mobilization.html','alliance-showdown.html','arena.html',
            'armament-competition.html','beacon.html','bear.html','brothers-in-arms.html','buildings-after-fire.html',
            'buildings-before-fire.html','buildings.html','castle.html','cheats.html','crazy-joe.html','dreams.html',
            'endless-trial.html','experts.html','exploration.html','farm.html','fishing.html','forts.html','foundry.html',
            'frostfire-mine.html','gear.html','ginas-revenge.html','governor-orders.html','governor.html','heroes.html',
            'island.html','labyrinth.html','mails.html','mercenary-prestige.html','newbie.html','pets.html',
            'president-guide.html','research.html','resources.html','snowplow.html','state-positions.html','svs-prep.html',
            'svs.html','troops.html','tundra-trade-route.html','winter-siege.html'
          ])
          guides={g for g in guides if pathlib.Path(g).exists()}
          article=crumb=related=0
          old_assets=[]
          for p in pathlib.Path('.').glob('*.html'):
            s=p.read_text(encoding='utf-8',errors='ignore')
            if p.name in guides:
              article += ('guide-article-schema-v625' in s)
              crumb += ('guide-breadcrumb-schema-v625' in s)
              related += ('related-guides-v625' in s)
            if re.search(r'site-v269\.(?:css|js)\?v=',s): old_assets.append(p.name)
          assert article==len(guides),(article,len(guides))
          assert crumb==len(guides),(crumb,len(guides))
          assert related==len(guides),(related,len(guides))
          assert not old_assets,old_assets
          assert pathlib.Path('site-v625.min.css').stat().st_size < pathlib.Path('site-v269.css').stat().st_size
          assert pathlib.Path('site-core-v625.min.js').stat().st_size < pathlib.Path('site-v269-core-v465.js').stat().st_size
          ET.parse('sitemap.xml')
          print('ARTICLE_SCHEMAS',article)
          print('BREADCRUMB_SCHEMAS',crumb)
          print('RELATED_SECTIONS',related)
          print('OLD_ASSET_REFS',len(old_assets))

      - name: Commit full upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' sitemap.xml service-worker.js site-v269.css site-v625.min.css site-core-v625.min.js site-author-v625.min.js site-v625.min.js
          git commit -m 'Upgrade guide SEO related links and site performance'
          git push

name: Roll back broken v585 to stable v586

on:
  push:
    paths:
      - '.github/workflows/rollback-v585-to-stable-v586.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable site and bust cache
        shell: bash
        run: |
          set -euo pipefail
          STABLE=d7b47cbd1deea774abd4753d47ef2329b43ae620

          # Restore the complete site tree from the last stable commit before v585.
          git rm -r .
          git checkout "$STABLE" -- .

          # Keep harmless repository cleanup from v585 without keeping its frontend changes.
          rm -rf .tmp tools
          rm -f _qa_article.html _qa_index.html v413_toc_fix_report.txt
          rm -f manifest.webmanifest app-icon-192.png app-icon-512.png app-icon-maskable-512.png
          rm -f .github/workflows/v477-bear-cachefix.yml
          rm -f .github/workflows/v479-prestige.yml
          rm -f .github/workflows/v483-prestige-crops.yml
          rm -f .github/workflows/v497-bear-art.yml
          rm -f .github/workflows/run-site-cleanup-v585.yml
          rm -f .github/workflows/finalize-cleanup-v585.yml
          rm -f .github/workflows/rollback-v585-to-stable-v586.yml
          rm -f site-v269-v585.min.css site-v269-core-v585.min.js search-index-v585.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Force every page to fetch the restored stable CSS/JS under a fresh version.
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'site-v269\.css\?v=\d+', 'site-v269.css?v=586', s)
              s=re.sub(r'site-v269\.js\?v=\d+', 'site-v269.js?v=586', s)
              s=re.sub(r'pwa-install\.js\?v=\d+', 'pwa-install.js?v=586', s)
              p.write_text(s,encoding='utf-8')

          p=Path('pwa-install.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'service-worker\.js\?v=\d+', 'service-worker.js?v=586', s)
              p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r"const CACHE_NAME = 'belaya-mgla-v\d+';", "const CACHE_NAME = 'belaya-mgla-v586';", s, count=1)
              # Refresh stable core references too, if present in the precache list.
              s=re.sub(r'site-v269\.css\?v=\d+', 'site-v269.css?v=586', s)
              s=re.sub(r'site-v269\.js\?v=\d+', 'site-v269.js?v=586', s)
              p.write_text(s,encoding='utf-8')
          PY

          node --check site-v269.js
          node --check site-v269-core-v465.js

      - name: Commit stable rollback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rollback broken v585 frontend and restore stable v586'
          git push origin HEAD:main

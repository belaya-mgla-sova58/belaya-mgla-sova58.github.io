name: Temporary Eleonora build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-eleonora-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build page and assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 pillow
          python tmp-eleonora-build.py
          git add hero-eleonora.html sitemap.xml assets/heroes/gen-11/eleonora
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Eleonora generation 11 hero guide'
          git pull --rebase origin main
          git push

name: Temporary Sonya build
on:
  push:
    paths:
      - '.github/workflows/tmp-sonya-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Sonya source image assets
        run: |
          python -m pip install requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          u='https://whiteout-survival.com/ru/heroes/sonya/'
          t=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          s=BeautifulSoup(t,'html.parser')
          for im in s.find_all('img'):
              src=im.get('src') or im.get('data-src') or im.get('data-lazy-src') or ''
              alt=(im.get('alt') or '').strip()
              if src and (alt or 'sonya' in src.lower()):
                  print(alt,'|',urljoin(u,src))
          PY
          exit 1

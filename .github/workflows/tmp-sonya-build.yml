name: Temporary Sonya build
on:
  push:
    paths:
      - '.github/workflows/tmp-sonya-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Sonya hero page
        run: |
          mkdir -p assets/heroes/gen-08/sonya
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Sonya.webp -o assets/heroes/gen-08/sonya/portrait.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Extreme-Cold.webp -o assets/heroes/gen-08/sonya/skill-extreme-cold.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Frozen-Bomb.webp -o assets/heroes/gen-08/sonya/skill-frozen-bomb.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Money-Hungry.webp -o assets/heroes/gen-08/sonya/skill-money-hungry.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Treasure-Hunter.webp -o assets/heroes/gen-08/sonya/skill-treasure-hunter.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Bounty-Temptation.webp -o assets/heroes/gen-08/sonya/skill-bounty-temptation.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Torrential-Impact.webp -o assets/heroes/gen-08/sonya/skill-torrential-impact.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Mangrove-Frog.webp -o assets/heroes/gen-08/sonya/gear-mangrove-frog.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Chilled-to-the-Bone.webp -o assets/heroes/gen-08/sonya/gear-chilled-to-bone.webp
          curl -fL https://whiteout-survival.com/wp-content/uploads/2025/07/Vortex-Turret.webp -o assets/heroes/gen-08/sonya/gear-vortex-turret.webp
          python tmp-sonya-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-sonya.html assets/heroes/gen-08/sonya sitemap.xml
          git commit -m "Add Sonya hero guide"
          git pull --rebase origin main
          git push origin main

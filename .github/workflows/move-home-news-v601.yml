name: Move homepage news v601
on:
  push:
    paths:
      - 'patch-home-news-v601.py'
      - '.github/workflows/move-home-news-v601.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-home-news-v601.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Move homepage news higher" || true
          git push
      - run: |
          git rm .github/workflows/move-home-news-v601.yml patch-home-news-v601.py
          git commit -m "Remove homepage news patch files"
          git push

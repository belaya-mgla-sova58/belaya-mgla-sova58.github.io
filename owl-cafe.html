function demo(){mode='demo';game=G.make();role='waiter';clearRecipe();render(true);}function clearRecipe(){selected=null;station=null;ingredients=[];error='';}function switchRole(r){role=r;clearRecipe();render(true);}
async function api(b){const resp=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await resp.json();if(!resp.ok)throw Error(d.error||'Ошибка связи');return d;}
async function create(r){if(location.protocol==='file:')return $('err').textContent='Для онлайна нужен запуск server.js из архива.';try{enter(await api({op:'create',role:r}));}catch(e){$('err').textContent=e.message;}}
async function join(){if(location.protocol==='file:')return $('err').textContent='Для онлайна нужен запуск server.js из архива.';try{enter(await api({op:'join',code:$('code').value.trim()}));}catch(e){$('err').textContent=e.message;}}
function enter(d){online={code:d.code,key:d.key};role=d.role;mode='online';game=d.game;offset=d.now-Date.now();clearRecipe();render(true);}
async function poll(){if(!online||polling||acting)return;polling=true;const session=online;try{const d=await api({op:'state',...session});if(online!==session)return;game=d.game;offset=d.now-Date.now();render();}catch(e){if(online===session){error='Связь прервана: '+e.message;render(true);}}finally{polling=false;}}

const sig=JSON.stringify([role,game.orders.map(o=>[o.status,o.arrive<=now()]),game[role],game.money,game.notice,game.errors,selected,station,ingredients,error]);if(!force&&sig===lastState){updateTime();return;}lastState=sig;const a=$('actor'),old=a&&a.style.left?[a.style.left,a.style.top]:null;app.innerHTML=`<header><div><small>СОВИНАЯ СМЕНА ${online?'· Комната '+online.code:'· Тестовый режим'}</small><h1>Совиный ресторан</h1></div><div class="stats"><div class="stat timer"><small>Общее время</small><b id="time">${fmt(game.end-now())}</b></div><div class="stat"><small>Выручка</small><b>🪙 ${game.money}</b></div><div class="stat"><small>Гости</small><b>${game.served}/6</b></div></div></header><div class="bar"><i id="progress"></i></div><div class="row" style="margin-bottom:10px"><div class="row">${mode==='demo'?btn('🤵 Официант',"switchRole('waiter')",false,role==='waiter'?'active':'')+btn('👨‍🍳 Повар',"switchRole('chef')",false,role==='chef'?'active':''):`<b>${role==='waiter'?'🤵 Официант':'👨‍🍳 Повар'}</b>`}<span class="busy" id="busy"></span></div>${btn('Выйти','home()')}</div><div class="layout">${role==='waiter'?waiter():chef()}</div><div class="owlmsg"><b>${owlArt()}</b><span>${game.notice}</span></div><p class="warn">${error}</p>`;pos(old);updateTime();}
function updateTime(){if(!game||!$('time'))return;$('time').textContent=fmt(game.end-now());$('progress').style.width=Math.max(0,Math.min(100,(game.end-now())/3000))+'%';const b=game[role].busy;$('busy').textContent=b?'В работе: '+Math.max(0,Math.ceil((b.until-now())/1000))+' сек.':'';}
setInterval(()=>{if(mode==='demo'&&game){G.tick(game);render();}else if(mode==='online'){updateTime();}},200);setInterval(poll,500);window.addEventListener('resize',()=>pos());lobby();
</script></body></html>

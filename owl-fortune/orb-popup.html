<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Предсказания совы</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05020c;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.loading{opacity:.72;font-size:15px;letter-spacing:.02em}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div class="loading">🔮</div><script>(async()=>{try{const src=await fetch('orb-original-packed.html?v=20261030-1',{cache:'no-store'}).then(r=>r.text());const m=src.match(/atob\("([A-Za-z0-9+/=]+)"\)/);if(!m)throw new Error('packed orb not found');const bytes=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));let html;if('DecompressionStream' in window){html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{if(!window.pako)throw new Error('pako unavailable');html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes))}const fix='<style id="orbTextFix">.prediction{left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;width:76%!important;max-width:76%!important;max-height:58%!important;margin:0!important;text-align:center!important;justify-items:center!important;align-items:center!important;transform:translate(-50%,-50%) scale(.94)!important;transform-origin:center center!important;line-height:1.3!important;word-break:normal!important;overflow-wrap:break-word!important}.prediction.show{transform:translate(-50%,-50%) scale(1)!important}.exhaustedText{left:50%!important;right:auto!important;width:82%!important;transform:translateX(-50%)!important;text-align:center!important}</style>';html=html.includes('</head>')?html.replace('</head>',fix+'</head>'):fix+html;document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;text-align:center;color:#ffe7a3;font:700 17px/1.4 Georgia,serif">Шар временно прячется в тумане 🔮<br>Обнови страницу.</div>'}})();</script></body></html>

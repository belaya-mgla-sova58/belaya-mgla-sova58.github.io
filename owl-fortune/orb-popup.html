<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Предсказания совы</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,#17092c 0,#090515 48%,#04030a 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;grid-template-rows:1fr auto;place-items:center;padding:18px 18px 16px}.stage{position:relative;width:min(74vw,430px);aspect-ratio:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none}.stage.locked{cursor:default}.orb{position:relative;width:88%;height:88%;border-radius:50%;overflow:hidden;box-shadow:0 0 24px 8px rgba(176,92,255,.45),0 0 70px 24px rgba(69,88,255,.25),inset 0 0 34px rgba(255,255,255,.24);transform:translateZ(0);animation:float 3s ease-in-out infinite}.orb:before{content:"";position:absolute;inset:-18%;border-radius:50%;background:conic-gradient(from 0deg,rgba(90,40,210,.1),rgba(65,195,255,.6),rgba(238,70,255,.72),rgba(75,55,220,.3),rgba(65,195,255,.65),rgba(90,40,210,.1));filter:blur(12px);animation:spin 9s linear infinite}.orb:after{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle at 36% 28%,rgba(255,255,255,.95) 0 1%,transparent 2%),radial-gradient(circle at 68% 38%,rgba(255,255,255,.75) 0 1%,transparent 2%),radial-gradient(circle at 43% 72%,rgba(255,255,255,.65) 0 1.2%,transparent 2.2%),radial-gradient(circle at 56% 54%,rgba(133,235,255,.78),rgba(91,54,210,.82) 25%,rgba(30,12,72,.9) 58%,rgba(8,5,28,.96) 100%);box-shadow:inset -18px -18px 38px rgba(0,0,0,.52),inset 16px 12px 26px rgba(255,255,255,.15);animation:pulse 4.2s ease-in-out infinite}.nebula{position:absolute;inset:18%;z-index:2;border-radius:50%;background:radial-gradient(ellipse at 35% 45%,rgba(255,98,230,.9),transparent 36%),radial-gradient(ellipse at 70% 52%,rgba(70,215,255,.82),transparent 34%),radial-gradient(ellipse at 52% 70%,rgba(129,76,255,.8),transparent 38%);mix-blend-mode:screen;filter:blur(10px);animation:drift 7s ease-in-out infinite alternate}.ring{position:absolute;inset:3%;z-index:3;border-radius:50%;border:2px solid rgba(231,203,255,.22);box-shadow:inset 0 0 24px rgba(255,255,255,.18),0 0 28px rgba(162,92,255,.3);pointer-events:none}.prediction{position:absolute;z-index:5;width:78%;max-height:54%;display:grid;place-items:center;text-align:center;padding:14px 16px;border-radius:18px;background:rgba(10,5,30,.68);border:1px solid rgba(231,211,255,.22);backdrop-filter:blur(6px);font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-weight:800;font-size:clamp(17px,4.2vw,24px);line-height:1.32;text-shadow:0 2px 8px rgba(0,0,0,.8);opacity:0;transform:scale(.94);transition:.35s ease;pointer-events:none}.prediction.show{opacity:1;transform:scale(1)}.stage.charging .orb{animation:charge .9s ease-in-out infinite}.stage.charging .nebula{animation-duration:1.2s}.meta{width:min(92%,430px);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;color:#ffe7a3;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-size:16px;font-weight:800;text-shadow:0 1px 2px #000,0 0 8px rgba(255,225,145,.28)}.counter{white-space:nowrap}.exhaustedText{position:absolute;z-index:6;bottom:7%;left:8%;right:8%;text-align:center;color:#ffe7a3;font:800 16px/1.3 Georgia,serif;text-shadow:0 1px 4px #000;opacity:0;transition:.3s}.stage.locked .exhaustedText{opacity:1}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.035);filter:brightness(1.14)}}@keyframes drift{0%{transform:translate(-5%,-3%) rotate(-8deg) scale(.95)}100%{transform:translate(7%,5%) rotate(14deg) scale(1.1)}}@keyframes charge{0%,100%{transform:scale(1)}50%{transform:scale(1.065);filter:brightness(1.3)}}@media(max-width:640px){.wrap{padding:14px 12px 12px}.stage{width:min(70vw,330px)}.meta{font-size:14px}.prediction{font-size:clamp(15px,4vw,20px)}}
</style></head><body><div class="wrap"><div id="stage" class="stage" role="button" tabindex="0" aria-label="Получить предсказание"><div class="orb"><div class="nebula"></div><div class="ring"></div></div><div id="fortuneText" class="prediction" aria-live="polite"></div><div id="exhaustedText" class="exhaustedText">Сова устала 😴🔮 Приходи завтра.</div></div><div class="meta"><span id="status">Нажми на шар</span><span id="counter" class="counter"></span></div></div><script>
(()=>{const MAX_PER_DAY=2,RARE_CHANCE=.02,STORE_KEY='belaya_mgla_orb_home_preview_v3';const normalBase=['Ты зайдёшь на пять минут и исчезнешь на два часа.','Сегодня кто-то неожиданно окажется на твоей стороне.','Небольшая случайность сыграет тебе на руку.','Один разговор многое расставит по местам.','Сегодня лучше довериться интуиции.','Нужная подсказка попадётся случайно.','К вечеру появится повод улыбнуться.','Одна ошибка окажется не такой уж ошибкой.','Сегодня твой юмор спасёт ситуацию.','Скоро появится повод сказать: «Ну наконец-то».','Не всё сегодня нужно контролировать.','Запасной вариант внезапно станет главным.','Сегодня тебе пригодится спокойствие.','Неожиданное сообщение изменит настроение дня.','Один маленький жест даст большой эффект.','Сегодня можно чуть меньше сомневаться.','Кто-то заметит твои усилия.','То, чего ты опасалась, окажется проще.','Нужный человек объявится сам.','Сегодня ты снова решишь, что уже достаточно. И снова передумаешь.'];const normalTail=['',' Сова одобряет.',' И это ещё не всё.',' Главное, не спорь с судьбой.'];const rareBase=['Сегодня удача рядом. Но делает вид, что не знакома с тобой.','Редкий знак: одно желание получит неожиданно хороший шанс.','Сова видит золотую нить. Скоро случится то, что захочется запомнить.','Сегодня случайность внезапно станет подарком.','Тебе выпадет шанс, который бывает нечасто.','Один поворот событий окажется заметно лучше ожиданий.','Сегодня судьба решила немного подыграть тебе.','Редкое совпадение откроет нужную дверь.','Очень скоро появится причина поверить в удачу.','Сова всё видела. Но решила промолчать.'];const rareTail=['',' И да, это считается хорошим знаком.'];const pfx=['🔮','✨','🌙','⭐','🦉','🍀','💫','🌌'];const sfx=[['😂','⏳'],['😏','✨'],['🦉','🤐'],['🍀','😌'],['🌙','💜'],['⭐','😈'],['🔮','😉'],['💫','😌']];const NORMAL=[];normalBase.forEach((b,i)=>normalTail.forEach((t,j)=>NORMAL.push(`${pfx[(i+j)%pfx.length]} ${b}${t} ${sfx[(i+j)%sfx.length][0]} ${sfx[(i+j)%sfx.length][1]}`)));const RARE=[];rareBase.forEach((b,i)=>rareTail.forEach((t,j)=>RARE.push(`${pfx[(i+j+3)%pfx.length]} ${b}${t} ${sfx[(i+j+3)%sfx.length][0]} ${sfx[(i+j+3)%sfx.length][1]}`)));const stage=document.getElementById('stage'),text=document.getElementById('fortuneText'),statusEl=document.getElementById('status'),counter=document.getElementById('counter');function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fresh(){return{day:dayKey(),count:0,used:[]}}function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(!s||s.day!==dayKey())return fresh();return{day:s.day,count:Math.max(0,Math.min(MAX_PER_DAY,+s.count||0)),used:Array.isArray(s.used)?s.used:[]}}catch(e){return fresh()}}let state=load(),busy=false;function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}function tellParent(mode){try{parent.postMessage({type:'owl-state',state:mode},'*')}catch(e){}}function updateCounter(){counter.textContent='Осталось: '+Math.max(0,MAX_PER_DAY-state.count)+'/'+MAX_PER_DAY}function ensureDay(){if(state.day!==dayKey()){state=fresh();save();idle()}}function idle(){busy=false;stage.classList.remove('locked','charging');text.classList.remove('show');text.textContent='';statusEl.textContent='Нажми на шар';tellParent('active');updateCounter()}function exhausted(){busy=false;stage.classList.remove('charging');stage.classList.add('locked');text.classList.remove('show');statusEl.textContent='На сегодня всё';tellParent('sleep');updateCounter()}function pick(arr,tag){let pool=arr.map((_,i)=>i).filter(i=>!state.used.includes(tag+i));if(!pool.length)pool=arr.map((_,i)=>i);const i=pool[Math.floor(Math.random()*pool.length)];state.used.push(tag+i);return arr[i]}function reveal(){if(busy||state.count>=MAX_PER_DAY)return;busy=true;stage.classList.add('charging');text.classList.remove('show');statusEl.textContent='Сова смотрит в туман…';setTimeout(()=>{const rare=Math.random()<RARE_CHANCE;const msg=pick(rare?RARE:NORMAL,rare?'r':'n');state.count++;save();stage.classList.remove('charging');text.textContent=msg;text.classList.add('show');statusEl.textContent=rare?'Редкое предсказание ✨':'Предсказание готово';updateCounter();busy=false;if(state.count>=MAX_PER_DAY)setTimeout(exhausted,3200)},1150)}stage.addEventListener('click',reveal);stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}});setInterval(ensureDay,30000);updateCounter();if(state.count>=MAX_PER_DAY)exhausted();else idle();})();
</script></body></html>

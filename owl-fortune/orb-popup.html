<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предсказания совы</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#17072e 0,#090313 54%,#030107 100%);font-family:Georgia,'Times New Roman',serif;color:#fff}
.scene{position:relative;width:min(86vw,500px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 28px 40px rgba(0,0,0,.5))}
.aura{position:absolute;width:82%;height:82%;border-radius:50%;background:radial-gradient(circle,rgba(142,74,255,.18),rgba(96,39,190,.09) 45%,transparent 72%);filter:blur(8px);animation:aura 4.8s ease-in-out infinite}
.orb{position:relative;width:72%;height:72%;border-radius:50%;overflow:hidden;cursor:pointer;touch-action:manipulation;background:radial-gradient(circle at 33% 25%,rgba(255,255,255,.82) 0 2%,rgba(255,255,255,.16) 8%,transparent 22%),radial-gradient(circle at 62% 68%,rgba(109,70,255,.8),transparent 28%),radial-gradient(circle at 34% 61%,rgba(44,170,255,.5),transparent 34%),radial-gradient(circle at 52% 48%,#5120a2 0,#260957 42%,#0a021c 76%,#030107 100%);box-shadow:inset 0 0 28px rgba(255,255,255,.14),inset 0 0 85px rgba(104,52,235,.5),0 0 12px rgba(216,188,255,.8),0 0 44px rgba(117,51,226,.75),0 0 90px rgba(68,34,173,.44);border:1px solid rgba(235,221,255,.62);animation:float 4.6s ease-in-out infinite}
.orb.preparing{animation:prepareShake .085s linear infinite}
.orb:before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,transparent 0 9%,rgba(130,79,255,.28) 15%,transparent 24% 42%,rgba(34,151,255,.22) 49%,transparent 61% 76%,rgba(216,120,255,.2) 84%,transparent 96%);filter:blur(18px);animation:spin 13s linear infinite}
.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 52%,transparent 0 57%,rgba(225,210,255,.2) 73%,rgba(255,255,255,.38) 81%,transparent 86%);pointer-events:none}
.nebula,.nebula2{position:absolute;border-radius:50%;filter:blur(24px);mix-blend-mode:screen;opacity:.72;pointer-events:none}.nebula{width:58%;height:28%;left:8%;top:49%;background:linear-gradient(90deg,transparent,#793cff,#3cbcff,transparent);transform:rotate(-18deg);animation:drift1 8s ease-in-out infinite alternate}.nebula2{width:46%;height:24%;right:6%;top:31%;background:linear-gradient(90deg,transparent,#ff69dc,#5a44ff,transparent);transform:rotate(24deg);animation:drift2 9s ease-in-out infinite alternate}
.stars{position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle at 19% 24%,#fff 0 1.2px,transparent 1.8px),radial-gradient(circle at 75% 22%,#fff 0 1px,transparent 1.7px),radial-gradient(circle at 68% 70%,#cfddff 0 1.1px,transparent 1.7px),radial-gradient(circle at 29% 74%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 47% 17%,#fff 0 .8px,transparent 1.4px),radial-gradient(circle at 83% 48%,#fff 0 .9px,transparent 1.5px),radial-gradient(circle at 38% 48%,#fff 0 1px,transparent 1.5px);animation:twinkle 3.1s ease-in-out infinite alternate;pointer-events:none}
.text{position:absolute;z-index:6;left:50%;top:50%;width:66%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(17px,4.2vw,27px);line-height:1.22;font-weight:700;text-shadow:0 2px 9px #170327,0 0 13px rgba(216,190,255,.9);opacity:0;transition:opacity .35s ease,transform .35s ease;pointer-events:none}.text.show{opacity:1;transform:translate(-50%,-50%) scale(1.02)}
.hint{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);font:600 clamp(12px,2.7vw,15px)/1.2 system-ui,-apple-system,'Segoe UI',sans-serif;color:rgba(239,229,255,.74);letter-spacing:.03em;white-space:nowrap}.count{position:absolute;top:3%;left:50%;transform:translateX(-50%);font:600 12px/1.2 system-ui,-apple-system,'Segoe UI',sans-serif;color:rgba(234,218,255,.62)}
.exhausted .orb{filter:saturate(.72) brightness(.78)}.exhausted .hint{color:#d9c4ff}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes prepareShake{0%{transform:translate(-2px,0) rotate(-.35deg)}25%{transform:translate(1px,-1px) rotate(.25deg)}50%{transform:translate(2px,1px) rotate(.35deg)}75%{transform:translate(-1px,1px) rotate(-.2deg)}100%{transform:translate(-2px,0) rotate(-.35deg)}}@keyframes aura{0%,100%{transform:scale(.95);opacity:.58}50%{transform:scale(1.06);opacity:.95}}@keyframes drift1{0%{transform:translate(-7%,4%) rotate(-18deg) scale(.92)}100%{transform:translate(10%,-8%) rotate(-10deg) scale(1.12)}}@keyframes drift2{0%{transform:translate(8%,-4%) rotate(24deg) scale(1)}100%{transform:translate(-10%,9%) rotate(32deg) scale(1.13)}}@keyframes twinkle{0%{opacity:.46;transform:scale(.985)}100%{opacity:1;transform:scale(1.015)}}
@media(max-width:560px){.scene{width:min(92vw,470px)}.orb{width:76%;height:76%}.text{width:68%}}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="aura"></div><div class="count" id="count"></div><div class="orb" id="orb" role="button" tabindex="0" aria-label="Получить предсказание"><div class="nebula"></div><div class="nebula2"></div><div class="stars"></div><div class="text" id="fortuneText"></div></div><div class="hint" id="hint">Нажми на шар</div></div>
<script>
(()=>{
const MAX=3,RARE_CHANCE=.02,STORE_KEY='belaya_mgla_orb_phrases_v1';
const normalBase=['Ты зайдёшь на пять минут и исчезнешь на два часа.','Сегодня кто-то неожиданно окажется на твоей стороне.','Небольшая случайность сыграет тебе на руку.','Один разговор многое расставит по местам.','Сегодня лучше довериться интуиции.','Нужная подсказка попадётся случайно.','К вечеру появится повод улыбнуться.','Одна ошибка окажется не такой уж ошибкой.','Сегодня твой юмор спасёт ситуацию.','Скоро появится повод сказать: «Ну наконец-то».','Не всё сегодня нужно контролировать.','Запасной вариант внезапно станет главным.','Сегодня тебе пригодится спокойствие.','Неожиданное сообщение изменит настроение дня.','Один маленький жест даст большой эффект.','Сегодня можно чуть меньше сомневаться.','Кто-то заметит твои усилия.','То, чего ты опасалась, окажется проще.','Нужный человек объявится сам.','Сегодня ты снова решишь, что уже достаточно. И снова передумаешь.'];
const normalTail=['',' Сова одобряет.',' И это ещё не всё.',' Главное, не спорь с судьбой.'];
const rareBase=['Сегодня удача рядом. Но делает вид, что не знакома с тобой.','Редкий знак: одно желание получит неожиданно хороший шанс.','Сова видит золотую нить. Скоро случится то, что захочется запомнить.','Сегодня случайность внезапно станет подарком.','Тебе выпадет шанс, который бывает нечасто.','Один поворот событий окажется заметно лучше ожиданий.','Сегодня судьба решила немного подыграть тебе.','Редкое совпадение откроет нужную дверь.','Очень скоро появится причина поверить в удачу.','Сова всё видела. Но решила промолчать.'];
const rareTail=['',' И да, это считается хорошим знаком.'];
const pfx=['🔮','✨','🌙','⭐','🦉','🍀','💫','🌌'];
const sfx=[['😂','⏳'],['😏','✨'],['🦉','🤐'],['🍀','😌'],['🌙','💜'],['⭐','😈'],['🔮','😉'],['💫','😌']];
const NORMAL=[];normalBase.forEach((b,i)=>normalTail.forEach((t,j)=>NORMAL.push(`${pfx[(i+j)%pfx.length]} ${b}${t} ${sfx[(i+j)%sfx.length][0]} ${sfx[(i+j)%sfx.length][1]}`)));
const RARE=[];rareBase.forEach((b,i)=>rareTail.forEach((t,j)=>RARE.push(`${pfx[(i+j+3)%pfx.length]} ${b}${t} ${sfx[(i+j+3)%sfx.length][0]} ${sfx[(i+j+3)%sfx.length][1]}`)));
const scene=document.getElementById('scene'),orb=document.getElementById('orb'),text=document.getElementById('fortuneText'),hint=document.getElementById('hint'),count=document.getElementById('count');
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fresh(){return{day:dayKey(),count:0,used:[]}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(!s||s.day!==dayKey())return fresh();return{day:s.day,count:Math.max(0,Math.min(MAX,+s.count||0)),used:Array.isArray(s.used)?s.used:[]}}catch(e){return fresh()}}
let state=load(),busy=false;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}
function tellParent(mode){try{parent.postMessage({type:'owl-state',state:mode},'*')}catch(e){}}
function updateCounter(){count.textContent=`Предсказания: ${state.count}/${MAX}`}
function pick(arr,tag){let pool=arr.map((_,i)=>i).filter(i=>!state.used.includes(tag+i));if(!pool.length)pool=arr.map((_,i)=>i);const i=pool[Math.floor(Math.random()*pool.length)];state.used.push(tag+i);return arr[i]}
function sync(){updateCounter();if(state.count>=MAX){scene.classList.add('exhausted');text.textContent='Сова устала предсказывать ✨\nПриходи завтра';text.style.whiteSpace='pre-line';text.classList.add('show');hint.textContent='На сегодня магия закончилась';tellParent('sleep')}else{scene.classList.remove('exhausted');hint.textContent='Нажми на шар';tellParent('active')}}
function predict(){if(busy||state.count>=MAX){sync();return}busy=true;text.classList.remove('show');orb.classList.add('preparing');hint.textContent='Сова заглядывает в туман...';setTimeout(()=>{const rare=Math.random()<RARE_CHANCE;const msg=pick(rare?RARE:NORMAL,rare?'r':'n');state.count++;save();orb.classList.remove('preparing');text.style.whiteSpace='normal';text.textContent=msg;text.classList.add('show');hint.textContent=rare?'РЕДКОЕ ПРЕДСКАЗАНИЕ ✨':(state.count<MAX?'Можно спросить ещё':'Последнее предсказание на сегодня');updateCounter();busy=false;if(state.count>=MAX)setTimeout(sync,3200)},720)}
orb.addEventListener('click',predict);orb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();predict()}});sync();
})();
</script>
</body>
</html>

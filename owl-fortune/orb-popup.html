<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Предсказания совы</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.wrap{width:100%;height:100%;display:grid;grid-template-rows:1fr auto;place-items:center;padding:10px}.stage{position:relative;width:min(88vw,620px);aspect-ratio:1536/1472;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(87,40,130,.18),rgba(4,2,8,.50) 72%);border:1px solid rgba(218,190,255,.14);box-shadow:inset 0 0 45px rgba(32,9,58,.55)}.stage.locked{cursor:default}.orb-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .23s ease;background:transparent;pointer-events:none}.orb-video.active{opacity:1}.prediction{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:54%;height:25%;padding:7px 10px;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:clamp(13px,2.5vw,22px);line-height:1.1;font-weight:600;color:#fbf4ff;text-shadow:0 2px 10px rgba(0,0,0,.92),0 0 8px rgba(180,116,255,.28);opacity:1;transition:opacity .3s ease;overflow:hidden}.prediction.hidden{opacity:0}.prediction.rare{color:#fff0ae}.prediction.exhausted{color:#ded1ef}.meta{width:min(92%,620px);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:#ffe7a3;font-size:18px;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;font-weight:800;letter-spacing:.025em;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 9px rgba(255,225,145,.32)}.counter{white-space:nowrap}@media(max-width:700px){.wrap{padding:5px}.stage{width:min(94vw,620px);border-radius:18px}.meta{font-size:16px;margin-top:7px}.prediction{width:56%;height:26%;font-size:clamp(12px,4vw,18px)}}@media(prefers-reduced-motion:reduce){.orb-video,.prediction{transition:none}}</style></head><body><div class="wrap"><div id="orbStage" class="stage" role="button" tabindex="0" aria-label="Получить предсказание"><video id="v1" class="orb-video" src="media/orb-1-idle.mp4?v=5" muted playsinline preload="auto" loop></video><video id="v2" class="orb-video" src="media/orb-2-charge.mp4?v=5" muted playsinline preload="auto"></video><video id="v3" class="orb-video" src="media/orb-3-normal.mp4?v=5" muted playsinline preload="auto" loop></video><video id="v4" class="orb-video" src="media/orb-4-rare.mp4?v=5" muted playsinline preload="auto" loop></video><video id="v5" class="orb-video" src="media/orb-5-exhausted.mp4?v=5" muted playsinline preload="auto" loop></video><div id="fortuneText" class="prediction hidden" aria-live="polite"></div></div><div class="meta"><span id="status">Шар готов</span><span id="counter" class="counter"></span></div></div><script>
(()=>{const MAX_PER_DAY=2,RARE_CHANCE=.02,STORE_KEY='belaya_mgla_orb_home_preview_v3',EXHAUSTED_TEXT='Сова устала 😴🔮 Приходи завтра.';
const normalBase=['Ты зайдёшь на пять минут и исчезнешь на два часа.','Сегодня кто-то неожиданно окажется на твоей стороне.','Небольшая случайность сыграет тебе на руку.','Один разговор многое расставит по местам.','Сегодня лучше довериться интуиции.','Нужная подсказка попадётся случайно.','К вечеру появится повод улыбнуться.','Одна ошибка окажется не такой уж ошибкой.','Сегодня твой юмор спасёт ситуацию.','Скоро появится повод сказать: «Ну наконец-то».','Не всё сегодня нужно контролировать.','Запасной вариант внезапно станет главным.','Сегодня тебе пригодится спокойствие.','Неожиданное сообщение изменит настроение дня.','Один маленький жест даст большой эффект.','Сегодня можно чуть меньше сомневаться.','Кто-то заметит твои усилия.','То, чего ты опасалась, окажется проще.','Нужный человек объявится сам.','Сегодня ты снова решишь, что уже достаточно. И снова передумаешь.'];
const normalTail=['',' Сова одобряет.',' И это ещё не всё.',' Главное, не спорь с судьбой.'];
const rareBase=['Сегодня удача рядом. Но делает вид, что не знакома с тобой.','Редкий знак: одно желание получит неожиданно хороший шанс.','Сова видит золотую нить. Скоро случится то, что захочется запомнить.','Сегодня случайность внезапно станет подарком.','Тебе выпадет шанс, который бывает нечасто.','Один поворот событий окажется заметно лучше ожиданий.','Сегодня судьба решила немного подыграть тебе.','Редкое совпадение откроет нужную дверь.','Очень скоро появится причина поверить в удачу.','Сова всё видела. Но решила промолчать.'];
const rareTail=['',' И да, это считается хорошим знаком.'],pfx=['🔮','✨','🌙','⭐','🦉','🍀','💫','🌌'],sfx=[['😂','⏳'],['😏','✨'],['🦉','🤐'],['🍀','😌'],['🌙','💜'],['⭐','😈'],['🔮','😉'],['💫','😌']];
const NORMAL=[];normalBase.forEach((b,i)=>normalTail.forEach((t,j)=>NORMAL.push(`${pfx[(i+j)%pfx.length]} ${b}${t} ${sfx[(i+j)%sfx.length][0]} ${sfx[(i+j)%sfx.length][1]}`)));const RARE=[];rareBase.forEach((b,i)=>rareTail.forEach((t,j)=>RARE.push(`${pfx[(i+j+3)%pfx.length]} ${b}${t} ${sfx[(i+j+3)%sfx.length][0]} ${sfx[(i+j+3)%sfx.length][1]}`)));
const stage=document.getElementById('orbStage'),text=document.getElementById('fortuneText'),status=document.getElementById('status'),counter=document.getElementById('counter'),videos=[null,...[1,2,3,4,5].map(n=>document.getElementById('v'+n))];let busy=false;
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function fresh(){return{day:dayKey(),count:0,used:[]}}function load(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');return!s||s.day!==dayKey()?fresh():{day:s.day,count:Math.max(0,Math.min(MAX_PER_DAY,+s.count||0)),used:Array.isArray(s.used)?s.used:[]}}catch{return fresh()}}let state=load();function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch{}}function owl(mode){try{parent.postMessage({type:'owl-state',state:mode},'*')}catch{}}function count(){counter.textContent='Осталось: '+Math.max(0,MAX_PER_DAY-state.count)+'/'+MAX_PER_DAY}function stop(){videos.slice(1).forEach(v=>{v.pause();v.classList.remove('active')})}function loop(n){stop();const v=videos[n];v.loop=true;try{v.currentTime=0}catch{}v.classList.add('active');v.play().catch(()=>{})}function charge(){stop();const v=videos[2];v.loop=false;try{v.currentTime=0}catch{}v.classList.add('active');v.play().catch(()=>{});return v}function setText(t,c=''){text.textContent=t;text.className='prediction'+(c?' '+c:'')+(t?'':' hidden')}function pick(arr,tag){let pool=arr.map((_,i)=>i).filter(i=>!state.used.includes(tag+i));if(!pool.length)pool=arr.map((_,i)=>i);const i=pool[Math.floor(Math.random()*pool.length)];state.used.push(tag+i);return arr[i]}function idle(){busy=false;stage.classList.remove('locked');owl('active');loop(1);setText('');status.textContent='Нажми на шар';count()}function exhausted(){busy=false;stage.classList.add('locked');owl('sleep');loop(5);setTimeout(()=>setText(EXHAUSTED_TEXT,'exhausted'),450);status.textContent='На сегодня всё';count()}function ensureDay(){if(state.day!==dayKey()){state=fresh();save();idle()}}async function reveal(){ensureDay();if(busy)return;if(state.count>=MAX_PER_DAY){exhausted();return}busy=true;stage.classList.add('locked');owl('active');setText('');status.textContent='Шар готовит предсказание';const rare=Math.random()<RARE_CHANCE,msg=pick(rare?RARE:NORMAL,rare?'r':'n'),v=charge();await new Promise(r=>{let done=false;const f=()=>{if(done)return;done=true;r()};v.addEventListener('ended',f,{once:true});setTimeout(f,5400)});loop(rare?4:3);setTimeout(()=>setText(msg,rare?'rare':''),450);state.count++;save();count();status.textContent=rare?'✨ Редкое предсказание':state.count>=MAX_PER_DAY?'Второе предсказание':'Нажми снова для нового предсказания';busy=false;stage.classList.remove('locked');if(state.count>=MAX_PER_DAY)setTimeout(exhausted,3200)}stage.addEventListener('click',reveal);stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}});setInterval(ensureDay,30000);count();state.count>=MAX_PER_DAY?exhausted():idle();})();
</script></body></html>

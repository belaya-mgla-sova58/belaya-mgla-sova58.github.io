<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031426">
<meta name="robots" content="noindex,nofollow">
<title>Белая Мгла</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031426;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.welcome{position:fixed;inset:0;background:#031426;color:#fff}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(1.025);animation:welcomeZoom 5.2s ease-out forwards}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,13,31,.12),rgba(1,13,31,.01) 48%,rgba(1,13,31,.64));pointer-events:none}.brand{position:absolute;top:max(42px,calc(env(safe-area-inset-top) + 22px));left:22px;right:22px;text-align:center;text-shadow:0 3px 18px rgba(0,12,35,.85)}.brand strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,9vw,58px);letter-spacing:.04em;line-height:1.02}.brand span{display:block;margin-top:8px;font-size:clamp(14px,4vw,20px);font-weight:800;letter-spacing:.18em;color:#d8f3ff}.phrase{position:absolute;left:7vw;right:7vw;bottom:max(54px,calc(env(safe-area-inset-bottom) + 34px));min-height:78px;padding:19px 22px;border:1px solid rgba(144,222,255,.72);border-radius:28px;background:linear-gradient(180deg,rgba(17,112,184,.92),rgba(4,48,95,.92));box-shadow:0 14px 34px rgba(0,12,38,.38),inset 0 1px rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(18px,5vw,27px);font-weight:900;line-height:1.25;text-shadow:0 2px 8px rgba(0,20,55,.6);opacity:0;transform:translateY(14px);animation:phraseIn .55s .45s ease forwards}.welcome.fade{animation:welcomeFade .55s ease forwards}@keyframes welcomeZoom{to{transform:scale(1)}}@keyframes phraseIn{to{opacity:1;transform:translateY(0)}}@keyframes welcomeFade{to{opacity:0}}@media(prefers-reduced-motion:reduce){.scene,.phrase,.welcome.fade{animation:none!important}.phrase{opacity:1;transform:none}}
</style>
<script src="assets/splash-v750-data.js?v=750"></script>
</head>
<body>
<main class="welcome" id="welcomeScreen" aria-label="Добро пожаловать в Белую Мглу">
<img id="welcomeImage" class="scene" alt="Белая Мгла, зимний замок и белая сова" decoding="sync">
<div class="shade" aria-hidden="true"></div>
<div class="brand"><strong>БЕЛАЯ МГЛА</strong><span>58-е государство</span></div>
<div class="phrase" id="welcomePhrase"></div>
</main>
<script>
(function(){
'use strict';
var phrases=['Добро пожаловать в Белую мглу.','Сова уже на месте. Можно начинать.','Здесь собраны полезные материалы для игроков 58-го.','Устраивайтесь поудобнее.','Добро пожаловать, путник.','Пора заглянуть в Белую мглу.','Хорошего дня и удачных событий!','Пусть сегодня всё идёт по плану.','Проверим, что нового в 58-м?','Время заглянуть в события и награды.','Не забудьте про ежедневные задания.','Пусть сборы будут быстрыми, а награды щедрыми.','Готовы? Тогда отправляемся в Белую мглу!','Загляните в гайды перед следующим событием.','Пусть сегодня хватит и ресурсов, и ускорений.','Хорошей игры и приятной компании!','Новый день, новые события, новые награды.','Пусть ваши отряды всегда возвращаются с победой.','Проверим календарь и ничего не пропустим.','58-е уже здесь. Присоединяйтесь!'];
var phrase=document.getElementById('welcomePhrase'),image=document.getElementById('welcomeImage'),screen=document.getElementById('welcomeScreen'),started=false;
phrase.textContent=phrases[Math.floor(Math.random()*phrases.length)];
function home(){if(screen)screen.classList.add('fade');setTimeout(function(){location.replace('index.html?from=welcome-v750')},520)}
function start(){if(started)return;started=true;setTimeout(home,4480)}
image.onload=start;
image.onerror=function(){location.replace('index.html?from=welcome-v750')};
if(window.__bmSplashData){image.src=window.__bmSplashData}else{location.replace('index.html?from=welcome-v750')}
if(image.complete&&image.naturalWidth>0)start();
setTimeout(function(){if(!started)location.replace('index.html?from=welcome-v750')},6500);
})();
</script>
</body>
</html>

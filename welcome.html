<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031426">
<meta name="robots" content="noindex,nofollow">
<title>Белая Мгла</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031426;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.welcome{position:fixed;inset:0;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 38%,rgba(25,86,143,.34),transparent 31%),radial-gradient(circle at 50% 115%,rgba(19,91,153,.22),transparent 36%),linear-gradient(180deg,#041b34 0%,#031426 52%,#02101f 100%)}.stars{position:absolute;inset:0;opacity:.34;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.6px),radial-gradient(circle,#9edcff 0 1px,transparent 1.6px);background-size:58px 58px,91px 91px;background-position:8px 10px,32px 41px;animation:starsIn 1.2s ease both}.title{position:absolute;left:50%;top:max(7.5vh,calc(env(safe-area-inset-top) + 34px));transform:translateX(-50%) translateY(-10px);width:90%;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,9vw,56px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#f7fbff;text-shadow:0 4px 18px rgba(22,117,196,.55),0 1px 0 rgba(255,255,255,.45);opacity:0;animation:titleIn .55s .12s ease forwards}.art-wrap{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%) scale(.95);width:min(64vw,355px);aspect-ratio:1/1;border-radius:24px;padding:1px;background:linear-gradient(145deg,rgba(172,230,255,.9),rgba(35,126,206,.28),rgba(255,255,255,.65));box-shadow:0 0 0 1px rgba(112,205,255,.16),0 0 42px rgba(44,153,255,.22),0 24px 55px rgba(0,0,0,.42);opacity:0;animation:artIn .62s .42s cubic-bezier(.2,.75,.25,1) forwards}.art{display:block;width:100%;height:100%;object-fit:cover;border-radius:23px}.phrase{position:absolute;left:6.2vw;right:6.2vw;bottom:max(5.9vh,calc(env(safe-area-inset-bottom) + 24px));min-height:118px;padding:22px 42px;border:1.5px solid rgba(176,230,255,.92);border-radius:34px;background:linear-gradient(180deg,#2399e7 0%,#1476c8 44%,#0b4d99 100%);box-shadow:0 16px 38px rgba(0,15,45,.46),inset 0 1px rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(20px,5.2vw,30px);font-weight:900;line-height:1.24;color:#fff;text-shadow:0 2px 8px rgba(0,20,55,.70);opacity:0;transform:translateY(16px);animation:phraseIn .48s 1.05s ease forwards}.phrase:before,.phrase:after{content:'❄';position:absolute;bottom:17px;font-size:22px;color:#d7f2ff;opacity:.96}.phrase:before{left:28px}.phrase:after{right:28px}.welcome.fade{animation:fadeOut .52s ease forwards}@keyframes starsIn{from{opacity:0}to{opacity:.34}}@keyframes titleIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes artIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes phraseIn{to{opacity:1;transform:translateY(0)}}@keyframes fadeOut{to{opacity:0}}@media(max-width:430px){.title{top:max(6.4vh,calc(env(safe-area-inset-top) + 28px));font-size:clamp(30px,10vw,43px)}.art-wrap{top:42.5%;width:min(65vw,340px);border-radius:20px}.art{border-radius:19px}.phrase{min-height:105px;padding:19px 38px;border-radius:31px}}@media(prefers-reduced-motion:reduce){.stars,.title,.art-wrap,.phrase,.welcome.fade{animation:none!important}.title,.art-wrap,.phrase{opacity:1;transform:none}.title{transform:translateX(-50%)}.art-wrap{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<main class="welcome" id="welcomeScreen" aria-label="Добро пожаловать в Белую Мглу">
<div class="stars" aria-hidden="true"></div>
<div class="title">Белая Мгла</div>
<div class="art-wrap"><img id="welcomeArt" class="art" src="assets/welcome-planet-owl.jpg?v=763" alt="Сова в ледяной сфере" fetchpriority="high" decoding="sync"></div>
<div class="phrase" id="welcomePhrase"></div>
</main>
<script>
(function(){
'use strict';
var phrases=['Добро пожаловать, путник.','Добро пожаловать в Белую Мглу.','Устраивайтесь поудобнее.','Хорошего дня и удачных событий!','Пусть сегодня всё идёт по плану.','Проверим, что нового?','Время заглянуть в события и награды.','Не забудьте про ежедневные задания.','Пусть сборы будут быстрыми, а награды щедрыми.','Готовы? Тогда отправляемся в Белую Мглу!','Пусть сегодня хватит и ресурсов, и ускорений.','Хорошей игры и приятной компании!','Новый день, новые события, новые награды.','Пусть ваши отряды всегда возвращаются с победой.'];
var phrase=document.getElementById('welcomePhrase'),screen=document.getElementById('welcomeScreen'),art=document.getElementById('welcomeArt');
phrase.textContent=phrases[Math.floor(Math.random()*phrases.length)];
art.addEventListener('error',function(){location.replace('index.html?from=welcome-v763-error')},{once:true});
setTimeout(function(){if(screen)screen.classList.add('fade');setTimeout(function(){location.replace('index.html?from=welcome-v763')},500)},4500);
})();
</script>
</body>
</html>
